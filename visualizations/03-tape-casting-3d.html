<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLCC 테이프 캐스팅 3D</title>
<style>
  :root {
    --panel: rgba(15, 20, 27, 0.80);
    --panel-line: rgba(255, 255, 255, 0.12);
    --text: #e9eef3;
    --muted: #9db0c2;
    --accent: #ffb547;
    --accent-ink: #1d1406;
    --g: #8fd0ff;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2229; color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .tag { pointer-events: auto; cursor: pointer; transform: translateY(-6px);
    background: rgba(14, 18, 24, 0.84); color: var(--text); border: 1px solid rgba(255,255,255,.2);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; white-space: nowrap; transition: background .25s, color .25s; }
  .tag b { color: var(--accent); margin-right: 4px; }
  .tag.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tag.active b { color: var(--accent-ink); }
  .sub { pointer-events: none; font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: rgba(255,255,255,.88); color: #1d242c; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .sub.show { opacity: 1; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #left { top: 16px; left: 16px; width: 268px; padding: 14px 14px 12px; }
  #left h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: -.01em; }
  #left .sub-h { font-size: 11.5px; color: var(--muted); margin: 0 0 10px; }
  #stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  #stages button { width: 100%; text-align: left; background: transparent; color: var(--text); border: 0;
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #stages button:hover { background: rgba(255,255,255,.07); }
  #stages button.active { background: rgba(255,181,71,.16); color: #fff; }
  #stages .n { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px;
    background: rgba(255,255,255,.1); flex: none; }
  #stages button.active .n { background: var(--accent); color: var(--accent-ink); }
  #stages .bar { height: 2px; background: var(--accent); width: 0; border-radius: 2px; margin-top: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .controls button, .controls select { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line);
    border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .controls select option { color: #111; }
  .controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #info { right: 16px; bottom: 16px; width: 390px; max-height: calc(100vh - 32px); overflow: auto; padding: 16px; box-sizing: border-box; }
  #info .head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
  #info .fold { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line); border-radius: 8px; padding: 3px 8px; font: inherit; font-size: 11.5px; cursor: pointer; flex: none; }
  #info.collapsed .body { display: none; }
  #info.collapsed h2 { margin-bottom: 0; }
  #info .kicker { font-size: 11px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
  #info h2 { font-size: 18px; margin: 2px 0 6px; }
  #info p { font-size: 13px; line-height: 1.55; color: #d5dde5; margin: 0 0 10px; }
  #info h3 { font-size: 11.5px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; letter-spacing: .03em; }
  #info ul { margin: 0; padding-left: 16px; font-size: 12.5px; line-height: 1.55; }
  #info li { margin-bottom: 2px; }
  #info code { font-size: 11px; color: var(--g); }
  .g { color: #ffcf8a; font-size: 11px; }
  .canvas-wrap { margin-top: 8px; background: rgba(0,0,0,.25); border-radius: 8px; padding: 6px; }
  .canvas-wrap canvas { width: 100%; display: block; }
  .cap { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .foot { font-size: 10.5px; color: var(--muted); margin-top: 12px; line-height: 1.5; border-top: 1px solid var(--panel-line); padding-top: 8px; }
  /* process-flow branches */
  #left { max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; }
  #stages li.fork { display: grid; gap: 3px; margin: 3px 0; padding: 6px 6px 6px 7px;
    border: 1px dashed rgba(255,255,255,.2); border-radius: 10px; }
  #stages .fork-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; padding: 0 2px 2px; }
  #stages .fk { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  #stages .seg { display: inline-flex; background: rgba(255,255,255,.07); border-radius: 999px; padding: 2px; gap: 2px; }
  #stages .seg button { width: auto; display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; color: var(--muted); }
  #stages .seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  #stages .opt { display: grid; gap: 2px; padding-left: 7px; border-left: 2px solid rgba(255,255,255,.14); }
  #stages .opt.on { border-left-color: var(--accent); }
  #stages .opt-label { font-size: 10.5px; color: var(--muted); padding: 1px 0 0 2px; }
  #stages .opt.off > button { opacity: .45; }
  #stages .opt.off .n { background: transparent; border: 1px dashed rgba(255,255,255,.3); }
  #stages .skip { font-size: 11.5px; line-height: 1.45; color: var(--muted); padding: 3px 8px 4px; }
  #stages .mk { font-size: 10.5px; color: var(--muted); margin-left: 5px; white-space: nowrap; }
  .tag.off { opacity: .35; }
  @media (max-width: 820px) {
    #left { max-height: none; overflow: visible; }
    #stages li.fork { display: flex; align-items: center; gap: 4px; padding: 3px 5px; margin: 0; }
    #stages .fork-head { padding: 0; }
    #stages .fk { display: none; }
    #stages .opt { display: flex; gap: 4px; border-left: 0; padding-left: 0; }
    #stages .opt.off, #stages .opt-label { display: none; }
    #stages .skip { white-space: nowrap; padding: 0 4px; font-size: 11px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); }
  @media (max-width: 820px) {
    #left { left: 8px; right: 8px; top: 8px; width: auto; padding: 10px; }
    #left .sub-h { display: none; }
    #stages { display: flex; overflow-x: auto; gap: 4px; }
    #stages li { flex: none; }
    #stages button { white-space: nowrap; padding: 5px 8px; }
    #info { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 40vh; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="loading">3D 설비 모형을 불러오는 중…</div>

<div id="left" class="panel">
  <h1>MLCC 테이프 캐스팅 (그린시트 성형)</h1>
  <p class="sub-h">PET 권출·사행 제어·이물 제거부터 슬러리 공급·코팅, 습윤/건조 두께 측정, 구역 건조·배기, 결함 검사, 권취까지 설비 3D 모형. 이물 제거와 코팅 방식은 갈래에서 고릅니다.</p>
  <ol id="stages"></ol>
  <div class="controls">
    <button id="play">❚❚ 일시정지</button>
    <select id="speed" aria-label="재생 속도">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <button id="overview">전체 보기</button>
    <label><input type="checkbox" id="tour" checked> 카메라 따라가기</label>
    <label><input type="checkbox" id="cut" checked> 단면 보기</label>
  </div>
</div>

<div id="info" class="panel"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ------------------------------------------------------------------
   Stage data — parameters come from the wiki pages
   wiki/concepts/tape-casting-mlcc.md, resources/manufacturing/20-tape-casting.md,
   resources/manufacturing/eq-03-tape-casting.md (equipment & step order),
   wiki/queries/mlcc-process-substeps-and-equipment.md §3 (source keys kept).
   (g) = general industry practice, not backed by a corpus source.
------------------------------------------------------------------- */
const GEN = '<span class="g">(g)</span>';
const SNIP = '<span class="g">(snippet, unverified)</span>';
const ck = (...k) => k.map((x) => `<code>[${x}]</code>`).join(' ');
const STAGES = [
  { name: '슬러리 공급·여과·정량', en: 'Slurry feed, filtration & metering', cam: [-12.9, 3.2, 6.0, -15.3, 0.9, 1.8],
    desc: '탈포한 슬러리를 탱크에서 펌프로 뽑아 필터와 유량 제어 밸브, 유량계를 거쳐 코팅 헤드로 보냅니다. 건조 후 두께계 값이 들어오면 유량 연산부가 적정 유량을 다시 계산해 밸브(또는 펌프 회전수)를 고칩니다. 공급 배관의 밀도계 값으로 두께 환산을 보정하는 방식도 있습니다.',
    equip: [`탱크 → 펌프 → 유량 제어 수단 → 유량계 → 코터 순서 ${ck('us6096370')}`,
      `정밀 여과 필터 (선택) ${ck('us6096370')}`,
      `유량계: 전자기·코리올리 질량·초음파·차압식 중, 청구항은 질량 유량계 ${ck('us6096370')}`,
      `유량 제어: 밸브 / 탱크 배압 / 기어 펌프 회전수 ${ck('us6096370')}`,
      `공급 배관 밀도계 + 슬러리 펌프 ${ck('us6869482')}`,
      `유량 연산부 (PC): 실측 유량·두께 → 적정 유량 ${ck('us6096370')}`,
      `탱크 저속 교반기 ${GEN}`],
    params: [`필터: 평균 입경 10배 이상 응집체 제거 ${ck('us6096370')}`,
      `캐스팅 점도 180 mPa·s ${ck('tdk-us7632369')} vs 400–700 cP ${ck('yang-2026-pvb')} (출처 간 불일치)`,
      `다이 코터 슬러리 점도 약 0.05–1 Pa·s ${ck('cn1201869c')} (위 두 값 모두 이 범위 안)`,
      `기포·응집체 → 캐스트층 결함 ${ck('ieee-technav')}`,
      `분산 불량·바인더 과다·수분·방향족 용제 → 시트 거칠기 증가 ${ck('tdk-us7632369')}`] },
  { name: '캐리어 권출·장력', en: 'Carrier unwind & tension', cam: [-17.6, 3.9, 7.0, -20.0, 1.6, 0],
    desc: '웹 경로는 여기서 시작합니다. 이형층을 코팅한 PET 캐리어를 공급 롤에서 풀어 냅니다. 공급 롤·권취 롤과 회전 구동원이 캐리어 장력을 일정하게 유지합니다. 몇 µm 이하 시트에서는 캐리어 이형면의 평활도가 슬러리만큼 중요합니다.',
    equip: [`이형 코팅 PET 캐리어 롤 (구매품) ${ck('lintec-us20150086749', 'nanya-us9932452')}`,
      `공급 롤 + 권취 롤 + 회전 구동원으로 장력 일정 유지 ${ck('us6605241')}`,
      `권출 브레이크·장력 유닛 ${GEN}`,
      `댄서 롤러 ${GEN} · 이송 속도 차이를 흡수하는 댄서는 인쇄 라인 예 ${ck('us5316602')}`,
      `롤 교체에도 멈추지 않는 권출–권취 자동 라인 ${ck('pnt-linkonbiz')} · 접합(스플라이스) 장치는 출처 없음`],
    params: [`PET 베이스 10–300 µm (예 30–38 µm) ${ck('lintec-us20150086749', 'nanya-us9932452')}`,
      `캐리어: PET 같은 저신장 수지 필름 ${ck('us6605241')}`,
      `이형층: UV 경화 아크릴레이트/실록산 0.3–2 µm ${ck('lintec-us20150086749')} · 실리콘 0.04–0.8 µm ${ck('nanya-us9932452')} · 0.05–1.0 µm ${ck('murata-us5520994')}`,
      `이형면 Ra ≤ 8 nm, Rp ≤ 50 nm ${ck('lintec-us20150086749')}`,
      `이형 필름 롤 취급 예: 폭 400 mm × 5000 m, 50 m/min 권출 ${ck('lintec-us20150086749')}`,
      '장력 수치: 출처 없음'] },
  { name: '코팅 헤드', en: 'Coating head', cam: [-11.4, 3.0, 5.8, -13.9, 1.0, 0],
    desc: '움직이는 PET 위에 슬러리를 일정한 습윤 두께로 바릅니다. 슬롯다이는 두 판 사이의 액 저장부(매니폴드)와 슬릿을 지나 상류·하류 립 사이로 슬러리를 내보내고, 백업 롤이 웹을 뒤에서 받칩니다. 닥터블레이드는 블레이드와 웹 사이 간극이 습윤 두께를 정합니다. 50 µm보다 얇은 테이프는 위가 아니라 옆(슬롯다이)이나 아래에서 코팅합니다. 왼쪽 "코팅 방식" 갈래에서 두 방식을 바꿔 볼 수 있습니다.',
    equip: [`슬롯다이: 두 판으로 유로·액 저장부·슬릿 토출구 구성, 상류/하류 립 돌출 ${ck('cn1201869c')}`,
      `배럴형 백업 롤 (웹을 뒤에서 지지) ${ck('cn1201869c')} · 롤에 붙인 슬러리실 + 닥터 에지 방식 ${ck('us6096370')}`,
      `슬롯다이 헤드 (다이 코터) ${ck('wiki-tc', 'lintec-us20150086749')} · MLCC 업체가 쓰는 정밀 슬롯다이 ${ck('yasui-mlcc-web')}`,
      `닥터블레이드 캐스터 ${ck('ieee-technav')} · 도포 장치는 닥터블레이드 선호, 롤·다이도 가능 ${ck('us6605241')} · 블레이드 형상 ${ck('wiki-tc')}`,
      `와이어바 코터 (TDK 예, 모형 없음) ${ck('tdk-us7632369')}`,
      `백업 롤 없이 장력 건 웹 위 다이 코팅 (모형 없음) ${ck('ipros-gsm')} · 온롤/오프롤 슬롯다이 ${SNIP} ${ck('yasui-tc2-ipros')}`,
      `다이 위치 조정 스테이지·마이크로미터 ${GEN}`],
    params: [`립–웹 간극 h < 100 µm, 10–50 µm 선호 (예 20 µm) ${ck('cn1201869c')}`,
      `하류 립 두께 L < 5 mm (예 2.8 mm), 백업 롤 반경 예 50 mm ${ck('cn1201869c')}`,
      `립 돌출 X/L 0.25–0.5: X/L≈0.25에서 폭 방향 두께차 약 0.3 µm, 0.3 넘으면 0.2 µm 미만 ${ck('cn1201869c')}`,
      `코팅 속도 약 0.2 m/s 선호, 최대 약 1 m/s ${ck('cn1201869c')} · 와이어바 50 m/min ${ck('tdk-us7632369')}`,
      `닥터블레이드: 간극이 습윤 두께 결정 ${ck('ieee-technav')} · 백업 롤–닥터 에지 거리로 두께 변경 ${ck('us6096370')}`,
      `두께 50 µm 미만: 옆(슬롯다이)·아래(립/마이크로그라비어)에서 코팅 ${ck('wiki-tc')}`,
      `다이 코팅 시험: 건조 1 µm 목표, 폭 250 mm × 10 m ${ck('lintec-us20150086749')}`,
      `슬롯다이 도포 균일도 1–2% (업체 주장) ${ck('yasui-mlcc-web')}`,
      `블레이드의 슬립 흐름 → 줄무늬 결함 ${ck('wiki-tc')}`,
      '0.5–1 µm 양산 라인이 어떤 헤드를 쓰는지는 확인 안 됨'] },
  { name: '1차 건조 (겔화)', en: 'Drying zone 1', cam: [-4.6, 2.9, 7.0, -7.0, 1.35, 0],
    desc: '시트는 노출된 윗면으로 증발합니다. 구역형 건조 터널의 첫 구역에서 용제 약 80–90%가 빠지면 슬러리가 겔이 됩니다. 윗면은 열풍 노즐로, 아랫면은 PET 너머 가열판이나 하부 열풍으로 데웁니다. 윗면이 너무 빨리 마르면 표피가 생겨 균열·주름이 생기므로, 초기 구역 윗면 바람을 증기만 빼낼 정도로 약하게 두는 설계가 있습니다.',
    equip: [`구역형 열풍 건조 터널 ${ck('steinmueller-us6682598')}`,
      `윗면 열풍 노즐 + 아랫면 가열판 (전도), 적외선으로 대체 가능 ${ck('us5316602')} (인쇄 후 건조로 예)`,
      `하부 가열실: 폭 방향 노즐 10개, 노즐마다 댐퍼, 가운데 풍량 최대 ${ck('jp2005271366a')}`,
      `초기·중기 구역 윗면 바람은 증기 배출용으로 최소화 ${ck('jp2005271366a')}`,
      `터널 내 웹 지지 롤러 ${GEN} (수지 메시 벨트 반송 예 ${ck('jp2005271366a')})`,
      `순환 팬·히터 ${GEN}`],
    params: [`1존: 용제 ~80–90% 제거 후 겔화 (MEK계는 ~80% 손실 부근) ${ck('steinmueller-us6682598')}`,
      `건조 예 60–70 °C × 2 min (범위 50–100 °C, 1–20 min) ${ck('tdk-us7632369')}`,

function stripeTexture(bg, lines, n, alpha) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const x = c.getContext('2d'); x.fillStyle = bg; x.fillRect(0, 0, 256, 64);
  for (let i = 0; i < n; i++) { x.fillStyle = `rgba(${lines},${Math.random() * alpha})`; x.fillRect(Math.random() * 256, 0, 1 + Math.random() * 3, 64); }
  for (let i = 0; i < n * 3; i++) { x.fillStyle = `rgba(${lines},${Math.random() * alpha})`; x.fillRect(Math.random() * 256, Math.random() * 64, 2, 2); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const petTex = stripeTexture('#ffffff', '120,160,190', 10, 0.45);

/* ------------------------------ helpers ------------------------------ */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const V2 = (x, y) => new THREE.Vector2(x, y);
const CUT_CYL = Math.PI / 4, CUT_SPH = 3 * Math.PI / 4, CUT_TL = 1.5 * Math.PI, FULL = Math.PI * 2;
const cutParts = [], fullParts = [];
const rotors = [], levels = [], pipes = [], updaters = [], rollers = [];
const FY = 0.32;

function mk(geo, mat, cast = true) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; return m; }
// Static repeated parts as one InstancedMesh (one draw call): fn(o, i) places instance i.
const _io = new THREE.Object3D();
function instances(parent, geo, mat, n, fn, cast = true) {
  const im = new THREE.InstancedMesh(geo, mat, n); im.castShadow = cast; im.receiveShadow = true; im.frustumCulled = false;
  for (let i = 0; i < n; i++) { _io.position.set(0, 0, 0); _io.rotation.set(0, 0, 0); _io.scale.set(1, 1, 1); fn(_io, i); _io.updateMatrix(); im.setMatrixAt(i, _io.matrix); }
  im.instanceMatrix.needsUpdate = true; parent.add(im); return im;
}
function put(parent, m, x = 0, y = 0, z = 0) { m.position.set(x, y, z); parent.add(m); return m; }
const cyl = (r1, r2, h, seg = 32, open = false, ts = 0, tl = FULL) => new THREE.CylinderGeometry(r1, r2, h, seg, 1, open, ts, tl);
const box = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const along = (geo, axis) => { if (axis === 'x') geo.rotateZ(-Math.PI / 2); if (axis === 'z') geo.rotateX(Math.PI / 2); return geo; };

function pair(parent, geoFn, cutStart, matOut, matIn, pos) {
  const gc = geoFn(cutStart, CUT_TL);
  const a = mk(gc, matOut), b = mk(gc, matIn, false), f = mk(geoFn(0, FULL), matOut);
  for (const m of [a, b, f]) { m.position.copy(pos); parent.add(m); }
  cutParts.push(a, b); fullParts.push(f);
}
function rim(parent, R, tube, y, mat) {
  const gc = new THREE.TorusGeometry(R, tube, 8, 64, CUT_TL); gc.rotateX(Math.PI / 2); gc.rotateY(5 * Math.PI / 4);
  const gf = new THREE.TorusGeometry(R, tube, 8, 64); gf.rotateX(Math.PI / 2);
  const a = put(parent, mk(gc, mat), 0, y, 0), f = put(parent, mk(gf, mat), 0, y, 0);
  cutParts.push(a); fullParts.push(f);
}
function label(text, pos, cls = 'tag', stage = null) {
  const d = document.createElement('div'); d.className = cls; d.innerHTML = text;
  if (stage !== null) d.addEventListener('click', () => jumpTo(stage));
  const o = new CSS2DObject(d); o.position.copy(pos); scene.add(o); return d;
}
function canvasTex(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return { c, x: c.getContext('2d'), t };
}
function screenMesh(tex, w, h) {
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), std({ map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.9 }));
}

const FIN_V = box(0.02, 0.5, 0.05);
function vMotor(scale = 1) {
  const g = new THREE.Group();
  put(g, mk(box(0.5, 0.32, 0.5), M.motorG), 0, 0.16, 0);
  put(g, mk(cyl(0.2, 0.2, 0.55, 28), M.motor), 0, 0.6, 0);
  instances(g, FIN_V, M.motor, 18, (o, k) => { const a = k / 18 * FULL; o.position.set(Math.cos(a) * 0.215, 0.6, Math.sin(a) * 0.215); o.rotation.y = -a; });
  put(g, mk(cyl(0.21, 0.21, 0.16, 28), M.motorG), 0, 0.96, 0);
  put(g, mk(cyl(0.06, 0.06, 0.03, 16), M.dark), 0, 1.05, 0);
  put(g, mk(box(0.16, 0.14, 0.14), M.motor), 0.26, 0.64, 0);
  g.scale.setScalar(scale);
  return g;
}
function hMotor(len = 0.42, r = 0.15) {
  const g = new THREE.Group();
  put(g, mk(along(cyl(r, r, len, 24), 'x'), M.motor), 0, 0, 0);
  instances(g, box(len * 0.9, 0.02, 0.045), M.motor, 14, (o, k) => { const a = k / 14 * FULL; o.position.set(0, Math.cos(a) * (r + 0.012), Math.sin(a) * (r + 0.012)); o.rotation.x = a; });
  put(g, mk(along(cyl(r + 0.01, r + 0.01, 0.12, 24), 'x'), M.motorG), len / 2 + 0.06, 0, 0);
  put(g, mk(box(0.12, 0.12, 0.12), M.motor), 0, r + 0.06, 0);
  put(g, mk(box(len * 0.7, 0.05, r * 1.6), M.dark), 0, -r - 0.02, 0);
  return g;
}
function impeller(d) {
  const g = new THREE.Group();
  put(g, mk(cyl(0.07, 0.07, 0.14, 16), M.steel), 0, 0, 0);
  for (let k = 0; k < 4; k++) {
    const piv = new THREE.Group(); piv.rotation.y = k * Math.PI / 2;
    const b = mk(box(d * 0.62, 0.02, 0.16), M.steel); b.position.x = d * 0.36; b.rotation.x = Math.PI / 4;
    piv.add(b); g.add(piv);
  }
  return g;
}
function gauge(parent, x, y, z, ry = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g);
  put(g, mk(along(cyl(0.09, 0.09, 0.05, 24), 'z'), M.steelB), 0, 0, 0);
  put(g, mk(new THREE.CircleGeometry(0.075, 24), M.paint, false), 0, 0, 0.027);
  const n = put(g, mk(box(0.006, 0.06, 0.004), M.laser, false), 0, 0.02, 0.03); n.rotation.z = -0.6;
  return g;
}

// O-frame scanning gauge across the web: heads above and below travel together across the width.
// fromBelow = transmission source in the lower head (radiation gauge); otherwise a beam from above.
function makeScanner(x, { frameMat = M.paintBlue, headMat = M.paint, beamMat = M.laser, fromBelow = false, phase = 0 } = {}) {
  const g = new THREE.Group(); scene.add(g);
  for (const sz of [-1.2, 1.2]) put(g, mk(box(0.18, 2.2, 0.18), frameMat), x, 1.1, sz);
  put(g, mk(box(0.24, 0.24, 2.6), frameMat), x, 2.25, 0);
  put(g, mk(box(0.24, 0.2, 2.6), frameMat), x, 0.72, 0);
  put(g, mk(box(0.06, 0.04, 2.3), M.steel), x - 0.1, 2.11, 0);
  put(g, mk(box(0.06, 0.04, 2.3), M.steel), x - 0.1, 0.84, 0);
  put(g, mk(box(0.14, 0.1, 2.0), M.dark), x + 0.05, 2.42, 0);      // cable chain
  const up = new THREE.Group(), lo = new THREE.Group(); g.add(up, lo);
  put(up, mk(box(0.34, 0.26, 0.3), headMat), x, 1.95, 0);
  put(up, mk(cyl(0.06, 0.08, 0.2, 20), M.dark), x, 1.73, 0);
  put(up, mk(box(0.02, 0.1, 0.2), frameMat), x + 0.18, 1.95, 0);
  put(lo, mk(box(0.34, 0.2, 0.3), headMat), x, 1.0, 0);
  put(lo, mk(cyl(0.07, 0.05, 0.12, 20), M.dark), x, 1.14, 0);
  const y0 = fromBelow ? 1.2 : WEB_Y + 0.03, y1 = 1.63;
  put(up, mk(cyl(0.006, 0.006, y1 - y0, 6), beamMat, false), x, (y0 + y1) / 2, 0);
  put(up, mk(new THREE.CircleGeometry(0.03, 16), beamMat, false), x, WEB_Y + 0.03, 0).rotation.x = -Math.PI / 2;
  if (fromBelow) put(lo, mk(new THREE.SphereGeometry(0.03, 10, 8), beamMat, false), x, 1.2, 0);
  updaters.push((dt, s, p, t) => { const zz = 0.55 * Math.sin(t * 1.3 + phase); up.position.z = zz; lo.position.z = zz; });
  return { g, up, lo };
}

/* ------------------------------ tank (from template) ------------------------------ */
function makeTank(o) {
  const { x = 0, z = 0, r = 1, h = 1.8, legH = 1.0, run = [], w = 5, liquidMat = M.slurry, motorScale = 1 } = o;
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const hd = 0.32 * r, y0 = legH + hd, y1 = y0 + h;
  pair(g, (s, l) => cyl(r, r, h, 64, true, s, l), CUT_CYL, M.steel, M.steelIn, V(0, y0 + h / 2, 0));
  pair(g, (s, l) => { const q = new THREE.SphereGeometry(r, 64, 12, s, l, Math.PI / 2, Math.PI / 2); q.scale(1, 0.32, 1); return q; }, CUT_SPH, M.steel, M.steelIn, V(0, y0, 0));
  pair(g, (s, l) => { const q = new THREE.SphereGeometry(r, 64, 12, s, l, 0, Math.PI / 2); q.scale(1, 0.32, 1); return q; }, CUT_SPH, M.steel, M.steelIn, V(0, y1, 0));
  rim(g, r + 0.012, 0.03, y1, M.steelB);
  rim(g, r + 0.01, 0.022, y0, M.steelB);
  for (const th of [CUT_CYL, -CUT_CYL]) {
    const e = put(g, mk(box(0.03, h, 0.03), M.steelB), r * Math.sin(th), y0 + h / 2, r * Math.cos(th)); cutParts.push(e);
  }
  for (let k = 0; k < 4; k++) {
    const a = Math.PI / 4 + k * Math.PI / 2, lx = Math.cos(a) * r * 1.07, lz = Math.sin(a) * r * 1.07;
    put(g, mk(cyl(0.055, 0.055, y0 + 0.3, 12), M.steelB), lx, (y0 + 0.3) / 2, lz);
    put(g, mk(box(0.22, 0.03, 0.22), M.steelB), lx, 0.015, lz);
    const lug = put(g, mk(box(0.1, 0.32, 0.12), M.steelB), Math.cos(a) * (r + 0.03), y0 + 0.16, Math.sin(a) * (r + 0.03));
    lug.rotation.y = -a;
  }
  const rn = 0.55 * r, hy = y1 + 0.32 * r * Math.sqrt(1 - 0.55 * 0.55);
  const inlets = [-Math.PI / 2, Math.PI, Math.PI / 2].map((th) => {
    const nx = rn * Math.sin(th), nz = rn * Math.cos(th);
    put(g, mk(cyl(0.065, 0.065, 0.28, 16), M.steel), nx, hy + 0.12, nz);
    put(g, mk(cyl(0.12, 0.12, 0.035, 20), M.steelB), nx, hy + 0.27, nz);
    return V(x + nx, hy + 0.29, z + nz);
  });
  put(g, mk(cyl(0.065, 0.065, 0.2, 16), M.steel), 0, legH - 0.06, 0);
  put(g, mk(cyl(0.12, 0.12, 0.035, 20), M.steelB), 0, legH - 0.16, 0);
  const outlet = V(x, legH - 0.18, z);
  put(g, mk(cyl(0.22, 0.22, 0.12, 24), M.steelB), -0.3 * r, hy + 0.06, -0.35 * r);
  put(g, mk(cyl(0.09, 0.09, 0.05, 16), M.glass), 0.3 * r, hy + 0.03, -0.42 * r);
  const shaftTop = y1 + hd + 0.04;
  put(g, mk(cyl(0.15, 0.2, 0.16, 20), M.steelB), 0, shaftTop + 0.08, 0);
  const mot = vMotor(motorScale); mot.position.y = shaftTop + 0.16; g.add(mot);
  const rotor = new THREE.Group(); g.add(rotor);
  const yImp = y0 + 0.2 * h;
  put(rotor, mk(cyl(0.035, 0.035, shaftTop - yImp, 12), M.steel), 0, (shaftTop + yImp) / 2, 0);
  const imp = impeller(r * 0.45); imp.position.y = yImp; rotor.add(imp);
  rotors.push({ obj: rotor, axis: 'y', run, w, cur: 0 });
  const L = new THREE.Group(); L.position.y = y0; g.add(L);
  const lr = r * 0.965;
  put(L, mk(cyl(lr, lr, 1, 64, true, CUT_CYL, CUT_TL), liquidMat, false), 0, 0.5, 0);
  const cap = put(L, new THREE.Mesh(new THREE.CircleGeometry(lr, 64, -Math.PI / 4, CUT_TL), liquidMat), 0, 1, 0);
  cap.rotation.x = -Math.PI / 2;
  for (const th of [CUT_CYL, -CUT_CYL]) {
    const pl = put(L, new THREE.Mesh(new THREE.PlaneGeometry(lr, 1), liquidMat), lr / 2 * Math.sin(th), 0.5, lr / 2 * Math.cos(th));
    pl.rotation.y = th - Math.PI / 2;
  }
  const lh = new THREE.SphereGeometry(lr, 48, 10, CUT_SPH, CUT_TL, Math.PI / 2, Math.PI / 2); lh.scale(1, 0.32, 1);
  const headLiq = put(g, new THREE.Mesh(lh, liquidMat), 0, y0, 0);
  return { g, x, z, r, h, y0, y1, legH, inlets, outlet, L, headLiq, rotor };
}

/* ------------------------------ pipes (from template) ------------------------------ */
function roundedPath(pts, rc = 0.3) {
  const path = new THREE.CurvePath();
  let prev = pts[0].clone();
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], p = pts[i], b = pts[i + 1];
    const din = p.clone().sub(a).normalize(), dout = b.clone().sub(p).normalize();
    const r = Math.min(rc, p.distanceTo(a) / 2, p.distanceTo(b) / 2);
    const pA = p.clone().addScaledVector(din, -r), pB = p.clone().addScaledVector(dout, r);
    if (prev.distanceTo(pA) > 1e-4) path.add(new THREE.LineCurve3(prev.clone(), pA));
    path.add(new THREE.QuadraticBezierCurve3(pA, p.clone(), pB));
    prev = pB;
  }
  path.add(new THREE.LineCurve3(prev, pts[pts.length - 1].clone()));
  return path;
}
function dedupe(pts) { return pts.filter((p, i) => i === 0 || p.distanceTo(pts[i - 1]) > 1e-3); }
function flange(parent, pos, dir, r) {
  const f = mk(cyl(r * 1.9, r * 1.9, 0.045, 20), M.steelB);
  f.position.copy(pos); f.quaternion.setFromUnitVectors(V(0, 1, 0), dir.clone().normalize()); parent.add(f);
}
function valve(parent, pos, r) {
  put(parent, mk(new THREE.SphereGeometry(r * 1.7, 16, 12), M.steelB), pos.x, pos.y, pos.z);
  put(parent, mk(cyl(0.02, 0.02, 0.25, 8), M.steelB), pos.x, pos.y + 0.14, pos.z);
  const hw = put(parent, mk(new THREE.TorusGeometry(0.11, 0.015, 8, 24), M.yellow), pos.x, pos.y + 0.27, pos.z);
  hw.rotation.x = Math.PI / 2;
}
function makePipe(pts, { stages = [], r = 0.06, speed = 1.4, mat = M.flow, valveAt = 0.12, mode = null, pr = r * 0.75 } = {}) {
  pts = dedupe(pts);
  const g = new THREE.Group(); scene.add(g);
  const path = roundedPath(pts);
  const len = path.getLength();
  g.add(mk(new THREE.TubeGeometry(path, Math.max(40, Math.round(len * 14)), r, 12, false), pipeMat, false));
  flange(g, pts[0], pts[1].clone().sub(pts[0]), r);
  flange(g, pts[pts.length - 1], pts[pts.length - 1].clone().sub(pts[pts.length - 2]), r);
  if (valveAt !== null) valve(g, path.getPointAt(valveAt), r);
  const samples = path.getSpacedPoints(Math.max(60, Math.round(len * 30)));
  const n = Math.max(6, Math.round(len * 3.2));
  const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(pr, 10, 8), mat, n);
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage); inst.frustumCulled = false; inst.visible = false;
  scene.add(inst);
  const P = { g, samples, len, inst, n, stages, speed, mode };
  pipes.push(P);
  return P;
}
function makePump(x, z, rot = Math.PI / 2) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rot; scene.add(g);
  put(g, mk(box(1.15, 0.07, 0.38), M.dark), 0.42, 0.035, 0);
  put(g, mk(along(cyl(0.17, 0.17, 0.14, 32), 'x'), M.pump), 0, FY, 0);
  put(g, mk(box(0.12, FY - 0.1, 0.18), M.pump), 0, (FY - 0.1) / 2 + 0.07, 0);
  put(g, mk(along(cyl(0.065, 0.065, 0.28, 16), 'x'), M.pump), 0.2, FY, 0);
  put(g, mk(box(0.2, 0.22, 0.24), M.yellow), 0.42, FY, 0);
  const m = hMotor(0.44, 0.15); m.position.set(0.76, FY, 0); g.add(m);
  return g;
}

/* ------------------------------ process flow (branches) ------------------------------
   FLOW lists the steps in process order. A number is a STAGES index. An object
   { i, label, mark } overrides the list label, or marks the step 'repeat' / 'parallel'.
   A fork { fork, title, opts: [{ key, label, steps, note, onSelect }], def } is a point where the
   line splits into alternative routes. Only the chosen option's steps play; an option
   with no steps skips straight to the step after the fork.
   STAGES indices never change: the animation code keys on them. */
const ROUTE = {};
FLOW.forEach((e) => { if (e.fork) ROUTE[e.fork] = e.def || e.opts[0].key; });

let SEQ = [];
const forkStart = {};
function buildSeq() {
  SEQ = [];
  for (const e of FLOW) {
    if (!e.fork) { SEQ.push(asStep(e)); continue; }
    forkStart[e.fork] = SEQ.length;
    const o = e.opts.find((q) => q.key === ROUTE[e.fork]);
    o.steps.forEach((x) => SEQ.push({ ...asStep(x), fork: e, opt: o }));
  }
}

      const lab = document.createElement('div'); lab.className = 'opt-label'; lab.textContent = o.label; box.appendChild(lab);

const rng = (() => { let s = 11; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

const bub = Array.from({ length: 5 }, () => ({ x: 0.1 + rng() * 0.8, y: 0.2 + rng() * 0.7, r: 8 + rng() * 9 }));
function carrier(x, W, yR, thick = 40) {
  x.fillStyle = '#d8f0ff'; x.fillRect(0, yR, W, 6);
  x.fillStyle = '#5f97ba'; x.fillRect(0, yR + 6, W, thick);

function film(x, W, yR, h, wetK, t, scroll = true) {
  const c0 = [138, 134, 118], c1 = [222, 216, 200];

  x.fillStyle = `rgb(${c.join(',')})`; x.fillRect(0, yR - h, W, h);

  for (const q of prt) {

  const a = Math.atan2(y1 - y0, x1 - x0);

  const tw = tangentTop(WND, rw, PE); const sE = WEB.s[WEB.s.length - 1];
  spanWndPet.set(PE, tw, 0, sE); spanWndCoat.set(PE, tw, 0.006 + DRY, sE);
  // lay-on roller rides the growing roll
  const la = 1.1, lc = V2(WND.x + (rw + 0.09) * Math.cos(la), WND.y + (rw + 0.09) * Math.sin(la));
  const piv = V2(WND.x + 1.0, 2.75), d = lc.clone().sub(piv);
  winder.arm.rotation.z = Math.atan2(d.y, d.x);
  winder.lay.position.x = d.length();
  winder.armBars.forEach((b) => { b.scale.x = d.length(); b.position.x = d.length() / 2; });
  winder.layRot.rotation.z += dS / 0.09;
  // feed tank level falls during the loop
  const lvl = 0.72 - 0.4 * f;
  feed.L.scale.y = lvl * feed.h;

  for (const r of rotors) {
    const target = r.run.includes(s) ? r.w : r.w * 0.06;
    r.cur += (target - r.cur) * Math.min(1, dt * 1.5);
    r.obj.rotation[r.axis] += r.cur * dt;
  }
  for (const P of pipes) {
    const on = P.stages.includes(s) && (!P.mode || P.mode === headMode);
    P.inst.visible = on;
    if (!on) continue;
    const ns = P.samples.length - 1;
    for (let i = 0; i < P.n; i++) {
      const u = (i / P.n + (t * P.speed) / P.len) % 1;
      const fk = u * ns, k = Math.floor(fk), a = P.samples[k], b = P.samples[Math.min(ns, k + 1)];
      dmy.position.lerpVectors(a, b, fk - k); dmy.updateMatrix(); P.inst.setMatrixAt(i, dmy.matrix);
    }
    P.inst.instanceMatrix.needsUpdate = true;
  }
  for (const u of updaters) u(dt, s, p, t, dts);

  if (tween) {
    tween.k = Math.min(1, tween.k + dt / 2.2);
    const e = sm(tween.k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.k >= 1) tween = null;
  }
  infoTick += dt;
  if (infoTick > 1 / 30) { infoTick = 0; drawMicro(s, p, t); drawChart(s); }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
document.getElementById('loading').remove();
frame();
</script>
</body>
