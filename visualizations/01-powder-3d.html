<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLCC 유전체 분말 3D</title>
<style>
  :root {
    --panel: rgba(15, 20, 27, 0.80);
    --panel-line: rgba(255, 255, 255, 0.12);
    --text: #e9eef3;
    --muted: #9db0c2;
    --accent: #ffb547;
    --accent-ink: #1d1406;
    --g: #8fd0ff;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2229; color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .tag { pointer-events: auto; cursor: pointer; transform: translateY(-6px);
    background: rgba(14, 18, 24, 0.84); color: var(--text); border: 1px solid rgba(255,255,255,.2);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; white-space: nowrap; transition: background .25s, color .25s; }
  .tag b { color: var(--accent); margin-right: 4px; }
  .tag.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tag.active b { color: var(--accent-ink); }
  .sub { pointer-events: none; font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: rgba(255,255,255,.88); color: #1d242c; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .sub.show { opacity: 1; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #left { top: 16px; left: 16px; width: 268px; padding: 14px 14px 12px; }
  #left h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: -.01em; }
  #left .sub-h { font-size: 11.5px; color: var(--muted); margin: 0 0 10px; }
  #stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  #stages button { width: 100%; text-align: left; background: transparent; color: var(--text); border: 0;
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #stages button:hover { background: rgba(255,255,255,.07); }
  #stages button.active { background: rgba(255,181,71,.16); color: #fff; }
  #stages .n { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px;
    background: rgba(255,255,255,.1); flex: none; }
  #stages button.active .n { background: var(--accent); color: var(--accent-ink); }
  #stages .bar { height: 2px; background: var(--accent); width: 0; border-radius: 2px; margin-top: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .controls button, .controls select { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line);
    border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #info { right: 16px; bottom: 16px; width: 390px; max-height: calc(100vh - 32px); overflow: auto; padding: 16px; box-sizing: border-box; }
  #info .head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
  #info .fold { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line); border-radius: 8px; padding: 3px 8px; font: inherit; font-size: 11.5px; cursor: pointer; flex: none; }
  #info.collapsed .body { display: none; }
  #info.collapsed h2 { margin-bottom: 0; }
  #info .kicker { font-size: 11px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
  #info h2 { font-size: 18px; margin: 2px 0 6px; }
  #info p { font-size: 13px; line-height: 1.55; color: #d5dde5; margin: 0 0 10px; }
  #info h3 { font-size: 11.5px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; letter-spacing: .03em; }
  #info ul { margin: 0; padding-left: 16px; font-size: 12.5px; line-height: 1.55; }
  #info li { margin-bottom: 2px; }
  #info code { font-size: 11px; color: var(--g); }
  .g { color: #ffcf8a; font-size: 11px; }
  .canvas-wrap { margin-top: 8px; background: rgba(0,0,0,.25); border-radius: 8px; padding: 6px; }
  .canvas-wrap canvas { width: 100%; display: block; }
  .cap { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .foot { font-size: 10.5px; color: var(--muted); margin-top: 12px; line-height: 1.5; border-top: 1px solid var(--panel-line); padding-top: 8px; }
  /* process-flow branches */
  #left { max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; }
  #stages li.fork { display: grid; gap: 3px; margin: 3px 0; padding: 6px 6px 6px 7px;
    border: 1px dashed rgba(255,255,255,.2); border-radius: 10px; }
  #stages .fork-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; padding: 0 2px 2px; }
  #stages .fk { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  #stages .seg { display: inline-flex; background: rgba(255,255,255,.07); border-radius: 999px; padding: 2px; gap: 2px; }
  #stages .seg button { width: auto; display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; color: var(--muted); }
  #stages .seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  #stages .opt { display: grid; gap: 2px; padding-left: 7px; border-left: 2px solid rgba(255,255,255,.14); }
  #stages .opt.on { border-left-color: var(--accent); }
  #stages .opt-label { font-size: 10.5px; color: var(--muted); padding: 1px 0 0 2px; }
  #stages .opt.off > button { opacity: .45; }
  #stages .opt.off .n { background: transparent; border: 1px dashed rgba(255,255,255,.3); }
  #stages .skip { font-size: 11.5px; line-height: 1.45; color: var(--muted); padding: 3px 8px 4px; }
  #stages .mk { font-size: 10.5px; color: var(--muted); margin-left: 5px; white-space: nowrap; }
  .tag.off { opacity: .35; }
  @media (max-width: 820px) {
    #left { max-height: none; overflow: visible; }
    #stages li.fork { display: flex; align-items: center; gap: 4px; padding: 3px 5px; margin: 0; }
    #stages .fork-head { padding: 0; }
    #stages .fk { display: none; }
    #stages .opt { display: flex; gap: 4px; border-left: 0; padding-left: 0; }
    #stages .opt.off, #stages .opt-label { display: none; }
    #stages .skip { white-space: nowrap; padding: 0 4px; font-size: 11px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); }
  @media (max-width: 820px) {
    #left { left: 8px; right: 8px; top: 8px; width: auto; padding: 10px; }
    #left .sub-h { display: none; }
    #stages { display: flex; overflow-x: auto; gap: 4px; }
    #stages li { flex: none; }
    #stages button { white-space: nowrap; padding: 5px 8px; }
    #info { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 40vh; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="loading">3D 설비 모형을 불러오는 중…</div>

<div id="left" class="panel">
  <h1>MLCC 유전체 분말 합성·도펀트 코팅</h1>
  <p class="sub-h">Ti 원료·Ba 투입부터 수열/고상 합성, 건조·하소·해쇄, 도펀트 코팅, 분급·QC·포장까지 설비 3D 모형</p>
  <ol id="stages"></ol>
  <div class="controls">
    <button id="play">❚❚ 일시정지</button>
    <select id="speed" aria-label="재생 속도">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <button id="overview">전체 보기</button>
    <label><input type="checkbox" id="tour" checked> 카메라 따라가기</label>
    <label><input type="checkbox" id="cut" checked> 단면 보기</label>
  </div>
</div>

<div id="info" class="panel"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------
   Stage data — sources:
   · wiki pages wiki/concepts/batio3-powder-synthesis.md, wiki/concepts/dopant-powder-coating.md,
     wiki/queries/mlcc-process-substeps-and-equipment.md (§1) — no bibliography keys there,
     so the page name is used as the key (KB, KD, KQ).
   · raw notes resources/manufacturing/eq-01-powder.md — patents, equipment-maker pages and
     papers on the powder line; keys like [us9771274] are defined in that file's Sources table.
   (g) = general industry practice, not backed by those sources.
   STAGES indices never change (animation keys on them); the process order lives in FLOW.
------------------------------------------------------------------- */
const KB = '<code>[batio3-powder-synthesis]</code>';
const KD = '<code>[dopant-powder-coating]</code>';
const KQ = '<code>[mlcc-process-substeps-and-equipment]</code>';
const K = (...k) => k.map((x) => `<code>[${x}]</code>`).join(' ');
const G = '<span class="g">(g)</span>';
const ZB = -5.6;   // z of the back row (solid-state line)
const STAGES = [
  { name: '원료 계량·투입 (N₂)', en: 'Charging · N₂ purge', tx: -26.6, cam: [1.2, 5.6, 11.5],
    desc: 'Ba(OH)₂·8H₂O 결정을 계량해 넣고, Ti 슬러리와 순수를 더합니다. Ba(OH)₂는 공기 중 CO₂와 만나면 BaCO₃가 되므로 용기를 N₂로 치환하고 밀폐합니다. Sakai 예는 별도 용기에서 Ba(OH)₂를 100 °C로 녹인 뒤 Ti 슬러리를 1 h 동안 넣고 2 h 상압 반응(전구체)시켜 오토클레이브로 옮깁니다.',
    equip: [`Ba(OH)₂·8H₂O 고체 투입·가열 용해 (권장 방식) ${K('us6129903')}`, `빅백 배출기·로드셀 계량 호퍼·스크루 피더 형상 ${G}`, `Ti 슬러리 탱크·이송 펌프 ${G}`, `N₂ 퍼지 후 밀폐 ${K('us6129903')} — 실린더·레귤레이터 패널 형상은 ${G}`, `순수(DI) 탱크 ${G}`],
    params: [`예: 순수 567 mL + Ba(OH)₂·8H₂O 959 g을 100 °C에서 용해 → Ti 슬러리 1 h 투입 → 100 °C 2 h 상압 전구체 반응, 투입 Ba/Ti 2.3 ${K('us9771274')}`, `Ba/Ti: 용액 투입은 ≥ 1.2, 고체 투입은 ≤ 1.1도 가능 ${K('us6129903')}`, `원료 탄산염 < 0.51 wt%. 탄산염 혼입 원인: 겔 속 CO₂, N₂ 치환 부족, 세척 중 공기 노출 ${K('us6129903')}`, `반응: Ba(OH)₂ + TiO₂·nH₂O → BaTiO₃ + (n+1)H₂O ${KB}`, `최종 분말 목표 Ba/Ti 1.000 ± 0.001 ${KB}`] },
  { name: '수열 합성', en: 'Hydrothermal autoclave', tx: -22, cam: [3.0, 5.8, 10.5],
    desc: '밀폐 오토클레이브를 교반하면서 승온 → 유지 → 냉각합니다. 용해–석출로 BaTiO₃가 바로 결정으로 나와 하소를 생략할 수 있습니다. 유지 시간은 문헌마다 20분에서 수일까지 크게 다릅니다.',
    equip: [`오토클레이브 + 교반기 ${K('us6129903', 'us4643984')}`, `접액부: Ti 반응 용기 ${K('us6129903')} / Hastelloy ${K('us4643984')}`, `수열 오토클레이브 ${KQ}`, `가열 자켓·압력계·안전밸브·보호관·제어반 형상 ${G}`],
    params: [`Sakai: 160–200 °C × 24–180 h (청구 ≤ 250 °C, ≥ 24 h) → BET 4.9–11.7 m²/g, c/a 1.008–1.010 ${K('us9771274')}`, `Cabot: 약 1.4 °C/min로 200 °C, 20 min 유지, 350 rpm (선호 120–220 °C) → 평균 약 50 nm, 입방정 ${K('us6129903')}`, `Sakai 1984: 90 min에 약 150 °C, 550–600 rpm, 5 h ${K('us4643984')}`, `위키: 100–250 °C, 100 nm 이하·최소 10–15 nm, 단점은 격자 OH⁻·배치 공정·높은 비용 ${KB}`, `유지 시간 차이(20 min vs ≥ 24 h)는 원료·목표 입경이 달라서로 보이나, 출처끼리 직접 비교하지 않음`] },
  { name: '2차 하소 (새거)', en: 'Main calcination · saggers', tx: 2.0, tz: ZB, cam: [0.4, 8.4, 9.2],
    desc: '1차 하소 분말을 알루미나 용기(새거)에 담아 더 높은 온도에서 반응을 끝내고 입자를 키웁니다. 온도가 높을수록 입자끼리 붙어 응집이 생기므로 뒤에서 해쇄합니다. 문헌 예는 배치로이며, 연속 롤러 하스 형상은 일반 관행으로 그렸습니다.',
    equip: [`배치로 + 알루미나 용기 ${K('us20090264276')}`, `상자형 킬른 + 알루미나 새거 (옥살산염 분말) ${K('us5783165')}`, `볼밀 + 하소로 ${KQ}`, `롤러 하스 터널킬른·배기 스택 형상 ${G}`],
    params: [`900–1000 °C × 2–12 h, 대기, 3.3 °C/min ${K('us20090264276')}`, `위키 범위 1100–1400 °C — 위 2단 하소의 900–1000 °C와 다름, 둘 다 표기 ${KB}`, `1000 °C × 2 h: c/a 1.0078 (교반·비드밀 혼합) vs 1.0095 (+건식 유성볼밀) ${K('kawamura-2025')}`, `BaCO₃가 몰린 곳에서 850 °C 이상이면 Ba₂TiO₄ 생성 → 고른 혼합, 850 °C 이하에서 반응 완료가 유리 ${K('kawamura-2025')}`, `응집, 넓은 분포, 0.5 µm 미만은 과분쇄로 오염·비정질화 ${KB}`] },
  { name: '세척·여과', en: 'Washing & filtration', tx: -13.0, cam: [1.6, 4.4, 9.5],
    desc: '슬러리를 필터 프레스로 보내 모액과 잔류 이온을 씻어 내고 케이크로 받습니다. Sakai 1984 예는 여액에서 Cl⁻가 나오지 않을 때까지 씻습니다. 고상법 분말은 물에서 만들지 않으므로 이 단계가 없습니다.',
    equip: [`여과·수세 ${K('us4643984', 'us9771274')} — 필터 프레스(판·프레임, 유압 클로징) 형상은 ${G}`, `세척수 탱크 ${G}`, `여액 트레이·케이크 배출 슈트 ${G}`],
    params: [`Cl⁻가 검출되지 않을 때까지 세척 ${K('us4643984')}`, `세척수 pH 10.7 암모니아수 — Ba 용출 억제 ${K('us6129903')}`, `분말 사양: 표면 OH⁻/탄산염 < 0.5 wt% ${KB}`, `옥살산염 경로: 원심 여과, 여액 pH > 6까지 세척 ${K('us7179441')}`] },
  { name: '도펀트 습식 코팅', en: 'Wet-chemical coating', tx: 10.2, cam: [2.6, 5.0, 10],
    desc: '분말을 물에 다시 분산하고 pH를 맞춘 뒤 희토류 질산염을 넣어 입자 표면에 흡착·석출시킵니다. 도펀트가 입자 사이가 아니라 입자 위에 놓이게 하는 현대 표준 방식입니다.',
    equip: [`습식 화학 반응기 ${KQ}`, `가열 자켓·pH 센서·도징 펌프 ${G}`, `NH₄OH·Y(NO₃)₃ 도징 탱크 ${G}`],
    params: [`학술 예: BaTiO₃(200 nm) 50 g / 순수 500 mL ${KD}`, `NH₄OH로 pH 8.5–9.0, 30 min 교반 ${KD}`, `Y(NO₃)₃·6H₂O 0.5–2 mol% (물 50 mL) 투입, 1 h 교반 ${KD}`, `공도핑 Y + Mg + Mn은 순차 투입, Mn을 마지막에 ${KD}`, `대안: 건식 볼밀 8–24 h(도펀트가 입자 사이에 남음), 졸겔, 유동층 ALD(연구용) ${KD}`] },
  { name: '세척·진공 건조', en: 'Centrifuge & vacuum dry', tx: 16.4, cam: [0.6, 5.0, 10.5],
    desc: '코팅된 분말을 원심분리로 회수해 물과 에탄올로 씻고, 진공에서 건조합니다. 표면에 붙은 도펀트 염이 그대로 남도록 저온에서 말립니다.',
    equip: [`원심분리기 / 여과 ${KD}`, `진공 건조기 ${KQ}`, `바스켓 원심분리기·더블콘 회전 건조기·진공 펌프 형상 ${G}`],
    params: [`물 3회 + 에탄올 1회 세척 ${KD}`, `80 °C 진공 건조 ${KD}`] },
  { name: '코팅 열처리 (하소)', en: 'Coating calcination', tx: 24.5, cam: [2.8, 4.6, 9.5],
    desc: '고상법의 합성 하소(1100–1400 °C)와는 다른, 코팅을 산화물로 바꾸는 저온 열처리입니다. 건조 분말을 새거에 담아 대기 중에서 하소합니다. 표면의 질산염이 산화물로 바뀌어 모든 입자에 얇은 도펀트 산화물 껍질이 생깁니다. 이 껍질이 소결 후 core-shell의 shell이 됩니다.',
    equip: [`하소로 ${KQ}`, `박스로·리프트 도어·새거·장입 카트 ${G}`, `배기 후드 ${G}`],

/* ------------------------------ tank ------------------------------ */
function makeTank(o) {
  const { x = 0, z = 0, r = 1, h = 1.8, legH = 1.0, top = true, agit = 'pitched', run = [], w = 5,
          liquidMat = M.slurry, motorScale = 1, lvl = null, shell = M.steel } = o;
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const hd = 0.32 * r, y0 = legH + hd, y1 = y0 + h;
  pair(g, (s, l) => cyl(r, r, h, 64, true, s, l), CUT_CYL, shell, M.steelIn, V(0, y0 + h / 2, 0));
  pair(g, (s, l) => { const q = new THREE.SphereGeometry(r, 64, 12, s, l, Math.PI / 2, Math.PI / 2); q.scale(1, 0.32, 1); return q; }, CUT_SPH, shell, M.steelIn, V(0, y0, 0));

    const e = put(g, mk(box(0.03, h, 0.03), M.steelB), r * Math.sin(th), y0 + h / 2, r * Math.cos(th)); cutParts.push(e);
  }
  for (let k = 0; k < 4; k++) {
    const a = Math.PI / 4 + k * Math.PI / 2, lx = Math.cos(a) * r * 1.07, lz = Math.sin(a) * r * 1.07;
    put(g, mk(cyl(0.055, 0.055, y0 + 0.3, 12), M.steelB), lx, (y0 + 0.3) / 2, lz);
    put(g, mk(box(0.22, 0.03, 0.22), M.steelB), lx, 0.015, lz);
    const lug = put(g, mk(box(0.1, 0.32, 0.12), M.steelB), Math.cos(a) * (r + 0.03), y0 + 0.16, Math.sin(a) * (r + 0.03));
    lug.rotation.y = -a;
  }
  const inA = [-Math.PI / 2, -3 * Math.PI / 4, Math.PI, 3 * Math.PI / 4, Math.PI / 2];
  const rn = 0.55 * r, hy = y1 + 0.32 * r * Math.sqrt(1 - 0.55 * 0.55);
  const inlets = inA.map((th) => {
    const nx = rn * Math.sin(th), nz = rn * Math.cos(th);
    if (top) {
      put(g, mk(cyl(0.065, 0.065, 0.28, 16), M.steel), nx, hy + 0.12, nz);
      put(g, mk(cyl(0.12, 0.12, 0.035, 20), M.steelB), nx, hy + 0.27, nz);
      return V(x + nx, hy + 0.29, z + nz);
    }
    return V(x + nx * 1.05, y1 - 0.05, z + nz * 1.05);
  });
  put(g, mk(cyl(0.065, 0.065, 0.2, 16), M.steel), 0, legH - 0.06, 0);
  put(g, mk(cyl(0.12, 0.12, 0.035, 20), M.steelB), 0, legH - 0.16, 0);
  const outlet = V(x, legH - 0.18, z);
  if (top) {
    put(g, mk(cyl(0.22, 0.22, 0.12, 24), M.steelB), -0.3 * r, hy + 0.06, -0.35 * r);
    put(g, mk(cyl(0.09, 0.09, 0.05, 16), M.glass), 0.3 * r, hy + 0.03, -0.42 * r);
  }
  let rotor = null;
  if (agit) {
    const shaftTop = top ? y1 + hd + 0.04 : y1 + 0.5;
    put(g, mk(cyl(0.15, 0.2, 0.16, 20), M.steelB), 0, shaftTop + 0.08, 0);
    const mot = vMotor(motorScale); mot.position.y = shaftTop + 0.16; g.add(mot);
    rotor = new THREE.Group(); g.add(rotor);
    const yImp = agit === 'anchor' ? y0 - hd * 0.4 : y0 + 0.2 * h;

    rotors.push({ obj: rotor, axis: 'y', run, w, cur: 0 });
  }

  const lr = r * 0.965;
  put(L, mk(cyl(lr, lr, 1, 64, true, CUT_CYL, CUT_TL), liquidMat, false), 0, 0.5, 0);
  const cap = put(L, new THREE.Mesh(new THREE.CircleGeometry(lr, 64, -Math.PI / 4, CUT_TL), liquidMat), 0, 1, 0);
  cap.rotation.x = -Math.PI / 2;

    pl.rotation.y = th - Math.PI / 2;
  }
  const lh = new THREE.SphereGeometry(lr, 48, 10, CUT_SPH, CUT_TL, Math.PI / 2, Math.PI / 2); lh.scale(1, 0.32, 1);
  const headLiq = put(g, new THREE.Mesh(lh, liquidMat), 0, y0, 0);
  dyn(L); dyn(headLiq);

/* ------------------------------ pipes ------------------------------ */
function roundedPath(pts, rc = 0.3) {
  const path = new THREE.CurvePath();
  let prev = pts[0].clone();
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], p = pts[i], b = pts[i + 1];
    const din = p.clone().sub(a).normalize(), dout = b.clone().sub(p).normalize();
    const r = Math.min(rc, p.distanceTo(a) / 2, p.distanceTo(b) / 2);
    const pA = p.clone().addScaledVector(din, -r), pB = p.clone().addScaledVector(dout, r);
    if (prev.distanceTo(pA) > 1e-4) path.add(new THREE.LineCurve3(prev.clone(), pA));
    path.add(new THREE.QuadraticBezierCurve3(pA, p.clone(), pB));
    prev = pB;
  }
  path.add(new THREE.LineCurve3(prev, pts[pts.length - 1].clone()));
  return path;
}
function dedupe(pts) { return pts.filter((p, i) => i === 0 || p.distanceTo(pts[i - 1]) > 1e-3); }
function flange(pos, dir, r) {
  const f = mk(cyl(r * 1.9, r * 1.9, 0.045, 20), M.steelB);
  f.position.copy(pos); f.quaternion.setFromUnitVectors(V(0, 1, 0), dir.clone().normalize()); scene.add(f);
}
function valve(pos, r) {
  put(scene, mk(new THREE.SphereGeometry(r * 1.7, 16, 12), M.steelB), pos.x, pos.y, pos.z);
  put(scene, mk(cyl(0.02, 0.02, 0.25, 8), M.steelB), pos.x, pos.y + 0.14, pos.z);
  const hw = put(scene, mk(new THREE.TorusGeometry(0.11, 0.015, 8, 24), M.yellow), pos.x, pos.y + 0.27, pos.z);
  hw.rotation.x = Math.PI / 2;
}
// win = [p0, p1] limits the flow to part of the stage; when() = extra condition (e.g. active route).
function makePipe(pts, { stages = [], r = 0.06, speed = 1.4, mat = M.flow, valveAt = 0.12, reverse = false, win = null, when = null, pr = r * 0.75, dens = 3.2 } = {}) {
  pts = dedupe(pts);
  const path = roundedPath(pts);
  const len = path.getLength();
  const tube = mk(new THREE.TubeGeometry(path, Math.max(40, Math.round(len * 14)), r, 12, false), pipeMat, false);
  scene.add(tube);
  flange(pts[0], pts[1].clone().sub(pts[0]), r);
  flange(pts[pts.length - 1], pts[pts.length - 1].clone().sub(pts[pts.length - 2]), r);
  if (valveAt !== null) valve(path.getPointAt(valveAt), r);
  const samples = path.getSpacedPoints(Math.max(60, Math.round(len * 30)));
  const n = Math.max(6, Math.round(len * dens));
  const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(pr, 10, 8), mat, n);
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage); inst.frustumCulled = false; inst.visible = false;
  scene.add(inst);
  const P = { samples, len, inst, n, stages, speed, reverse, win, when };
  pipes.push(P);
  return P;
}
function route(a, b, riseX, { lane = null, over = null } = {}) {
  const ln = lane ?? a.z, topY = over ?? b.y + 0.55;
  return [a.clone(), V(a.x, FY, a.z), V(a.x, FY, ln), V(riseX, FY, ln), V(riseX, FY, b.z), V(riseX, topY, b.z), V(b.x, topY, b.z), b.clone()];
}

/* ------------------------------ pumps ------------------------------ */

  put(g, mk(box(1.15, 0.07, 0.38), M.dark), 0.42, 0.035, 0);

  put(g, mk(box(0.12, FY - 0.1, 0.18), M.pump), 0, (FY - 0.1) / 2 + 0.07, 0);
  put(g, mk(along(cyl(0.065, 0.065, 0.28, 16), 'x'), M.pump), 0.2, FY, 0);
  put(g, mk(box(0.2, 0.22, 0.24), M.yellow), 0.42, FY, 0);

    cx.moveTo(X(0), B); cx.lineTo(X(0.16), B - 4); cx.lineTo(X(0.32), T); cx.lineTo(X(0.72), T); cx.lineTo(X(0.86), B - 10); cx.lineTo(X(1), B - 10); cx.stroke();
    cx.fillStyle = '#e9eef3'; cx.font = 'bold 12px system-ui'; cx.fillText(txt.hold, X(0.34), T - 6);

// Cyclone collector; swirl particles show while one of `stages` runs.
function cyclone(x, z, yTop, { r = 0.4, stages = [] } = {}) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const hc = r * 1.6, hk = r * 2.6, yb = yTop - hc - hk;
  pair(g, (s, l) => cyl(r, r, hc, 32, true, s, l), CUT_CYL, M.steel, M.steelIn, V(0, yTop - hc / 2, 0));
  pair(g, (s, l) => cyl(r, 0.08, hk, 32, true, s, l), CUT_CYL, M.steel, M.steelIn, V(0, yTop - hc - hk / 2, 0));
  rim(g, r + 0.01, 0.025, yTop, M.steelB);
  put(g, mk(cyl(0.14, 0.14, 0.7, 16, true), M.steel), 0, yTop + 0.05, 0);           // vortex finder / gas outlet
  put(g, mk(box(0.3, 0.26, 0.2), M.steel), -r - 0.1, yTop - 0.22, -r * 0.55);        // tangential inlet
  put(g, mk(box(0.24, 0.22, 0.24), M.steelB), 0, yb - 0.12, 0);                      // rotary valve
  put(g, mk(along(cyl(0.07, 0.07, 0.24, 12), 'x'), M.motor), 0.22, yb - 0.12, 0);
  for (let k = 0; k < 3; k++) { const a = k / 3 * FULL + 0.4; put(g, mk(cyl(0.035, 0.035, yTop - hc, 8), M.steelB), Math.cos(a) * (r + 0.05), (yTop - hc) / 2, Math.sin(a) * (r + 0.05)); }
  const n = 46, inst = instanced(new THREE.SphereGeometry(0.03, 8, 6), M.powder, n, g);
  const sd = Array.from({ length: n }, () => ({ u: Math.random(), a: Math.random() * FULL }));
  const dm = new THREE.Object3D();
  updaters.push((dt, s) => {
    const on = stages.includes(s);
    inst.visible = on;
    if (!on) return;
    for (let i = 0; i < n; i++) {
      const q = sd[i]; q.u = (q.u + dt * 0.35) % 1; q.a += dt * 7;
      const y = yTop - 0.15 - q.u * (hc + hk - 0.2);
      const rr = (y > yTop - hc ? r : 0.08 + (r - 0.08) * (y - yb) / hk) * 0.82;
      dm.position.set(rr * Math.cos(q.a), y, rr * Math.sin(q.a)); dm.updateMatrix(); inst.setMatrixAt(i, dm.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
  });
  return { inlet: V(x - r - 0.25, yTop - 0.22, z - r * 0.55), top: V(x, yTop + 0.4, z), bottom: V(x, yb - 0.25, z) };
}
// Pulse-jet bag filter with exhaust fan; front panel hidden in cutaway to show the bags.
function bagFilter(x, z, { h = 2.2, fanDx = 0.95, fanDz = 0 } = {}) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const y0 = 1.0, W = 0.9;
  put(g, mk(box(W, h, 0.04), M.paint), 0, y0 + h / 2, -W / 2);
  for (const sx of [-1, 1]) put(g, mk(box(0.04, h, W), M.paint), sx * W / 2, y0 + h / 2, 0);
  const fr = put(g, mk(box(W, h, 0.04), M.paint), 0, y0 + h / 2, W / 2); fullParts.push(fr);
  for (const sx of [-1, 1]) { const e = put(g, mk(box(0.06, h, 0.06), M.paint), sx * W / 2, y0 + h / 2, W / 2); cutParts.push(e); }
  put(g, mk(box(W + 0.06, 0.35, W + 0.06), M.paint), 0, y0 + h + 0.17, 0);          // clean-air plenum
  const hop = put(g, mk(cyl(W * 0.7, 0.1, 0.6, 4), M.paint), 0, y0 - 0.3, 0); hop.rotation.y = Math.PI / 4;
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) put(g, mk(box(0.06, y0 - 0.1, 0.06), M.steelB), sx * 0.4, (y0 - 0.1) / 2, sz * 0.4);
  const bags = [];
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) bags.push([V(-0.27 + i * 0.27, y0 + h / 2 + 0.05, -0.27 + j * 0.27)]);
  staticInst(cyl(0.08, 0.08, h - 0.3, 12), std({ color: 0xe9e4d8, roughness: 0.95 }), bags, g);
  put(g, mk(along(cyl(0.04, 0.04, W + 0.3, 10), 'x'), M.steelB), 0, y0 + h + 0.42, 0.25); // pulse header
  // exhaust fan + stack
  put(g, mk(along(cyl(0.3, 0.3, 0.22, 24), 'z'), M.paintBlue), fanDx, 0.55, fanDz);
  const fm = hMotor(0.34, 0.12); fm.rotation.y = Math.PI / 2; fm.position.set(fanDx, 0.35, fanDz + (fanDz < 0 ? -0.4 : 0.4)); g.add(fm);
  put(g, mk(cyl(0.11, 0.11, 2.6, 14), M.steelB), fanDx, 2.1, fanDz - 0.1);
  return { inlet: V(x - W / 2, y0 + h * 0.75, z), fan: V(x + fanDx, 0.55, z + fanDz) };
}

  const X = -12.2, Z = ZB, YT = 3.8, R = 0.95, HC = 1.2, HK = 1.3;
  const yb = YT - HC - HK;
  const g = new THREE.Group(); g.position.set(X, 0, Z); scene.add(g);
  pair(g, (s, l) => cyl(R, R, HC, 48, true, s, l), CUT_CYL, M.steel, M.steelIn, V(0, YT - HC / 2, 0));
  pair(g, (s, l) => cyl(R, 0.14, HK, 48, true, s, l), CUT_CYL, M.steel, M.steelIn, V(0, YT - HC - HK / 2, 0));
  pair(g, (s, l) => cyl(R + 0.02, R + 0.02, 0.06, 48, false, s, l), CUT_CYL, M.steelB, M.steelIn, V(0, YT + 0.03, 0));
  rim(g, R + 0.02, 0.03, YT - HC, M.steelB);
  for (let k = 0; k < 4; k++) { const a = Math.PI / 4 + k * Math.PI / 2; put(g, mk(box(0.1, YT - HC, 0.1), M.steelB), Math.cos(a) * (R + 0.06), (YT - HC) / 2, Math.sin(a) * (R + 0.06)); }
  put(g, mk(cyl(0.42, 0.42, 0.28, 32), M.steelB), 0, YT + 0.2, 0);                      // hot-air disperser
  put(g, mk(cyl(0.15, 0.15, 0.55, 20), M.motor), 0, YT + 0.6, 0);                        // atomizer drive
  put(g, mk(cyl(0.05, 0.05, 0.3, 10), M.steel), 0, YT - 0.1, 0);
  const disc = new THREE.Group(); disc.position.y = YT - 0.25; g.add(disc);
  put(disc, mk(cyl(0.17, 0.17, 0.06, 20), M.steel), 0, 0, 0);
  for (let k = 0; k < 2; k++) put(disc, mk(box(0.36, 0.07, 0.03), M.steelB), 0, 0, 0).rotation.y = k * Math.PI / 2;
  rotors.push({ obj: disc, axis: 'y', run: [14], w: 30, cur: 0 });
  put(g, mk(box(0.22, 0.2, 0.22), M.steelB), 0, yb - 0.12, 0);                           // product rotary valve
  // hot-air generator + supply fan (back side) and duct to the disperser
  const heatM = std({ color: 0x3a3f45, roughness: 0.6, emissive: 0xff5a14, emissiveIntensity: 0 });
  put(g, mk(box(0.9, 0.8, 0.6), M.paintBlue), -1.75, 0.4, -0.95);
  put(g, mk(box(0.6, 0.35, 0.02), heatM, false), -1.75, 0.45, -0.64);
  put(g, mk(along(cyl(0.28, 0.28, 0.2, 24), 'z'), M.paintBlue), -2.55, 0.45, -0.95);
  const fm = hMotor(0.32, 0.11); fm.rotation.y = Math.PI / 2; fm.position.set(-2.55, 0.25, -1.45); g.add(fm);
  // droplets → drying particles
  const n = 150, inst = instanced(new THREE.SphereGeometry(0.03, 8, 6), M.powder, n, g);
  const sd = Array.from({ length: n }, () => ({ u: Math.random(), a: Math.random() * FULL, v: 0.8 + Math.random() * 0.4 }));
  const dm = new THREE.Object3D();
  updaters.push((dt, s, p) => {
    const on = s === 14;
    heatM.emissiveIntensity += ((on ? 1.2 : 0.05) - heatM.emissiveIntensity) * Math.min(1, dt * 2);
    inst.visible = on;
    if (!on) return;
    for (let i = 0; i < n; i++) {
      const q = sd[i]; q.u = (q.u + dt * 0.28 * q.v) % 1;
      let r, y;
      if (q.u < 0.15) { const k = q.u / 0.15; r = 0.18 + 0.62 * k; y = YT - 0.25 - 0.1 * k; }
      else { const k = (q.u - 0.15) / 0.85; y = YT - 0.35 - k * (HC + HK - 0.5); r = y > YT - HC ? 0.8 - 0.25 * k : Math.max(0.05, 0.55 * (y - yb) / HK); }
      dm.position.set(r * Math.cos(q.a), y, r * Math.sin(q.a));
      dm.scale.setScalar(q.u < 0.15 ? 1.2 : 1.2 - 0.6 * clamp01((q.u - 0.15) / 0.4)); dm.updateMatrix(); inst.setMatrixAt(i, dm.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
  });
  return { X, YT, yb, feed: V(X + 0.3, YT + 0.36, Z), out: V(X, yb - 0.24, Z), air: V(X - 1.75, 0.8, Z - 0.95) };
})();

/* -- S15 1st calcination: externally heated rotary kiln (retort tube, riding rings, 3 heater zones) -- */
const rkZ = [0, 1, 2].map(() => std({ color: 0x8a4a2a, roughness: 0.9, emissive: 0xff6a1a, emissiveIntensity: 0.15 }));
const rk = (() => {
  const XC = -6.4, Z = ZB, Y = 1.35, L = 5.6, R = 0.36, TILT = -0.03;
  const base = new THREE.Group(); base.position.set(XC, 0, Z); scene.add(base);
  const g = new THREE.Group(); g.position.set(XC, Y, Z); g.rotation.z = TILT; scene.add(g);
  pair(g, (s, l) => along(cyl(R, R, L, 40, true, s, l), 'x'), 0, M.steelB, M.steelIn, V(0, 0, 0));   // retort tube
  const rot = new THREE.Group(); g.add(rot);
  for (const xx of [-2.35, 2.35]) { const tr = mk(new THREE.TorusGeometry(R + 0.06, 0.05, 10, 40), M.steel); tr.rotation.y = Math.PI / 2; put(rot, tr, xx, 0, 0); }
  put(rot, mk(along(cyl(R + 0.12, R + 0.12, 0.1, 40), 'x'), M.motorG), -1.95, 0, 0);    // girth gear
  const lug = []; for (const xx of [-2.35, -1.95, 2.35]) for (let k = 0; k < 8; k++) { const a = k / 8 * FULL; lug.push([V(xx, Math.cos(a) * (R + 0.1), Math.sin(a) * (R + 0.1)), [a, 0, 0]]); }
  staticInst(box(0.06, 0.05, 0.08), M.dark, lug, rot);
  rotors.push({ obj: rot, axis: 'x', run: [15], w: 1.6, cur: 0 });
  // support rollers + pedestals, drive
  for (const xx of [-2.35, 2.35]) for (const sz of [-1, 1]) {
    const yy = Y + xx * TILT - (R + 0.06 + 0.1) * 0.8;
    put(base, mk(along(cyl(0.1, 0.1, 0.16, 16), 'x'), M.steel), xx, yy, sz * 0.3);
    put(base, mk(box(0.3, yy - 0.08, 0.22), M.paintBlue), xx, (yy - 0.08) / 2, sz * 0.3);
  }
  put(base, mk(box(0.45, 0.45, 0.45), M.motorG), -1.95, 0.42, -0.85);
  const dmot = hMotor(0.4, 0.14); dmot.position.set(-1.3, 0.3, -0.85); base.add(dmot);
  put(base, mk(box(L + 0.6, 0.08, 1.4), M.dark), 0, 0.04, 0);
  // heater housing over the middle (3 zones); front panel hidden in cutaway
  const HL = 3.4, HY = Y + 0.05;
  put(base, mk(box(HL, 1.2, 0.06), M.paintBlue), 0, HY, -0.6);
  const roof = put(base, mk(box(HL, 0.06, 1.2), M.paintBlue), 0, HY + 0.6, 0); fullParts.push(roof);   // roof also opens in cutaway
  const roofC = put(base, mk(box(HL, 0.06, 0.45), M.paintBlue), 0, HY + 0.6, -0.375); cutParts.push(roofC);
  put(base, mk(box(HL, 0.06, 1.2), M.paintBlue), 0, HY - 0.6, 0);
  for (const sx of [-1, 1]) put(base, mk(box(0.06, 1.2, 1.2), M.paintBlue), sx * HL / 2, HY, 0);
  const fr = put(base, mk(box(HL, 1.2, 0.06), M.paintBlue), 0, HY, 0.6); fullParts.push(fr);
  for (let k = 0; k <= 3; k++) { const e = put(base, mk(box(0.07, 1.2, 0.07), M.paintBlue), -HL / 2 + k * HL / 3, HY, 0.6); cutParts.push(e); }
  for (let k = 0; k < 3; k++) {
    put(base, mk(box(HL / 3 - 0.12, 1.0, 0.03), rkZ[k], false), -HL / 2 + (k + 0.5) * HL / 3, HY, -0.55);
    for (const zz of [-0.3, 0.05]) put(base, mk(along(cyl(0.03, 0.03, HL / 3 - 0.2, 8), 'x'), rkZ[k], false), -HL / 2 + (k + 0.5) * HL / 3, HY + 0.45, zz);   // heater rods above the tube
  }
  for (let k = 0; k < 3; k++) put(base, mk(cyl(0.03, 0.03, 0.35, 8), M.steelB), -HL / 2 + (k + 0.5) * HL / 3, HY + 0.8, 0.2);   // thermocouples
  // feed end: hood, screw, hopper, exhaust; discharge end: hood + chute
  const xf = -L / 2 - 0.15, xd = L / 2 + 0.15;
  put(base, mk(box(0.4, 0.95, 0.95), M.steel), xf, Y + xf * TILT, 0);
  put(base, mk(box(0.4, 0.95, 0.95), M.steel), xd, Y + xd * TILT, 0);
  put(base, mk(cyl(0.3, 0.1, 0.45, 20), M.steel), xf - 0.25, 2.55, 0);
  put(base, mk(along(cyl(0.07, 0.07, 0.6, 12), 'x'), M.steel), xf - 0.05, 2.0, 0);
  put(base, mk(cyl(0.11, 0.11, 1.9, 14), M.steelB), xf, 2.75, -0.3);
  put(base, mk(cyl(0.16, 0.08, 0.45, 4, true), M.steel), xd + 0.05, Y - 0.7, 0).rotation.y = Math.PI / 4;
  for (const xx of [xf, xd]) for (const sz of [-0.35, 0.35]) put(base, mk(box(0.06, Y - 0.45, 0.06), M.steelB), xx, (Y - 0.45) / 2, sz);
  // powder bed travelling down the tube + CO2 puffs at the exhaust
  const n = 140, bed = instanced(new THREE.SphereGeometry(0.035, 8, 6), M.powder, n, g);
  const sd = Array.from({ length: n }, () => ({ u: Math.random(), a: Math.random(), w: 0.6 + Math.random() * 0.8 }));
  const nc = 30, co2 = instanced(new THREE.SphereGeometry(0.06, 8, 6), M.air, nc, base);
  const cs = Array.from({ length: nc }, () => ({ u: Math.random(), a: Math.random() * FULL }));
  const dm = new THREE.Object3D();
  updaters.push((dt, s, p, t) => {
    const on = s === 15;
    const zt = on ? [0.9, 1.4, 1.1] : [0.15, 0.15, 0.15];
    rkZ.forEach((m, k) => { m.emissiveIntensity += (zt[k] - m.emissiveIntensity) * Math.min(1, dt * 2); });
    bed.visible = co2.visible = on;
    if (!on) return;
    for (let i = 0; i < n; i++) {
      const q = sd[i]; q.u = (q.u + dt * 0.05 * q.w) % 1;
      const th = -Math.PI / 2 + 0.55 + 0.55 * Math.sin(t * 2.2 * q.w + q.a * 6);   // tumbling up the rising wall
      const rr = R - 0.05 - 0.12 * q.a;
      dm.position.set(-L / 2 + 0.1 + q.u * (L - 0.2), rr * Math.sin(th), rr * Math.cos(th) * 0.9);
      dm.updateMatrix(); bed.setMatrixAt(i, dm.matrix);
    }
    for (let i = 0; i < nc; i++) {
      const q = cs[i]; q.u = (q.u + dt * 0.4) % 1;
      dm.position.set(xf + 0.12 * Math.cos(q.a) + q.u * 0.3, 3.7 + q.u * 1.6, -0.3 + 0.12 * Math.sin(q.a));
      dm.scale.setScalar(0.5 + q.u * 1.4); dm.updateMatrix(); co2.setMatrixAt(i, dm.matrix);
    }
    bed.instanceMatrix.needsUpdate = co2.instanceMatrix.needsUpdate = true;
  });
  cabinet(XC + 0.4, Z - 1.35, 0, 1.7, (x, W, H, s, p) => {
    x.fillStyle = '#7fc7ff'; x.font = 'bold 15px system-ui'; x.fillText('ROTARY KILN', 10, 22);
    x.fillStyle = '#9db0c2'; x.font = '12px system-ui'; x.fillText('600–700 °C · 체류 ~0.3 h (예)', 10, 44);
    const z = ['Z1', 'Z2', 'Z3'];
    for (let k = 0; k < 3; k++) {
      const v = rkZ[k].emissiveIntensity / 1.4;
      x.fillStyle = '#2b4a60'; x.fillRect(12 + k * 80, 58, 70, 44);
      x.fillStyle = `rgba(255,122,58,${0.25 + 0.75 * v})`; x.fillRect(12 + k * 80, 102 - 44 * v, 70, 44 * v);
      x.fillStyle = '#e9eef3'; x.font = 'bold 13px system-ui'; x.fillText(z[k], 36 + k * 80, 124);
    }
    x.fillStyle = '#9db0c2'; x.font = '10px system-ui'; x.fillText('공기 흐름 · CO₂ ≤ 15 mol% · [us20090264276]', 10, H - 6);
  });
  return { hopper: V(XC + xf - 0.25, 2.85, Z), out: V(XC + xd + 0.05, Y - 0.95, Z), blow: V(XC + xd + 0.7, 0.5, Z + 0.7) };
})();
makePipe([spray.out, V(spray.out.x, 0.55, ZB), V(spray.out.x, 0.55, ZB + 1.15), V(rk.hopper.x - 0.35, 0.55, ZB + 1.15), V(rk.hopper.x - 0.35, 3.15, ZB + 1.15), V(rk.hopper.x, 3.15, ZB + 1.15), V(rk.hopper.x, 3.15, ZB), rk.hopper.clone()],
  { stages: [14], r: 0.06, mat: M.powder, speed: 1.4, valveAt: null, win: [0.3, 1] });
(() => { // process-air blower at the discharge end (air sweeps CO2 out)

/* -- S2 main calcination: sagger kiln (continuous roller-hearth shape (g); sources use batch furnaces) -- */
const kiln = (() => {
  const x0 = -0.6, x1 = 4.4, xc = (x0 + x1) / 2, KL = x1 - x0;
  const g = new THREE.Group(); g.position.z = ZB; scene.add(g);
  const RY = 0.95;
  // frame legs
  for (let k = 0; k <= 4; k++) for (const sz of [-0.75, 0.75]) put(g, mk(box(0.12, 0.85, 0.12), M.steelB), x0 + k * KL / 4, 0.425, sz);
  // rollers through the whole line (entry table + kiln + exit table)
  const rx0 = x0 - 1.3, rx1 = x1 + 1.3;
  for (let xx = rx0; xx <= rx1 + 1e-3; xx += 0.3) {
    put(g, mk(along(cyl(0.04, 0.04, 1.3, 10), 'z'), M.steelB), xx, RY - 0.05, 0);   // rollers (static: a turning plain roller looks the same)
  }
  for (const sz of [-0.7, 0.7]) put(g, mk(box(rx1 - rx0 + 0.2, 0.1, 0.08), M.steelB), xc, RY - 0.05, sz);
  for (const xx of [rx0 + 0.4, rx1 - 0.4]) for (const sz of [-0.6, 0.6]) put(g, mk(box(0.08, RY - 0.1, 0.08), M.steelB), xx, (RY - 0.1) / 2, sz);
  // refractory body
  put(g, mk(box(KL, 0.25, 1.5), M.brick), xc, RY - 0.25, 0);                    // hearth
  put(g, mk(box(KL, 1.0, 0.18), kilnWall), xc, RY + 0.42, -0.66);               // back wall
  put(g, mk(box(KL, 0.22, 1.5), M.brick), xc, RY + 1.03, 0);                    // roof
  put(g, mk(box(KL + 0.1, 0.12, 1.62), M.paintBlue), xc, RY + 1.2, 0);          // steel casing top
  put(g, mk(box(KL + 0.1, 1.3, 0.04), M.paintBlue), xc, RY + 0.5, -0.79);
  const front = put(g, mk(box(KL, 1.0, 0.18), M.brick), xc, RY + 0.42, 0.66); fullParts.push(front);
  const frontC = put(g, mk(box(KL + 0.1, 1.3, 0.04), M.paintBlue), xc, RY + 0.5, 0.79); fullParts.push(frontC);
  for (let k = 0; k <= 5; k++) { const e = put(g, mk(box(0.08, 1.3, 0.06), M.paintBlue), x0 + k * KL / 5, RY + 0.5, 0.8); cutParts.push(e); }
  for (const xx of [x0, x1]) put(g, mk(box(0.2, 0.55, 1.5), M.brick), xx, RY + 0.66, 0);   // end walls above openings
  // zone glow panels on the back wall: preheat / firing / cooling
  for (let k = 0; k < 3; k++) put(g, mk(box(KL / 3 - 0.12, 0.7, 0.02), kilnZ[k], false), x0 + (k + 0.5) * KL / 3, RY + 0.42, -0.56);
  // burners / thermocouples on roof
  for (let k = 0; k < 6; k++) {
    put(g, mk(cyl(0.05, 0.05, 0.35, 10), M.steelB), x0 + 0.4 + k * (KL - 0.8) / 5, RY + 1.4, 0.35);
    put(g, mk(cyl(0.02, 0.02, 0.4, 8), M.steelB), x0 + 0.4 + k * (KL - 0.8) / 5, RY + 1.45, -0.35);
  }
  // exhaust stack
  const sx = xc - 0.8;
  put(g, mk(cyl(0.2, 0.22, 2.4, 20), M.steelB), sx, RY + 2.4, 0);
  put(g, mk(cyl(0.28, 0.28, 0.08, 20), M.steelB), sx, RY + 3.6, 0);
  // saggers travelling through
  const N = 9, span = rx1 - rx0;
  const sag = [];
  for (let i = 0; i < N; i++) {
    const sgp = dyn(new THREE.Group()); g.add(sgp);
    put(sgp, mk(box(0.5, 0.2, 0.5), M.sagger), 0, 0.1, 0);
    put(sgp, mk(box(0.42, 0.04, 0.42), M.powder, false), 0, 0.19, 0);
    sag.push(sgp);
  }
  let off = 0;
  // CO2 leaving the stack
  const nc = 50, co2 = instanced(new THREE.SphereGeometry(0.07, 8, 6), M.air, nc, g);
  const cs = Array.from({ length: nc }, () => ({ u: Math.random(), a: Math.random() * FULL, r: Math.random() * 0.15 }));
  const dm = new THREE.Object3D();
  updaters.push((dt, s, p) => {
    const on = s === 2;
    if (on) off += dt * 0.32;
    for (let i = 0; i < N; i++) sag[i].position.set(rx0 + 0.25 + ((i / N) * (span - 0.5) + off) % (span - 0.5), RY, 0);
    const z = on ? [0.7, 1.7, 0.6] : [0.25, 0.55, 0.2];
    kilnZ.forEach((m, k) => { m.emissiveIntensity += (z[k] - m.emissiveIntensity) * Math.min(1, dt * 2); });
    kilnWall.emissiveIntensity = kilnZ[1].emissiveIntensity * 0.25;
    co2.visible = on;
    if (!on) return;
    for (let i = 0; i < nc; i++) {
      const q = cs[i]; q.u = (q.u + dt * 0.35) % 1;
      dm.position.set(sx + q.r * Math.cos(q.a) + q.u * 0.4, RY + 3.65 + q.u * 2.2, q.r * Math.sin(q.a));
      dm.scale.setScalar(0.5 + q.u * 1.6); dm.updateMatrix(); co2.setMatrixAt(i, dm.matrix);
    }
    co2.instanceMatrix.needsUpdate = true;
  });
  cabinet(rx1 + 0.9, ZB + 0.2, -0.6, 1.7, (x, W, H, s, p) => {
    x.fillStyle = '#7fc7ff'; x.font = 'bold 15px system-ui'; x.fillText('2ND CALCINATION', 10, 22);
    x.fillStyle = '#9db0c2'; x.font = '12px system-ui'; x.fillText('예 900–1000 °C · 위키 1100–1400 °C', 10, 46);
    const z = ['예열', '하소', '냉각'];
    for (let k = 0; k < 3; k++) {
      const v = kilnZ[k].emissiveIntensity / 1.7;
      x.fillStyle = '#2b4a60'; x.fillRect(12 + k * 80, 62, 70, 40);
      x.fillStyle = `rgba(255,122,58,${0.25 + 0.75 * v})`; x.fillRect(12 + k * 80, 102 - 40 * v, 70, 40 * v);
      x.fillStyle = '#e9eef3'; x.font = 'bold 13px system-ui'; x.fillText(z[k], 30 + k * 80, 124);
    }
  });
  return { xc, exit: V(rx1 - 0.1, RY + 0.3, ZB) };
})();

    const cake = put(pl, mk(box(0.06, 0.95, 0.95), M.powder), 0.07, Y, 0); cake.visible = false;
    plates.push({ pl, cake });
  }
  const mh = dyn(new THREE.Group()); g.add(mh);
  put(mh, mk(box(0.24, 1.4, 1.35), M.paintBlue), 0, Y, 0);
  for (const sz of [-0.7, 0.7]) put(mh, mk(box(0.22, 0.14, 0.16), M.dark), 0, Y + 0.68, sz);
  put(g, mk(along(cyl(0.16, 0.16, 0.55, 24), 'x'), M.steel), ex - 0.42, Y, 0);   // hydraulic cylinder body
  const rod = dyn(put(g, mk(along(cyl(0.05, 0.05, 1, 12), 'x'), M.steel), 0, Y, 0));
  // cake discharge chute in front of the plate pack (shape (g))
  put(g, mk(cyl(0.3, 0.1, 0.3, 4, true), M.steelB), ex - 0.9, 0.6, 1.05).rotation.y = Math.PI / 4;
  // hydraulic power pack
  put(g, mk(box(0.8, 0.5, 0.5), M.paintBlue), ex + 0.2, 0.25, -1.2);
  const hm = hMotor(0.4, 0.13); hm.position.set(ex + 0.2, 0.65, -1.2); g.add(hm);
  // drip tray

/* -- S12 jet mill: feed hopper + vibratory tray + venturi injector, flat grinding chamber with nozzle ring, compressor -- */
const jet = (() => {
  const X = 4.2, Z = 0, CY = 1.35, R = 0.5;
  const g = new THREE.Group(); g.position.set(X, 0, Z); scene.add(g);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) put(g, mk(box(0.07, CY - 0.2, 0.07), M.steelB), sx * 0.42, (CY - 0.2) / 2, sz * 0.42);
  put(g, mk(box(0.95, 0.05, 0.95), M.steelB), 0, CY - 0.18, 0);
  pair(g, (s, l) => cyl(R, R, 0.22, 48, false, s, l), CUT_CYL, M.steel, M.steelIn, V(0, CY, 0));   // grinding chamber
  const man = put(g, mk(new THREE.TorusGeometry(R + 0.17, 0.05, 10, 48), M.steelB), 0, CY, 0); man.rotation.x = Math.PI / 2;
  const NZ = 8, noz = [], jets = [];
  for (let k = 0; k < NZ; k++) {
    const a = k / NZ * FULL + 0.2;
    noz.push([V(Math.cos(a) * (R + 0.08), CY, Math.sin(a) * (R + 0.08)), [0, Math.PI - a + 0.5, Math.PI / 2]]);
    const dx = -Math.cos(a) * Math.cos(1.0) - Math.sin(a) * Math.sin(1.0), dz = -Math.sin(a) * Math.cos(1.0) + Math.cos(a) * Math.sin(1.0);
    jets.push([V(Math.cos(a) * (R - 0.12), CY, Math.sin(a) * (R - 0.12)), [0, Math.atan2(-dz, dx), -Math.PI / 2]]);
  }
  staticInst(cyl(0.028, 0.028, 0.22, 8), M.steel, noz, g);
  const jetM = std({ color: 0xdff3ff, emissive: 0x8fd0ff, emissiveIntensity: 0.9, transparent: true, opacity: 0.5, depthWrite: false });
  const jetI = staticInst(new THREE.ConeGeometry(0.035, 0.26, 10, 1, true).translate(0, -0.13, 0).rotateZ(Math.PI), jetM, jets, g, false);
  put(g, mk(cyl(0.12, 0.12, 0.4, 16), M.steel), 0, CY + 0.3, 0);                       // central outlet (fines)
  // feed: hopper, vibratory tray, venturi injector
  put(g, mk(cyl(0.3, 0.1, 0.42, 20), M.steel), -1.1, 2.35, 0.32);
  put(g, mk(cyl(0.3, 0.3, 0.1, 20), M.steel), -1.1, 2.6, 0.32);
  const tray = put(g, mk(box(0.5, 0.06, 0.16), M.steelB), -0.92, 2.02, 0.32); tray.rotation.z = -0.2;
  put(g, mk(box(0.22, 0.16, 0.18), M.motorG), -1.0, 1.88, 0.32);
  for (const sz of [0.12, 0.52]) put(g, mk(box(0.05, 2.1, 0.05), M.steelB), -1.32, 1.05, sz);
  put(g, mk(along(cyl(0.05, 0.11, 0.42, 14), 'x'), M.steel), -0.62, CY, 0.32);          // venturi injector
  put(g, mk(cyl(0.05, 0.05, 0.34, 10), M.steel), -0.7, CY + 0.33, 0.32);
  // compressor skid + air receiver (air into the nozzle manifold)
  const cx = -1.3, cz = -2.2;
  put(g, mk(box(1.1, 0.08, 0.7), M.dark), cx + 0.35, 0.04, cz);
  put(g, mk(box(0.6, 0.6, 0.6), M.paintBlue), cx + 0.55, 0.38, cz);
  const cm = hMotor(0.4, 0.14); cm.position.set(cx + 0.55, 0.85, cz); g.add(cm);
  put(g, mk(cyl(0.28, 0.28, 1.2, 24), M.paintBlue), cx - 0.25, 0.8, cz);
  for (const yy of [0.2, 1.4]) put(g, mk(new THREE.SphereGeometry(0.28, 20, 8, 0, FULL, yy < 1 ? Math.PI / 2 : 0, Math.PI / 2), M.paintBlue), cx - 0.25, yy, cz);
  makePipe([V(X + cx - 0.25, 1.68, cz), V(X + cx - 0.25, 1.9, cz), V(X, 1.9, cz), V(X, CY, cz), V(X, CY, -R - 0.22)],
    { stages: [12], r: 0.05, mat: M.air, speed: 2.4, valveAt: 0.15, pr: 0.03 });
  // particles: coarse lumps orbit near the wall, fines spiral to the centre outlet
  const n = 80, pi = instanced(new THREE.SphereGeometry(0.03, 8, 6), M.powder, n, g);

    x.fillStyle = on ? '#ffb547' : '#4b6a80'; x.font = 'bold 13px system-ui'; x.fillText(on ? 'RUN' : 'IDLE', 200, 22);
    x.fillStyle = '#9db0c2'; x.font = '12px system-ui'; x.fillText('응집체 > 1 µm → 1차 입자 ~100 nm', 10, 46);
    x.fillStyle = '#9db0c2'; x.font = '12px system-ui'; x.fillText('공기압·투입량: 출처 미기재', 10, 70);
    x.fillStyle = '#9db0c2'; x.font = '10px system-ui'; x.fillText('[us5783165] [hosokawa-bt-web]', 10, H - 8);
  });

/* ------------------------------ process flow (branches) ------------------------------
   FLOW lists the steps in process order. A number is a STAGES index. An object
   { i, label, mark } overrides the list label, or marks the step 'repeat' / 'parallel'.
   A fork { fork, title, opts: [{ key, label, steps, note, onSelect }], def } is a point where the
   line splits into alternative routes. Only the chosen option's steps play; an option
   with no steps skips straight to the step after the fork.
   STAGES indices never change: the animation code keys on them. */
const ROUTE = {};
FLOW.forEach((e) => { if (e.fork) ROUTE[e.fork] = e.def || e.opts[0].key; });
const asStep = (x) => (typeof x === 'number' ? { i: x } : x);
let SEQ = [];
const forkStart = {};
function buildSeq() {
  SEQ = [];
  for (const e of FLOW) {
    if (!e.fork) { SEQ.push(asStep(e)); continue; }
    forkStart[e.fork] = SEQ.length;
    const o = e.opts.find((q) => q.key === ROUTE[e.fork]);
    o.steps.forEach((x) => SEQ.push({ ...asStep(x), fork: e, opt: o }));
  }
}

      const lab = document.createElement('div'); lab.className = 'opt-label'; lab.textContent = o.label; box.appendChild(lab);
      if (!o.steps.length) {
        const sk = document.createElement('div'); sk.className = 'skip';
        sk.textContent = o.note || '이 경로에서는 해당 단계를 거치지 않습니다.'; box.appendChild(sk);

        else box.appendChild(stepButton(st, '·', () => setRoute(e.fork, o.key, st.i)));

}
let curK = 0, lastK = -1;
function jumpK(k) {

}
function setRoute(fid, key, focus = null) {
  ROUTE[fid] = key; buildSeq(); renderFlow();

  if (opt.onSelect) opt.onSelect();     // e.g. swap equipment shown for this route
  let k = focus === null ? -1 : SEQ.findIndex((q) => q.i === focus);

  for (const o of levels) setLevel(o.T, levelAt(o, k, p));
  for (const P of pipes) {
    const on = P.stages.includes(s) && (!P.win || (p >= P.win[0] && p < P.win[1])) && (!P.when || P.when());
    P.inst.visible = on;
    if (!on) continue;
    const ns = P.samples.length - 1;
    for (let i = 0; i < P.n; i++) {
      let u = (i / P.n + (t * P.speed) / P.len) % 1;
      if (P.reverse) u = 1 - u;
      const f = u * ns, k = Math.floor(f), a = P.samples[k], b = P.samples[Math.min(ns, k + 1)];
      dmy.position.lerpVectors(a, b, f - k); dmy.updateMatrix(); P.inst.setMatrixAt(i, dmy.matrix);
    }
    P.inst.instanceMatrix.needsUpdate = true;
  }
  for (const u of updaters) u(dt, s, p, t);

  if (tween) {
    tween.k = Math.min(1, tween.k + dt / 2.2);
    const e = sm(tween.k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.k >= 1) tween = null;
  }
  infoTick += dt;
  if (infoTick > 1 / 30) { infoTick = 0; drawMicro(s, p, t); drawLit(s); }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
bakeStatic(scene);
document.getElementById('loading').remove();
frame();
</script>
</body>
</html>
