<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLCC 적층·압착 3D</title>
<style>
  :root {
    --panel: rgba(15, 20, 27, 0.80);
    --panel-line: rgba(255, 255, 255, 0.12);
    --text: #e9eef3;
    --muted: #9db0c2;
    --accent: #ffb547;
    --accent-ink: #1d1406;
    --g: #8fd0ff;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2229; color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .tag { pointer-events: auto; cursor: pointer; transform: translateY(-6px);
    background: rgba(14, 18, 24, 0.84); color: var(--text); border: 1px solid rgba(255,255,255,.2);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; white-space: nowrap; transition: background .25s, color .25s; }
  .tag b { color: var(--accent); margin-right: 4px; }
  .tag.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tag.active b { color: var(--accent-ink); }
  .sub { pointer-events: none; font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: rgba(255,255,255,.88); color: #1d242c; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .sub.show { opacity: 1; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #left { top: 16px; left: 16px; width: 268px; padding: 14px 14px 12px; }
  #left h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: -.01em; }
  #left .sub-h { font-size: 11.5px; color: var(--muted); margin: 0 0 10px; }
  #stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  #stages button { width: 100%; text-align: left; background: transparent; color: var(--text); border: 0;
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #stages button:hover { background: rgba(255,255,255,.07); }
  #stages button.active { background: rgba(255,181,71,.16); color: #fff; }
  #stages .n { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px;
    background: rgba(255,255,255,.1); flex: none; }
  #stages button.active .n { background: var(--accent); color: var(--accent-ink); }
  #stages .bar { height: 2px; background: var(--accent); width: 0; border-radius: 2px; margin-top: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .controls button, .controls select { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line);
    border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #info { right: 16px; bottom: 16px; width: 390px; max-height: calc(100vh - 32px); overflow: auto; padding: 16px; box-sizing: border-box; }
  #info .head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
  #info .fold { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line); border-radius: 8px; padding: 3px 8px; font: inherit; font-size: 11.5px; cursor: pointer; flex: none; }
  #info.collapsed .body { display: none; }
  #info.collapsed h2 { margin-bottom: 0; }
  #info .kicker { font-size: 11px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
  #info h2 { font-size: 18px; margin: 2px 0 6px; }
  #info p { font-size: 13px; line-height: 1.55; color: #d5dde5; margin: 0 0 10px; }
  #info h3 { font-size: 11.5px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; letter-spacing: .03em; }
  #info ul { margin: 0; padding-left: 16px; font-size: 12.5px; line-height: 1.55; }
  #info li { margin-bottom: 2px; }
  #info code { font-size: 11px; color: var(--g); }
  .g { color: #ffcf8a; font-size: 11px; }
  .canvas-wrap { margin-top: 8px; background: rgba(0,0,0,.25); border-radius: 8px; padding: 6px; }
  .canvas-wrap canvas { width: 100%; display: block; }
  .cap { font-size: 10.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .foot { font-size: 10.5px; color: var(--muted); margin-top: 12px; line-height: 1.5; border-top: 1px solid var(--panel-line); padding-top: 8px; }
  /* process-flow branches */
  #left { max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; }
  #stages li.fork { display: grid; gap: 3px; margin: 3px 0; padding: 6px 6px 6px 7px;
    border: 1px dashed rgba(255,255,255,.2); border-radius: 10px; }
  #stages .fork-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; padding: 0 2px 2px; }
  #stages .fk { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  #stages .seg { display: inline-flex; background: rgba(255,255,255,.07); border-radius: 999px; padding: 2px; gap: 2px; }
  #stages .seg button { width: auto; display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; color: var(--muted); }
  #stages .seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  #stages .opt { display: grid; gap: 2px; padding-left: 7px; border-left: 2px solid rgba(255,255,255,.14); }
  #stages .opt.on { border-left-color: var(--accent); }
  #stages .opt-label { font-size: 10.5px; color: var(--muted); padding: 1px 0 0 2px; }
  #stages .opt.off > button { opacity: .45; }
  #stages .opt.off .n { background: transparent; border: 1px dashed rgba(255,255,255,.3); }
  #stages .skip { font-size: 11.5px; line-height: 1.45; color: var(--muted); padding: 3px 8px 4px; }
  #stages .mk { font-size: 10.5px; color: var(--muted); margin-left: 5px; white-space: nowrap; }
  .tag.off { opacity: .35; }
  @media (max-width: 820px) {
    #left { max-height: none; overflow: visible; }
    #stages li.fork { display: flex; align-items: center; gap: 4px; padding: 3px 5px; margin: 0; }
    #stages .fork-head { padding: 0; }
    #stages .fk { display: none; }
    #stages .opt { display: flex; gap: 4px; border-left: 0; padding-left: 0; }
    #stages .opt.off, #stages .opt-label { display: none; }
    #stages .skip { white-space: nowrap; padding: 0 4px; font-size: 11px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); }
  @media (max-width: 820px) {
    #left { left: 8px; right: 8px; top: 8px; width: auto; padding: 10px; }
    #left .sub-h { display: none; }
    #stages { display: flex; overflow-x: auto; gap: 4px; }
    #stages li { flex: none; }
    #stages button { white-space: nowrap; padding: 5px 8px; }
    #info { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 40vh; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="loading">3D 설비 모형을 불러오는 중…</div>

<div id="left" class="panel">
  <h1>MLCC 적층 · 압착 공정</h1>
  <p class="sub-h">시트 공급·하프컷부터 층별 적층(흡착 또는 전사), 예비 압착, 최종 압착(WIP 또는 일축 프레스)까지 경로별 설비 3D 모형</p>
  <ol id="stages"></ol>
  <div class="controls">
    <button id="play">❚❚ 일시정지</button>
    <select id="speed" aria-label="재생 속도">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <button id="overview">전체 보기</button>
    <label><input type="checkbox" id="tour" checked> 카메라 따라가기</label>
    <label><input type="checkbox" id="cut" checked> 단면 보기</label>
  </div>
</div>

<div id="info" class="panel"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';

/* ------------------------------------------------------------------

   resources/manufacturing/40-lamination-and-dicing.md and the equipment / step-order notes

const G = '<span class="g">(g)</span>';
const STAGES = [
  { name: '시트 롤 공급 · 제전', en: 'Sheet roll supply & static removal', cam: [-14.4, 3.4, 6.2], tgt: [-17.0, 1.3, 0],
    desc: '내부전극을 인쇄한 그린시트가 PET 캐리어 필름에 붙은 롤로 들어옵니다. 언와인더에서 풀린 웹은 제전 바 아래를 지나 흡착 테이블 위로 갑니다. 투렛에는 인쇄 시트 롤과 커버 시트 롤이 함께 걸려 있어, 커버를 쌓을 때 돌려 바꿉니다.',
    equip: ['PET 캐리어 위 인쇄 시트 롤 <code>[us6485591]</code> <code>[jp2000246718]</code>', '송출 롤 · 모터 구동 권취 롤 <code>[us6797092]</code>', '제전 장치 (정전기 방지) <code>[keko-sc]</code>', `투렛(두 롤 교체) · 진공 흡착 테이블 ${G}`],
    params: ['정전기로 인한 주름 → 적층 정밀도 저하 <code>[us7641727]</code>', '예: PET 폭 120 mm · 두께 0.05 mm, 시트 100 × 100 mm · 두께 0.01 mm <code>[jp2000246718]</code>', '낱장 방식은 롤을 미리 잘라(블랭킹) 카세트로 공급: 가장자리 트림 → (기준 구멍) → 길이 절단 → 매거진, 최대 20컷/분 <code>[keko-sc]</code>', 'Murata: 오정렬이 거의 없게, 얇은 시트를 손상 없이 적층 (수치 공개 없음) <code>[murata-gs-web]</code>', '장력 제어·폭 위치 제어(EPC) 구성: 문헌 미확인'] },
  { name: '비전 정렬', en: 'Vision mark measurement & alignment', cam: [-10.0, 3.0, 4.4], tgt: [-12.0, 1.4, 0],

    equip: ['고해상도 카메라 2대 + PC 비전 <code>[keko-st]</code> <code>[keko-sw]</code>', 'X-Y-θ 정렬 테이블 <code>[keko-sw]</code>', '텔레센트릭 렌즈 · 액체 렌즈 자동 초점 <code>[basler-mlcc-2026]</code>', '대안: 위치 결정 핀 <code>[us6485591]</code> <code>[keko-sw]</code>', `링 조명 · 갠트리 구조 ${G}`],
    params: ['마크 중심에서 ΔX·ΔY·Δθ 계산, 층 높이마다 초점 재조정 <code>[basler-mlcc-2026]</code>', '최대 오정렬 ~250 µm → 8–13 µm <code>[us5935365]</code> (원자료 노트에는 8–11 µm로 기록)', 'CCD 정렬 오차 최대 0.01 mm (장비 사양) <code>[dron-stacker-web]</code>', '층수가 수백에서 약 1,000층으로 증가 (0603·0402) <code>[basler-mlcc-2026]</code>', '오정렬은 층마다 누적되어 적층 수를 제한 <code>[us5935365]</code>'] },
  { name: '열판 전사', en: 'Heated-plate transfer', cam: [-3.4, 2.9, 4.9], tgt: [-6.0, 1.3, 0],

    equip: ['열판 / 열롤 전사 라미네이터 <code>[us6485591]</code>', '열롤 + 냉각 테이블(냉각수·히트파이프) <code>[jp2000246718]</code>', `적층 스테이지 = 캐리어 블록 <code>[keko-st]</code>, Z 하강·서보 구동 ${G}`, `라이트 커튼 안전 가드 ${G}`],
    params: ['열판 전사 80 °C, 선하중 15 kg/cm (기존 80 °C, 500 kg/cm²) <code>[us6485591]</code>', '롤 전사 40–100 °C, 0.2–15 MPa (예 80 °C, 1 MPa), 접착층 0.02–0.3 µm <code>[us7641727]</code>', '열롤 80–180 °C 가변, 100 N/cm, 10 mm/s · 테이블 5–10 °C 냉각 (예) <code>[jp2000246718]</code>', '층수 100–1000 (예 560층, 1.13 × 0.85 × 0.75 mm) <code>[us10573466]</code> · 0603에서 ≥400층 <code>[us11348730]</code>', '적층 두께 편차 5–10 µm (51층), 7–15 µm (101층) <code>[us6485591]</code>'] },
  { name: '상부 커버 적층', en: 'Top-cover stacking', cam: [-8.6, 7.0, 16.0], tgt: [-11.2, 1.3, 0],
    desc: '활성층을 다 쌓은 뒤 전극이 없는 커버 시트를 다시 쌓아 상부 보호층을 만듭니다. 같은 적층기에서 공급 롤만 커버 시트 롤로 바꾸고, 선택한 적층 방식(흡착 또는 전사)으로 쌓습니다. 전극 두께만큼 마진이 낮아지는 단차는 빈 영역에 세라믹 페이스트를 인쇄하거나, 고점도 커버로 오목한 마진을 채워 줄입니다.',
    equip: [`같은 적층기 + 커버 시트 롤 (투렛 교체는 ${G})`, '별도 커버 시트 제조기 (롤에서 잘라 진공 척으로 쌓고 가열 프레스) <code>[keko-csm]</code>', '고점도 커버 슬러리 코터 <code>[us9001493]</code>', '서브블록(75/150층) 적층 방식 <code>[us5935365]</code>'],
    params: ['커버 두께 15–70 µm/면 <code>[us10573466]</code> · ≤20 µm <code>[us11348730]</code> · 하부 ≥30 µm <code>[us11600441]</code> (설계 의도가 달라 충돌 아님)', '서브블록을 최대 ~160 µm 커버층 위에 적층 <code>[us5935365]</code>', '단차 보상 커버 슬러리 10,000–300,000 cps, 함몰비 0–0.15 <code>[us9001493]</code>', '블랭크 패턴 페이스트 4–30 Pa·s, 전극 두께 수준(예 1 µm) <code>[us7641727]</code>'] },
  { name: '진공 포장', en: 'Vacuum bagging', cam: [5.1, 3.0, 4.7], tgt: [3.0, 1.1, 0],
    desc: '정수압(WIP) 경로에서만 거칩니다. 블록을 캐리어 판에 올리고 일정 두께의 수지 시트를 덮어 봉지에 넣습니다. 챔버를 닫고 공기를 빼 층 사이에 남은 공기를 없앤 뒤, 봉지 입구를 열로 밀봉합니다. 봉지는 압력 매체(물)가 세라믹에 닿지 않게 막습니다.',
    equip: ['챔버식 진공 포장기 (연구·시작용) <code>[multivac-c200]</code>, 양산은 딥드로잉식 <code>[multivac-r145]</code>', '온수 프레스용 필름(알루미늄 포함 필름 등) <code>[multivac-c200]</code> · 고무·비닐 피복 <code>[us4749421]</code>', '일정 두께 수지 시트 (최외층) <code>[us10573466]</code>', `진공 펌프 · 히트 실 바 · 캐리어 판 ${G}`],
    params: ['목적: 층간 공기 제거 → 균일 가압, 물 차단, 결함·균열 방지 <code>[multivac-c200]</code>', '포장 크기 최대 약 500 × 500 mm (양산기) <code>[multivac-r145]</code>', '수지 시트를 최외층에 두면 전극이 없는 영역까지 압력이 전달됨 <code>[us10573466]</code>', '진공도·밀봉 조건: 문헌 미기재'] },
  { name: '정수압 가압 · 유지 (WIP)', en: 'WIP pressurize, hold, release', cam: [14.6, 4.7, 7.8], tgt: [11.0, 2.2, 0],

function holeTexture(n, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = c.height = 128;

  const s = 128 / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    x.beginPath(); x.arc(s * (i + 0.5) + (j % 2 ? s / 2 : 0), s * (j + 0.5), s * 0.3, 0, Math.PI * 2); x.fill();

}

/* ------------------------------ helpers ------------------------------ */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const CUT_CYL = Math.PI / 4, CUT_SPH = 3 * Math.PI / 4, CUT_TL = 1.5 * Math.PI, FULL = Math.PI * 2;

const FY = 0.32; // floor-level pipe height

function mk(geo, mat, cast = true) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; return m; }
function put(parent, m, x = 0, y = 0, z = 0) { m.position.set(x, y, z); parent.add(m); return m; }
// Repeated parts (legs, bolts, fins, LEDs …) share one draw call through an InstancedMesh.
const _tmo = new THREE.Object3D();
function tm(x, y, z, rx = 0, ry = 0, rz = 0) { _tmo.position.set(x, y, z); _tmo.rotation.set(rx, ry, rz); _tmo.updateMatrix(); return _tmo.matrix.clone(); }
function inst(geo, mat, mats, cast = true) {
  const im = new THREE.InstancedMesh(geo, mat, mats.length);
  mats.forEach((m, i) => im.setMatrixAt(i, m));
  im.castShadow = cast; im.receiveShadow = true; return im;
}
const cyl = (r1, r2, h, seg = 32, open = false, ts = 0, tl = FULL) => new THREE.CylinderGeometry(r1, r2, h, seg, 1, open, ts, tl);
const box = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const along = (geo, axis) => { if (axis === 'x') geo.rotateZ(-Math.PI / 2); if (axis === 'z') geo.rotateX(Math.PI / 2); return geo; };
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const sm = (t) => t * t * (3 - 2 * t);
const seg = (p, a, b) => sm(clamp01((p - a) / (b - a)));
const lerp = (a, b, k) => a + (b - a) * k;

// Builds a cutaway variant (front quadrant removed, inner face shaded) and a full variant.
function pair(parent, geoFn, cutStart, matOut, matIn, pos) {
  const gc = geoFn(cutStart, CUT_TL);
  const a = mk(gc, matOut), b = mk(gc, matIn, false), f = mk(geoFn(0, FULL), matOut);
  for (const m of [a, b, f]) { m.position.copy(pos); parent.add(m); }
  cutParts.push(a, b); fullParts.push(f);
}
function rim(parent, R, tube, y, mat) {
  const gc = new THREE.TorusGeometry(R, tube, 8, 64, CUT_TL); gc.rotateX(Math.PI / 2); gc.rotateY(5 * Math.PI / 4);
  const gf = new THREE.TorusGeometry(R, tube, 8, 64); gf.rotateX(Math.PI / 2);
  const a = put(parent, mk(gc, mat), 0, y, 0), f = put(parent, mk(gf, mat), 0, y, 0);
  cutParts.push(a); fullParts.push(f);
}
// Thick-walled body of revolution from an (r, y) profile: cut variant gets shaded section faces.
function shell(parent, prof, pos, mat, capMat) {
  const pts = prof.map(([r, y]) => new THREE.Vector2(r, y));
  const a = mk(new THREE.LatheGeometry(pts, 72, CUT_CYL, CUT_TL), mat); a.position.copy(pos); parent.add(a); cutParts.push(a);
  const f = mk(new THREE.LatheGeometry(pts, 72), mat); f.position.copy(pos); parent.add(f); fullParts.push(f);
  const shape = new THREE.Shape(pts);
  for (const th of [CUT_CYL, CUT_CYL + CUT_TL]) {
    const c = mk(new THREE.ShapeGeometry(shape), capMat); c.position.copy(pos); c.rotation.y = th - Math.PI / 2;
    parent.add(c); cutParts.push(c);
  }
}
const inCutQuadrant = (a) => { const w = Math.atan2(Math.sin(a), Math.cos(a)); return Math.abs(w) < Math.PI / 4; };
function label(text, pos, cls = 'tag', stage = null) {

}

/* ------------------------------ tank (medium reservoir) ------------------------------ */
function makeTank(o) {
  const { x = 0, z = 0, r = 1, h = 1.8, legH = 1.0, liquidMat = M.water, lvl = null } = o;
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const hd = 0.32 * r, y0 = legH + hd, y1 = y0 + h;
  pair(g, (s, l) => cyl(r, r, h, 64, true, s, l), CUT_CYL, M.steel, M.steelIn, V(0, y0 + h / 2, 0));
  pair(g, (s, l) => { const q = new THREE.SphereGeometry(r, 64, 12, s, l, Math.PI / 2, Math.PI / 2); q.scale(1, 0.32, 1); return q; }, CUT_SPH, M.steel, M.steelIn, V(0, y0, 0));
  pair(g, (s, l) => { const q = new THREE.SphereGeometry(r, 64, 12, s, l, 0, Math.PI / 2); q.scale(1, 0.32, 1); return q; }, CUT_SPH, M.steel, M.steelIn, V(0, y1, 0));
  rim(g, r + 0.012, 0.03, y1, M.steelB);
  rim(g, r + 0.01, 0.022, y0, M.steelB);
  for (let k = 0; k < 4; k++) {
    const a = Math.PI / 4 + k * Math.PI / 2, lx = Math.cos(a) * r * 1.07, lz = Math.sin(a) * r * 1.07;
    put(g, mk(cyl(0.05, 0.05, y0 + 0.3, 12), M.steelB), lx, (y0 + 0.3) / 2, lz);
    put(g, mk(box(0.2, 0.03, 0.2), M.steelB), lx, 0.015, lz);
  }
  const inA = [-Math.PI / 2, Math.PI / 2];
  const rn = 0.55 * r, hy = y1 + 0.32 * r * Math.sqrt(1 - 0.55 * 0.55);
  const inlets = inA.map((th) => {
    const nx = rn * Math.sin(th), nz = rn * Math.cos(th);
    put(g, mk(cyl(0.055, 0.055, 0.26, 16), M.steel), nx, hy + 0.11, nz);
    put(g, mk(cyl(0.1, 0.1, 0.035, 20), M.steelB), nx, hy + 0.25, nz);
    return V(x + nx, hy + 0.27, z + nz);
  });
  put(g, mk(cyl(0.055, 0.055, 0.2, 16), M.steel), 0, legH - 0.06, 0);
  put(g, mk(cyl(0.1, 0.1, 0.035, 20), M.steelB), 0, legH - 0.16, 0);
  const outlet = V(x, legH - 0.18, z);
  put(g, mk(cyl(0.18, 0.18, 0.1, 24), M.steelB), -0.3 * r, hy + 0.05, -0.35 * r);
  const L = new THREE.Group(); L.position.y = y0; g.add(L);
  const lr = r * 0.965;
  put(L, mk(cyl(lr, lr, 1, 64, true, CUT_CYL, CUT_TL), liquidMat, false), 0, 0.5, 0);
  const cap = put(L, new THREE.Mesh(new THREE.CircleGeometry(lr, 64, -Math.PI / 4, CUT_TL), liquidMat), 0, 1, 0);
  cap.rotation.x = -Math.PI / 2;
  for (const th of [CUT_CYL, -CUT_CYL]) {
    const pl = put(L, new THREE.Mesh(new THREE.PlaneGeometry(lr, 1), liquidMat), lr / 2 * Math.sin(th), 0.5, lr / 2 * Math.cos(th));
    pl.rotation.y = th - Math.PI / 2;
  }
  const lh = new THREE.SphereGeometry(lr, 48, 10, CUT_SPH, CUT_TL, Math.PI / 2, Math.PI / 2); lh.scale(1, 0.32, 1);
  const headLiq = put(g, new THREE.Mesh(lh, liquidMat), 0, y0, 0);
  const T = { g, x, z, r, h, y0, y1, legH, inlets, outlet, L, headLiq };
  if (lvl) levels.push({ T, ...lvl });
  return T;
}

/* ------------------------------ pipes ------------------------------ */
function roundedPath(pts, rc = 0.3) {
  const path = new THREE.CurvePath();
  let prev = pts[0].clone();
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], p = pts[i], b = pts[i + 1];
    const din = p.clone().sub(a).normalize(), dout = b.clone().sub(p).normalize();
    const r = Math.min(rc, p.distanceTo(a) / 2, p.distanceTo(b) / 2);
    const pA = p.clone().addScaledVector(din, -r), pB = p.clone().addScaledVector(dout, r);
    if (prev.distanceTo(pA) > 1e-4) path.add(new THREE.LineCurve3(prev.clone(), pA));
    path.add(new THREE.QuadraticBezierCurve3(pA, p.clone(), pB));
    prev = pB;
  }
  path.add(new THREE.LineCurve3(prev, pts[pts.length - 1].clone()));
  return path;
}
function dedupe(pts) { return pts.filter((p, i) => i === 0 || p.distanceTo(pts[i - 1]) > 1e-3); }
function flange(pos, dir, r) {
  const f = mk(cyl(r * 1.9, r * 1.9, 0.045, 20), M.steelB);
  f.position.copy(pos); f.quaternion.setFromUnitVectors(V(0, 1, 0), dir.clone().normalize()); scene.add(f);
}
function valve(pos, r) {
  put(scene, mk(new THREE.SphereGeometry(r * 1.7, 16, 12), M.steelB), pos.x, pos.y, pos.z);
  put(scene, mk(cyl(0.02, 0.02, 0.25, 8), M.steelB), pos.x, pos.y + 0.14, pos.z);
  const hw = put(scene, mk(new THREE.TorusGeometry(0.11, 0.015, 8, 24), M.yellow), pos.x, pos.y + 0.27, pos.z);
  hw.rotation.x = Math.PI / 2;
}
function makePipe(pts, { stages = [], r = 0.06, speed = 1.4, mat = M.waterFlow, valveAt = 0.12, reverse = false, win = null } = {}) {
  pts = dedupe(pts);
  const path = roundedPath(pts);
  const len = path.getLength();
  const tube = mk(new THREE.TubeGeometry(path, Math.max(40, Math.round(len * 14)), r, 12, false), pipeMat, false);
  scene.add(tube);
  flange(pts[0], pts[1].clone().sub(pts[0]), r);
  flange(pts[pts.length - 1], pts[pts.length - 1].clone().sub(pts[pts.length - 2]), r);
  if (valveAt !== null) valve(path.getPointAt(valveAt), r);
  const samples = path.getSpacedPoints(Math.max(60, Math.round(len * 30)));
  const n = Math.max(6, Math.round(len * 3.2));
  const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(r * 0.75, 10, 8), mat, n);
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage); inst.frustumCulled = false; inst.visible = false;
  scene.add(inst);
  const P = { samples, len, inst, n, stages, speed, reverse, win };
  pipes.push(P);
  return P;
}

   film take-up. Transfer route (2, 10): film window over the stack, peel roller, rewinder. */

function ppState(s, p) {
  const o = { show: false, cx: -1.3, lower: 0, P: 0, comp: 0, phase: '대기' };
  if (s === 11) {
    o.show = true;
    o.cx = p < 0.15 ? lerp(-1.3, 0, sm(p / 0.15)) : p < 0.88 ? 0 : lerp(0, 1.2, sm((p - 0.88) / 0.12));
    o.lower = seg(p, 0.15, 0.3) * (1 - seg(p, 0.75, 0.88));
    o.P = seg(p, 0.3, 0.42) * (1 - seg(p, 0.66, 0.75));
    o.comp = seg(p, 0.3, 0.7);
    o.phase = p < 0.15 ? '반입' : p < 0.3 ? '하강' : p < 0.42 ? '가압' : p < 0.66 ? '유지' : p < 0.88 ? '상승' : '반출';

}

/* ------------------------------ process flow (branches) ------------------------------
   FLOW lists the steps in process order. A number is a STAGES index. An object
   { i, label, mark } overrides the list label, or marks the step 'repeat' / 'parallel'.
   A fork { fork, title, opts: [{ key, label, steps, note, onSelect }], def } is a point where the
   line splits into alternative routes. Only the chosen option's steps play; an option
   with no steps skips straight to the step after the fork.
   STAGES indices never change: the animation code keys on them. */
const ROUTE = {};
FLOW.forEach((e) => { if (e.fork) ROUTE[e.fork] = e.def || e.opts[0].key; });
const asStep = (x) => (typeof x === 'number' ? { i: x } : x);
let SEQ = [];
const forkStart = {};
function buildSeq() {
  SEQ = [];
  for (const e of FLOW) {
    if (!e.fork) { SEQ.push(asStep(e)); continue; }
    forkStart[e.fork] = SEQ.length;
    const o = e.opts.find((q) => q.key === ROUTE[e.fork]);
    o.steps.forEach((x) => SEQ.push({ ...asStep(x), fork: e, opt: o }));
  }
}
buildSeq();

const ol = document.getElementById('stages');
let seqBtns = [];
function stepButton(step, n, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  const mk = step.mark === 'repeat' ? '<span class="mk">↻ 반복</span>' : step.mark === 'parallel' ? '<span class="mk">∥ 병행</span>' : '';
  b.innerHTML = `<span class="n">${n}</span><span style="flex:1">${step.label || STAGES[step.i].name}${mk}<div class="bar"></div></span>`;
  b.addEventListener('click', onClick);
  return b;
}
function renderFlow() {
  ol.innerHTML = ''; seqBtns = [];
  let k = 0;
  for (const e of FLOW) {
    const li = document.createElement('li');
    if (!e.fork) {
      const kk = k++;
      const b = stepButton(asStep(e), kk + 1, () => jumpK(kk));
      seqBtns[kk] = b; li.appendChild(b); ol.appendChild(li); continue;
    }
    li.className = 'fork';
    const head = document.createElement('div'); head.className = 'fork-head';
    head.innerHTML = `<span class="fk">⑂ ${e.title}</span>`;
    const seg = document.createElement('div'); seg.className = 'seg';
    seg.setAttribute('role', 'radiogroup'); seg.setAttribute('aria-label', e.title);
    for (const o of e.opts) {
      const sb = document.createElement('button');
      sb.type = 'button'; sb.textContent = o.label; sb.setAttribute('role', 'radio');
      sb.setAttribute('aria-checked', String(ROUTE[e.fork] === o.key));
      sb.addEventListener('click', () => { if (ROUTE[e.fork] !== o.key) setRoute(e.fork, o.key); });
      seg.appendChild(sb);
    }
    head.appendChild(seg); li.appendChild(head);
    for (const o of e.opts) {
      const on = ROUTE[e.fork] === o.key;
      const box = document.createElement('div'); box.className = `opt ${on ? 'on' : 'off'}`;
      const lab = document.createElement('div'); lab.className = 'opt-label'; lab.textContent = o.label; box.appendChild(lab);
      if (!o.steps.length) {
        const sk = document.createElement('div'); sk.className = 'skip';
        sk.textContent = o.note || '이 경로에서는 해당 단계를 거치지 않습니다.'; box.appendChild(sk);
      }
      for (const x of o.steps) {
        const st = asStep(x);
        if (on) { const kk = k++; const b = stepButton(st, kk + 1, () => jumpK(kk)); seqBtns[kk] = b; box.appendChild(b); }
        else box.appendChild(stepButton(st, '·', () => setRoute(e.fork, o.key, st.i)));
      }
      li.appendChild(box);
    }
    ol.appendChild(li);
  }
  // 3D stage tags: number by the active route, fade stations the route skips.
  const num = new Map();
  SEQ.forEach((q, n) => { if (!num.has(q.i)) num.set(q.i, n + 1); });
  stageTags.forEach((el, i) => {
    el.classList.toggle('off', !num.has(i));
    const b = el.querySelector('b'); if (b) b.textContent = num.has(i) ? num.get(i) : '·';
  });
}
let curK = 0, lastK = -1;
function jumpK(k) {
  curK = ((k % SEQ.length) + SEQ.length) % SEQ.length;
  simT = curK * STAGE_DUR + 0.01; lastK = -1;
}
function setRoute(fid, key, focus = null) {
  ROUTE[fid] = key; buildSeq(); renderFlow();
  const opt = FLOW.find((e) => e.fork === fid).opts.find((q) => q.key === key);
  if (opt.onSelect) opt.onSelect();     // e.g. swap equipment shown for this route
  let k = focus === null ? -1 : SEQ.findIndex((q) => q.i === focus);
  if (k < 0) k = forkStart[fid];          // first step of the chosen option, or the step after the fork
  jumpK(k);
}
// Jump by STAGES index (3D tag clicks). A station off the active route switches to its route.
function jumpTo(i) {
  const k = SEQ.findIndex((q) => q.i === i);
  if (k >= 0) { jumpK(k); return; }
  for (const e of FLOW) if (e.fork) for (const o of e.opts) {
    if (o.steps.some((x) => asStep(x).i === i)) { setRoute(e.fork, o.key, i); return; }
  }
}
renderFlow();

function interpY(prof, xq) {

    const [ax, ay] = prof[i], [bx, by] = prof[i + 1];

}

    x.fillStyle = 'rgba(224,162,74,.85)'; x.fillRect(r.x0 - 2, r.top - 7, r.x1 - r.x0 + 4, 6);  // resin sheet
    const gap = (1 - u.lower) * 40;
    x.fillStyle = heatCol(u.P); x.fillRect(r.x0 - 60, r.top - 7 - gap - 14, r.x1 - r.x0 + 120, 14);
    x.fillStyle = '#e9eef3'; x.fillText('상판', r.x1 + 66, r.top - gap - 8); x.fillText('하판', r.x1 + 66, r.base + 10);
    x.fillText('수지 시트', 18, r.top - 2); x.fillText('금형', r.x0 - 70, r.base - 14);
    if (u.P > 0.05) {
      const col = `rgba(143,208,255,${0.4 + 0.6 * u.P})`;
      for (const ax of [220, 300, 380]) arrowTo(x, ax, r.top - 60, ax, r.top - 30, col);
    }
    msg = u.P > 0.05 ? '위아래 판으로 한 방향 가압 · 수지 시트가 마진(전극 없는 영역)까지 압력 전달'
      : u.lower > 0.5 ? '가압 사이 압력 해제 (수 초 주기 반복)' : u.cx > 0.1 ? '금형 캐비티째 프레스 안팎으로 이동' : '상판 하강';
  } else {
    const uniRoute = ROUTE.press === 'uni';
    const w = wipState(wipStage(s), p);
    const k = s === 4 || s === 12 ? 0.4 : s === 5 ? 0.4 + 0.6 * w.press : 1;
    const r = drawStack(x, { n: 12, cb: 2, ct: 2, k });
    if (s === 12 && p > 0.3) { x.fillStyle = 'rgba(95,159,211,.22)'; x.fillRect(0, 0, W, H); x.fillStyle = '#8fd0ff'; x.fillText('데운 탈이온수', 470, 40); }
    x.fillStyle = '#9aa1a8'; x.fillRect(r.x0 - 40, r.base, r.x1 - r.x0 + 80, 10);
    const bagOn = s === 4 ? p > 0.17 : s === 12 || s === 5 || (s === 6 && p < 0.8 && !uniRoute);
    if (s !== 6 || p < (uniRoute ? 0.55 : 0.8)) { x.fillStyle = 'rgba(224,162,74,.85)'; x.fillRect(r.x0 - 6, r.top - 7, r.x1 - r.x0 + 12, 6); }
    if (bagOn) {
      const pad = s === 4 ? lerp(30, 6, seg(p, 0.3, 0.74)) : 6;
      x.setLineDash([7, 5]); x.strokeStyle = '#8fd0ff'; x.lineWidth = 2;
      x.strokeRect(r.x0 - 40 - pad, r.top - 7 - pad, r.x1 - r.x0 + 80 + 2 * pad, r.base + 10 - r.top + 7 + 2 * pad); x.setLineDash([]);
    }
    if (s === 5 && w.P > 0.05) {
      const L = 14 + 18 * w.P, col = `rgba(143,208,255,${0.4 + 0.6 * w.P})`;
      for (const ay of [r.top + 20, (r.top + r.base) / 2, r.base - 20]) { arrowTo(x, r.x0 - 60 - L, ay, r.x0 - 52, ay, col); arrowTo(x, r.x1 + 60 + L, ay, r.x1 + 52, ay, col); }
      for (const ax of [220, 300, 380]) arrowTo(x, ax, r.top - 30 - L, ax, r.top - 22, col);
    }
    if (s === 4) { x.fillStyle = '#e9eef3'; x.fillText('수지 시트', 470, r.top + 4); x.fillStyle = '#8fd0ff'; x.fillText('진공 봉지', 470, r.top + 28); }
    msg = s === 4 ? '수지 시트를 덮고 진공 포장 → 층간 공기 제거, 물 차단'
      : s === 12 ? (p < 0.6 ? '봉지째 바스켓에 담아 데운 물속으로' : '마개 잠금 → 안전 인터록 확인 뒤 가압 가능')
      : s === 5 ? (w.P > 0.05 ? (p < 0.46 ? '단계별 승압 · 모든 방향에서 같은 압력' : p < 0.78 ? '유지 · 마진 공극이 눌려 닫힘' : '감압') : '인터록 확인 → 가압 시작')
      : '층이 하나로 붙은 그린 블록 → 절단 공정';
  }
  const cap = document.getElementById('microCap'); if (cap) cap.textContent = `${msg} · 모식도, 축척 없음 (층 수·두께 과장)`;
}
function drawChart(s, p, t) {
  const cv = document.getElementById('chart'); if (!cv) return;
  const x = cv.getContext('2d'), W = cv.width, H = cv.height;
  x.clearRect(0, 0, W, H);
  const L = 78, R = W - 18, T = 14, B = H - 44;
  const X = (v) => L + (v - 20) / 100 * (R - L);
  const lo = Math.log10(0.1), hi = Math.log10(400);
  const Yp = (v) => B - (Math.log10(v) - lo) / (hi - lo) * (B - T);
  x.strokeStyle = 'rgba(255,255,255,.25)'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(L, T); x.lineTo(L, B); x.lineTo(R, B); x.stroke();
  x.fillStyle = '#9db0c2'; x.font = '15px system-ui'; x.textAlign = 'center';
  for (const v of [20, 40, 60, 80, 100, 120]) { x.fillRect(X(v), B, 1, 6); x.fillText(String(v), X(v), B + 22); }
  x.fillText('온도 (°C)', (L + R) / 2, H - 4);
  x.textAlign = 'right';
  for (const v of [0.1, 1, 10, 100]) { x.fillRect(L - 6, Yp(v), 6, 1); x.fillText(String(v), L - 10, Yp(v) + 5); }
  x.save(); x.translate(16, (T + B) / 2); x.rotate(-Math.PI / 2); x.textAlign = 'center'; x.fillText('압력 (MPa, 로그)', 0, 0); x.restore();
  const hiT = [2, 3, 7, 10, 15].includes(s), hiP = [5, 6, 8].includes(s);
  // sheet-transfer window and final-press window [us7641727]
  x.fillStyle = `rgba(143,208,255,${hiT ? 0.4 : 0.16})`; x.strokeStyle = '#8fd0ff'; x.lineWidth = hiT ? 2.5 : 1;
  x.fillRect(X(40), Yp(15), X(100) - X(40), Yp(0.2) - Yp(15)); x.strokeRect(X(40), Yp(15), X(100) - X(40), Yp(0.2) - Yp(15));
  x.fillStyle = `rgba(255,181,71,${hiP ? 0.4 : 0.16})`; x.strokeStyle = '#ffb547'; x.lineWidth = hiP ? 2.5 : 1;
  x.fillRect(X(40), Yp(200), X(100) - X(40), Yp(10) - Yp(200)); x.strokeRect(X(40), Yp(200), X(100) - X(40), Yp(10) - Yp(200));
  x.textAlign = 'left'; x.font = '14px system-ui';
  x.fillStyle = '#8fd0ff'; x.fillText('시트 전사 0.2–15 MPa', X(40) + 6, Yp(0.2) - 8);
  x.fillStyle = '#ffb547'; x.fillText('최종 프레스 10–200 MPa', X(40) + 6, Yp(200) + 18);
  // example points
  x.fillStyle = '#cfe9ff'; x.beginPath(); x.arc(X(80), Yp(1), 7, 0, 7); x.fill();
  x.fillStyle = '#e9eef3'; x.fillText('전사 예 80 °C, 1 MPa', X(80) + 12, Yp(1) + 5);
  const pr = hiP ? 8 + 2 * Math.sin(t * 5) : 7;
  x.fillStyle = '#ff8f6b'; x.beginPath(); x.arc(X(85), Yp(98), pr, 0, 7); x.fill();
  x.fillStyle = '#ffd0bd'; x.fillText('WIP 예 ~85 °C, ≈98 MPa', X(85) - 4, Yp(98) - 12 > T + 10 ? Yp(98) - 12 : Yp(98) + 24);
}

/* ------------------------------ loop ------------------------------ */
const clock = new THREE.Clock();
const dmy = new THREE.Object3D();
function levelAt(o, s, p) {
  const { fill, drain, lo, hi } = o;
  if (s === fill) return lo + (hi - lo) * sm(Math.min(1, p / 0.6));
  if (s === drain) return hi - (hi - lo) * seg(p, 0.37, 0.47);
  const hold = fill < drain ? (s > fill && s < drain) : (s > fill || s < drain);
  return hold ? hi : lo;
}
let infoTick = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (playing) simT += dt * speed;
  const total = simT / STAGE_DUR;
  const k = Math.floor(total) % SEQ.length, p = total - Math.floor(total), t = simT;
  const s = SEQ[k].i, sw = wipStage(s);
  if (k !== lastK) {
    lastK = curK = k; lastStage = s;
    seqBtns.forEach((b, n) => b.classList.toggle('active', n === k));
    { // keep the active step visible in the list (horizontal on phones, scrolling panel on short screens)
      const btn = seqBtns[k], list = document.getElementById('stages'), panel = document.getElementById('left');
      if (btn) {
        const br = btn.getBoundingClientRect();
        if (list.scrollWidth > list.clientWidth + 2) { const lr = list.getBoundingClientRect(); list.scrollTo({ left: list.scrollLeft + br.left - lr.left - (list.clientWidth - br.width) / 2, behavior: 'smooth' }); }
        if (panel.scrollHeight > panel.clientHeight + 2) { const pr = panel.getBoundingClientRect(); if (br.top < pr.top || br.bottom > pr.bottom) panel.scrollTo({ top: panel.scrollTop + br.top - pr.top - (panel.clientHeight - br.height) / 2, behavior: 'smooth' }); }
      }
    }
    stageTags.forEach((el, i) => el.classList.toggle('active', i === s));
    SUBS.forEach((q) => q.el.classList.toggle('show', q.s === s && (!q.r || Object.values(ROUTE).includes(q.r))));
    renderInfo(k);
    if (autoTour) flyTo(s);
  }
  seqBtns.forEach((b, n) => { b.querySelector('.bar').style.width = n === k ? `${p * 100}%` : '0'; });

  for (const o of levels) {
    const l = levelAt(o, sw, p);
    o.T.L.scale.y = Math.max(0.001, l * o.T.h);
    o.T.L.visible = l > 0.01; o.T.headLiq.visible = l > 0.005;
  }
  for (const P of pipes) {
    const on = P.stages.includes(sw) && (!P.win || (p >= P.win[0] && p <= P.win[1]));
    P.inst.visible = on;
    if (!on) continue;
    const ns = P.samples.length - 1;
    for (let i = 0; i < P.n; i++) {
      let u = (i / P.n + (t * P.speed) / P.len) % 1;
      if (P.reverse) u = 1 - u;
      const f = u * ns, k = Math.floor(f), a = P.samples[k], b = P.samples[Math.min(ns, k + 1)];
      dmy.position.lerpVectors(a, b, f - k); dmy.updateMatrix(); P.inst.setMatrixAt(i, dmy.matrix);
    }
    P.inst.instanceMatrix.needsUpdate = true;
  }
  for (const u of updaters) u(dt, s, p, t);
  drawHMIs(s, p, t);

  if (tween) {
    tween.k = Math.min(1, tween.k + dt / 2.2);
    const e = sm(tween.k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.k >= 1) tween = null;
  }
  infoTick += dt;
  if (infoTick > 1 / 30) { infoTick = 0; drawMicro(s, p, t); drawChart(s, p, t); }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
document.getElementById('loading').remove();
frame();
</script>
