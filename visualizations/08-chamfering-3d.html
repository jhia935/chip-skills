<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLCC 배럴 면취 3D</title>
<style>
  :root {
    --panel: rgba(15, 20, 27, 0.80);
    --panel-line: rgba(255, 255, 255, 0.12);
    --text: #e9eef3;
    --muted: #9db0c2;
    --accent: #ffb547;
    --accent-ink: #1d1406;
    --g: #8fd0ff;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2229; color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .tag { pointer-events: auto; cursor: pointer; transform: translateY(-6px);
    background: rgba(14, 18, 24, 0.84); color: var(--text); border: 1px solid rgba(255,255,255,.2);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; white-space: nowrap; transition: background .25s, color .25s; }
  .tag b { color: var(--accent); margin-right: 4px; }
  .tag.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tag.active b { color: var(--accent-ink); }
  .sub { pointer-events: none; font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: rgba(255,255,255,.88); color: #1d242c; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .sub.show { opacity: 1; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #left { top: 16px; left: 16px; width: 268px; padding: 14px 14px 12px; }
  #left h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: -.01em; }
  #left .sub-h { font-size: 11.5px; color: var(--muted); margin: 0 0 10px; }
  #stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  #stages button { width: 100%; text-align: left; background: transparent; color: var(--text); border: 0;
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #stages button:hover { background: rgba(255,255,255,.07); }
  #stages button.active { background: rgba(255,181,71,.16); color: #fff; }
  #stages .n { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px;
    background: rgba(255,255,255,.1); flex: none; }
  #stages button.active .n { background: var(--accent); color: var(--accent-ink); }
  #stages .bar { height: 2px; background: var(--accent); width: 0; border-radius: 2px; margin-top: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .controls button, .controls select { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line);
    border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #info { right: 16px; bottom: 16px; width: 390px; max-height: calc(100vh - 32px); overflow: auto; padding: 16px; box-sizing: border-box; }
  #info .head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
  #info .fold { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line); border-radius: 8px; padding: 3px 8px; font: inherit; font-size: 11.5px; cursor: pointer; flex: none; }
  #info.collapsed .body { display: none; }
  #info.collapsed h2 { margin-bottom: 0; }
  #info .kicker { font-size: 11px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
  #info h2 { font-size: 18px; margin: 2px 0 6px; }
  #info p { font-size: 13px; line-height: 1.55; color: #d5dde5; margin: 0 0 10px; }
  #info h3 { font-size: 11.5px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; letter-spacing: .03em; }
  #info ul { margin: 0; padding-left: 16px; font-size: 12.5px; line-height: 1.55; }
  #info li { margin-bottom: 2px; }
  #info code { font-size: 11px; color: var(--g); }
  .g { color: #ffcf8a; font-size: 11px; }
  .canvas-wrap { margin-top: 8px; background: rgba(0,0,0,.25); border-radius: 8px; padding: 6px; }
  .canvas-wrap canvas { width: 100%; display: block; }
  .cap { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .foot { font-size: 10.5px; color: var(--muted); margin-top: 12px; line-height: 1.5; border-top: 1px solid var(--panel-line); padding-top: 8px; }
  /* process-flow branches */
  #left { max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; }
  #stages li.fork { display: grid; gap: 3px; margin: 3px 0; padding: 6px 6px 6px 7px;
    border: 1px dashed rgba(255,255,255,.2); border-radius: 10px; }
  #stages .fork-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; padding: 0 2px 2px; }
  #stages .fk { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  #stages .seg { display: inline-flex; background: rgba(255,255,255,.07); border-radius: 999px; padding: 2px; gap: 2px; }
  #stages .seg button { width: auto; display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; color: var(--muted); }
  #stages .seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  #stages .opt { display: grid; gap: 2px; padding-left: 7px; border-left: 2px solid rgba(255,255,255,.14); }
  #stages .opt.on { border-left-color: var(--accent); }
  #stages .opt-label { font-size: 10.5px; color: var(--muted); padding: 1px 0 0 2px; }
  #stages .opt.off > button { opacity: .45; }
  #stages .opt.off .n { background: transparent; border: 1px dashed rgba(255,255,255,.3); }
  #stages .skip { font-size: 11.5px; line-height: 1.45; color: var(--muted); padding: 3px 8px 4px; }
  #stages .mk { font-size: 10.5px; color: var(--muted); margin-left: 5px; white-space: nowrap; }
  .tag.off { opacity: .35; }
  @media (max-width: 820px) {
    #left { max-height: none; overflow: visible; }
    #stages li.fork { display: flex; align-items: center; gap: 4px; padding: 3px 5px; margin: 0; }
    #stages .fork-head { padding: 0; }
    #stages .fk { display: none; }
    #stages .opt { display: flex; gap: 4px; border-left: 0; padding-left: 0; }
    #stages .opt.off, #stages .opt-label { display: none; }
    #stages .skip { white-space: nowrap; padding: 0 4px; font-size: 11px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); }
  @media (max-width: 820px) {
    #left { left: 8px; right: 8px; top: 8px; width: auto; padding: 10px; }
    #left .sub-h { display: none; }
    #stages { display: flex; overflow-x: auto; gap: 4px; }
    #stages li { flex: none; }
    #stages button { white-space: nowrap; padding: 5px 8px; }
    #info { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 40vh; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="loading">3D 설비 모형을 불러오는 중…</div>

<div id="left" class="panel">
  <h1>MLCC 배럴 면취 (모서리 라운딩)</h1>
  <p class="sub-h">배럴 탱크 충전부터 모서리 R 측정까지, 설비 3D 모형. 연마는 원심·회전·진동 배럴, 건조는 원심·열풍 중 한 경로를 고릅니다.</p>
  <ol id="stages"></ol>
  <div class="controls">
    <button id="play">❚❚ 일시정지</button>
    <select id="speed" aria-label="재생 속도">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <button id="overview">전체 보기</button>
    <label><input type="checkbox" id="tour" checked> 카메라 따라가기</label>
    <label><input type="checkbox" id="cut" checked> 단면 보기</label>
  </div>
</div>

<div id="info" class="panel"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------
   Stage data — sources:
   resources/manufacturing/eq-08-chamfering.md (equipment + step order, 2026-11-11),
   resources/manufacturing/60-termination-and-plating.md (§1 chamfering),
   wiki/concepts/barrel-chamfering-mlcc.md.
   (g) = general practice with no source. (snippet, 미확인) = seen only in a search snippet.
   STAGES indices never change (animation keys on them); new stages are appended, order is in FLOW.
------------------------------------------------------------------- */
const c = (...k) => k.map((x) => `<code>[${x}]</code>`).join('');
const G = '<span class="g">(g)</span>';
const SN = '<span class="g">(snippet, 미확인)</span>';
const STAGES = [
  { name: '드럼 장입', en: 'Drum charging',
    desc: `회전 배럴 경로입니다. 소성 칩과 연마 미디어를 호퍼에서 달아 슈트로 드럼에 넣고 물을 채웁니다 ${c('us10020117')}. 날카로운 모서리는 이후 취급 중 칩끼리 부딪히면 깨지거나 금이 갑니다 ${c('us10020117')}. 이 페이지는 소성 칩으로 그렸지만, 최근 특허 다수는 소성 전 그린 칩을 연마한 뒤 씻고 말려서 소성합니다 ${c('us11978592', 'us11037731')}.`,
    equip: [`배럴 용기 ${c('us10020117')}`, `칩 계량 호퍼·미디어 호퍼 (로드셀) ${G}`, `장입 슈트 ${G}`, `급수 탱크·펌프·배관 ${G}`],
    params: [`칩 + 연마 미디어 + 액체를 함께 장입 ${c('us10020117')}`, `미디어: 전융 알루미나 + 텅스텐 카바이드 50/50, 40 mesh ${c('us5712758')}`, `예시 칩: 소성 후 2.0 × 1.25 × 0.6 mm ${c('us5712758')}`, `사이드 마진을 붙인 그린 칩은 연마 중 계면 균열·박리 위험 ${c('us10020117')}`, `이 예에는 칩 : 미디어 : 액체 비율이 없음 (원심 배럴 예: 미디어/칩 질량비 0.1–6 ${c('jp2010283164a')})`] },
  { name: '회전 배럴 연마', en: 'Rotary barrel',
    desc: `배럴이 돌면 내용물이 올라가는 쪽 벽을 타고 오르다 표면을 따라 미끄러져 내립니다. 이때 칩과 미디어가 서로 비벼져 모서리와 능선이 둥글어집니다. 한 배치에 12 h 가까이 걸리는 것이 이 방식의 약점으로 꼽힙니다 ${c('us8932108')}.`,
    equip: [`회전 배럴: 칩과 미디어를 작은 상자에 밀봉해 돌림 ${c('us10957489', 'us10020117')}`, `다각형 드럼·A형 받침대·베어링 ${G}`, `구동 모터 + 감속기, 제어반 ${G}`],
    params: [`12 h × 78 rpm → 모서리 R 0.13 mm ${c('us5712758')}`, `6 h → R 0.08 mm ${c('us5712758')}`, `목표 R ≥ 0.10 mm, 선호 0.13–0.15 mm (2.0 × 1.25 × 0.6 mm 소성 칩) ${c('us5712758')}`, `기존 수평 배럴: 한 배치 최대 12 h ${c('us8932108')}`, '애니메이션 회전 속도는 실제 78 rpm보다 느리게 그림'] },
  { name: '진동 배럴 연마', en: 'Vibratory barrel',
    desc: `용기를 돌리는 대신 진동시키는 방식도 씁니다 ${c('us10020117', 'us11049660')}. 링 모양 보울 안에서 내용물이 나선을 그리며 돌고, 그동안 칩끼리, 칩과 미디어가 서로 갈립니다. 진동 장치의 세부 구조는 같은 업계의 다른 공정(단자 소부 뒤 표면 처리) 특허에서 가져왔습니다 ${c('us10957489')}. 이 경로의 장입은 회전 배럴과 같다고 보고 따로 그리지 않았습니다.`,
    equip: [`진동 배럴 ${c('us10020117')}`, `탄성체 위 진동판 + 편심 추 모터 ${c('us10957489')}`, `진동 센서(가속도 / 레이저 변위) → 모터 제어 ${c('us10957489')}`, `용기 안쪽 우레탄·고무 코팅 ${c('us10957489')}`, `링형 보울 모양 ${G}`],
    params: [`방식: 용기 회전 또는 진동 ${c('us10020117')}`, `참고 (면취가 아닌 표면 처리 예): 용기 고유 진동수에 공진, 23 Hz, 미디어 가속도 2.5–20 G, 5 h ${c('us10957489')}`, '면취용 진동 배럴의 진폭·주파수·시간은 문헌에 없음'] },
  { name: '배출 · 미디어 분리', en: 'Discharge & media separation',
    desc: `연마가 끝난 탱크(또는 드럼)를 열어 내용물을 진동 스크린에 붓습니다. 미디어 지름을 칩 끝면 대각선보다 작게 잡아 두면 그물 체로 칩과 미디어를 쉽게 가를 수 있습니다 ${c('us10957489')}. 미디어는 망을 빠져 회수통으로 떨어지고, 칩은 망 위를 타고 바스켓으로 갑니다. 위에서 물을 뿌려 찌꺼기를 씻어 냅니다 ${G}.`,
    equip: [`그물 체 (진동 스크린) ${c('us10957489')}`, `진동 모터 2대·스프링 지지 ${G}`, `미디어 회수통 ${G}`, `헹굼 스프레이 바 ${G}`, `틸팅 투입 장치 ${G}`, `샤워식 분리기·미디어 자동 회수 ${SN} ${c('tipton-periph-snippet')}`],
    params: [`미디어 지름 < 칩 끝면 대각선 ${c('us10957489')}`, `예: 미디어 0.4–1.0 mm, 칩 1.0 × 0.5 × 0.5 mm (표면 처리 예) ${c('us10957489')}`, `예: 미디어 40 mesh, 칩 2.0 × 1.25 × 0.6 mm ${c('us5712758')}`, '스크린 눈 크기·진동 조건은 문헌에 없음'] },
  { name: '세척', en: 'Wash',
    desc: `바스켓째 세척조에 담갔다 올리기를 되풀이해 남은 연마 찌꺼기와 액을 씻습니다. 특허는 "물 같은 세척액으로 씻고 말린다"고만 적습니다 ${c('us11978592')}.`,
    equip: [`세척조 + 다공 바스켓 ${G}`, `갠트리 호이스트 ${G}`, `오버플로 박스·급수 배관 ${G}`],
    params: [`세척액: 물 등 ${c('us11978592', 'jp2010283164a')}`, `그린 칩이 물에 닿으면 Ba²⁺가 녹아 나와 내전압·수명이 나빠질 수 있음 → Ba 포화 용액에서 연마한 출원 예 ${c('jp2010283164a')}`, `소성 칩도 물이 전극·세라믹 계면에 스미면 박리·IR 저하 ${c('us6367134')}`, '세척 온도·시간·초음파 여부는 문헌에 없음'] },
  { name: '모서리 R · 칩핑 측정', en: 'Corner R & chipping check',
    desc: `단면을 현미경으로 보고 모서리 모양을 잽니다. 한 특허는 칩 길이 방향 가운데를 자른 단면에서, 두 면의 접선이 만나는 점 S부터 곡면이 끝나는 점까지의 거리를 Ra(측면 쪽)와 Rb(주면 쪽)로 정하고 50개 평균을 냈습니다 ${c('us11037731')}. 칩핑(이 빠짐) 불량률도 함께 봅니다.`,
    equip: [`측정 현미경 + 모니터 ${G}`, `외관(칩핑) 확인 ${c('us11037731')}`],
    params: [`Rb/Ra > 3.0 → 칩핑 0 %, 비교예 Rb/Ra 1.9–2.7 → 칩핑 10–80 % (L 1.0 × W 0.5 mm, T 40–80 µm) ${c('us11037731')}`, `R ≥ 0.10 mm에서 열충격 불량 감소 ${c('us5712758')}`, `R 0.13 mm + 2층 단자: −55/125 °C 1000 사이클 후 불량 0 ${c('us5712758')}`, `면취 없음 또는 R 0.08 mm: 수백 사이클 안에 불량 ${c('us5712758')}`, '모니터 그림은 대칭 R(원)으로 단순화'] },
  { name: '배럴 탱크 충전', en: 'Barrel-tank charging',

function holeTexture(n, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, 128, 128); x.fillStyle = '#000';
  const s = 128 / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    x.beginPath(); x.arc(s * (i + 0.5) + (j % 2 ? s / 2 : 0), s * (j + 0.5), s * 0.3, 0, Math.PI * 2); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  return t;
}

// Builds a cutaway variant (front quadrant removed, inner face shaded) and a full variant.
function pair(parent, geoFn, cutStart, matOut, matIn, pos) {

  for (const m of [a, b, f]) { m.position.copy(pos); parent.add(m); }
  cutParts.push(a, b); fullParts.push(f);
}

  const gf = new THREE.TorusGeometry(R, tube, 8, 64); gf.rotateX(Math.PI / 2);
  const a = put(parent, mk(gc, mat), 0, y, 0), f = put(parent, mk(gf, mat), 0, y, 0);
  cutParts.push(a); fullParts.push(f);
}

// Merge a group's static direct-child meshes that share a material (and shadow flag) into one mesh
// each, to cut draw calls. Skips cutaway/full variants, instanced meshes, meshes with children and
// anything flagged userData.keep (animated transform / visibility).
function mergeStatic(group) {
  const buckets = new Map();
  for (const m of group.children) {
    if (!m.isMesh || m.isInstancedMesh || m.children.length || m.userData.keep || cutParts.includes(m) || fullParts.includes(m)) continue;
    const key = m.material.uuid + (m.castShadow ? '|s' : '');
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(m);
  }
  for (const list of buckets.values()) {
    if (list.length < 2) continue;
    const geos = list.map((m) => { m.updateMatrix(); const g = m.geometry.clone(); g.applyMatrix4(m.matrix); return g; });
    const merged = mergeGeometries(geos, false);
    geos.forEach((g) => g.dispose());
    if (!merged) continue;
    group.add(mk(merged, list[0].material, list[0].castShadow));
    for (const m of list) group.remove(m);
  }
  return group;
}

    f.position.set(Math.cos(a) * 0.215, 0.6, Math.sin(a) * 0.215); f.rotation.y = -a; g.add(f);

}

/* ------------------------------ process flow (branches) ------------------------------
   FLOW lists the steps in process order. A number is a STAGES index. An object
   { i, label, mark } overrides the list label, or marks the step 'repeat' / 'parallel'.
   A fork { fork, title, opts: [{ key, label, steps, note, onSelect }], def } is a point where the
   line splits into alternative routes. Only the chosen option's steps play; an option
   with no steps skips straight to the step after the fork.
   STAGES indices never change: the animation code keys on them. */
const ROUTE = {};
FLOW.forEach((e) => { if (e.fork) ROUTE[e.fork] = e.def || e.opts[0].key; });
const asStep = (x) => (typeof x === 'number' ? { i: x } : x);
let SEQ = [];
const forkStart = {};
function buildSeq() {
  SEQ = [];
  for (const e of FLOW) {
    if (!e.fork) { SEQ.push(asStep(e)); continue; }
    forkStart[e.fork] = SEQ.length;
    const o = e.opts.find((q) => q.key === ROUTE[e.fork]);
    o.steps.forEach((x) => SEQ.push({ ...asStep(x), fork: e, opt: o }));
  }
}
buildSeq();

const ol = document.getElementById('stages');
let seqBtns = [];
function stepButton(step, n, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  const mk = step.mark === 'repeat' ? '<span class="mk">↻ 반복</span>' : step.mark === 'parallel' ? '<span class="mk">∥ 병행</span>' : '';
  b.innerHTML = `<span class="n">${n}</span><span style="flex:1">${step.label || STAGES[step.i].name}${mk}<div class="bar"></div></span>`;
  b.addEventListener('click', onClick);
  return b;
}
function renderFlow() {
  ol.innerHTML = ''; seqBtns = [];
  let k = 0;
  for (const e of FLOW) {
    const li = document.createElement('li');
    if (!e.fork) {
      const kk = k++;
      const b = stepButton(asStep(e), kk + 1, () => jumpK(kk));
      seqBtns[kk] = b; li.appendChild(b); ol.appendChild(li); continue;
    }
    li.className = 'fork';
    const head = document.createElement('div'); head.className = 'fork-head';
    head.innerHTML = `<span class="fk">⑂ ${e.title}</span>`;
    const seg = document.createElement('div'); seg.className = 'seg';
    seg.setAttribute('role', 'radiogroup'); seg.setAttribute('aria-label', e.title);
    for (const o of e.opts) {
      const sb = document.createElement('button');
      sb.type = 'button'; sb.textContent = o.label; sb.setAttribute('role', 'radio');
      sb.setAttribute('aria-checked', String(ROUTE[e.fork] === o.key));
      sb.addEventListener('click', () => { if (ROUTE[e.fork] !== o.key) setRoute(e.fork, o.key); });
      seg.appendChild(sb);
    }
    head.appendChild(seg); li.appendChild(head);
    for (const o of e.opts) {
      const on = ROUTE[e.fork] === o.key;
      const box = document.createElement('div'); box.className = `opt ${on ? 'on' : 'off'}`;
      const lab = document.createElement('div'); lab.className = 'opt-label'; lab.textContent = o.label; box.appendChild(lab);
      if (!o.steps.length) {
        const sk = document.createElement('div'); sk.className = 'skip';
        sk.textContent = o.note || '이 경로에서는 해당 단계를 거치지 않습니다.'; box.appendChild(sk);
      }
      for (const x of o.steps) {
        const st = asStep(x);
        if (on) { const kk = k++; const b = stepButton(st, kk + 1, () => jumpK(kk)); seqBtns[kk] = b; box.appendChild(b); }
        else box.appendChild(stepButton(st, '·', () => setRoute(e.fork, o.key, st.i)));
      }
      li.appendChild(box);
    }
    ol.appendChild(li);
  }
  // 3D stage tags: number by the active route, fade stations the route skips.
  const num = new Map();
  SEQ.forEach((q, n) => { if (!num.has(q.i)) num.set(q.i, n + 1); });
  stageTags.forEach((el, i) => {
    el.classList.toggle('off', !num.has(i));
    const b = el.querySelector('b'); if (b) b.textContent = num.has(i) ? num.get(i) : '·';
  });
}
let curK = 0, lastK = -1;
function jumpK(k) {
  curK = ((k % SEQ.length) + SEQ.length) % SEQ.length;
  simT = curK * STAGE_DUR + 0.01; lastK = -1;
}
function setRoute(fid, key, focus = null) {
  ROUTE[fid] = key; buildSeq(); renderFlow();
  const opt = FLOW.find((e) => e.fork === fid).opts.find((q) => q.key === key);
  if (opt.onSelect) opt.onSelect();     // e.g. swap equipment shown for this route
  let k = focus === null ? -1 : SEQ.findIndex((q) => q.i === focus);
  if (k < 0) k = forkStart[fid];          // first step of the chosen option, or the step after the fork
  jumpK(k);
}
// Jump by STAGES index (3D tag clicks). A station off the active route switches to its route.
function jumpTo(i) {
  const k = SEQ.findIndex((q) => q.i === i);
  if (k >= 0) { jumpK(k); return; }
  for (const e of FLOW) if (e.fork) for (const o of e.opts) {
    if (o.steps.some((x) => asStep(x).i === i)) { setRoute(e.fork, o.key, i); return; }
  }
}

  8: '낮은 G로 모서리를 먼저 살짝 다듬음 (진행 정도는 모식)', 9: '높은 G에서 미디어가 모서리·능선을 갈아 둥글게 만듦',
  3: '미디어 분리 · 모서리 R 유지', 4: '세척 · 표면에 물이 묻음', 10: '원심 건조 · 표면 물기 제거', 11: '열풍 건조 · 표면 물기 제거',
  12: '단면을 갈아 모서리 윤곽을 드러냄', 5: '모서리에 원을 맞춰 R 확인',
};
const mParts = Array.from({ length: 16 }, (_, i) => ({ th: rnd(), gap: 10 + rnd() * 90, sz: 8 + rnd() * 6, wc: i % 2 === 1, sp: 0.6 + rnd() * 0.8 }));
const dropsM = Array.from({ length: 6 }, () => ({ x: 40 + rnd() * 240, s: 6 + rnd() * 6 }));
function drawMicro(s, p, t) {
  const cv = document.getElementById('micro'); if (!cv) return;
  const x = cv.getContext('2d'), W = cv.width, H = cv.height;
  x.clearRect(0, 0, W, H);
  const pre = PRE_S.includes(s), pol = POL_S[s], withMedia = pre || !!pol;
  x.fillStyle = withMedia ? '#1f2c36' : '#24282c'; x.fillRect(0, 0, W, H);
  const X0 = 380, Y0 = 80, RMAX = 105;
  const r = pre ? 0 : pol ? RMAX * (pol[0] + (pol[1] - pol[0]) * sm(p)) : RMAX;
  // removed material (original sharp corner)
  if (r > 1) {
    x.fillStyle = 'rgba(255,143,107,.22)';
    x.beginPath(); x.moveTo(X0 - r, Y0); x.lineTo(X0, Y0); x.lineTo(X0, Y0 + r); x.arc(X0 - r, Y0 + r, r, 0, -Math.PI / 2, true); x.closePath(); x.fill();
    x.setLineDash([6, 6]); x.strokeStyle = 'rgba(255,143,107,.85)'; x.lineWidth = 2;
    x.beginPath(); x.moveTo(X0 - r - 30, Y0); x.lineTo(X0, Y0); x.lineTo(X0, Y0 + r + 30); x.stroke(); x.setLineDash([]);
  }
  // chip body with faint layer lines
  x.save(); x.beginPath(); x.moveTo(0, Y0); x.lineTo(X0 - r, Y0);
  if (r > 0.5) x.arcTo(X0, Y0, X0, Y0 + r, r);
  x.lineTo(X0, H); x.lineTo(0, H); x.closePath();
  x.fillStyle = '#b59f78'; x.fill(); x.clip();
  x.strokeStyle = 'rgba(80,70,55,.35)'; x.lineWidth = 2;
  for (let yy = Y0 + 34; yy < H; yy += 16) { x.beginPath(); x.moveTo(0, yy); x.lineTo(X0 - 40, yy); x.stroke(); }
  x.restore();
  // media hitting the corner
  if (withMedia) {
    const mv = pre ? 0.05 : s === 8 ? 0.5 : 1;
    for (const q of mParts) {
      const th = -Math.PI / 2 - 0.45 + ((q.th + t * 0.12 * q.sp * mv) % 1) * (Math.PI / 2 + 0.9);
      const gap = q.gap * (0.6 + 0.4 * Math.abs(Math.sin(t * 2 * q.sp * mv + q.th * 9)));
      const cx = X0 - r + Math.cos(th) * (r + gap + q.sz), cy = Y0 + r + Math.sin(th) * (r + gap + q.sz);
      x.fillStyle = q.wc ? '#6a7077' : '#efece4'; x.beginPath(); x.arc(cx, cy, q.sz, 0, FULL); x.fill();
      if (gap < 18 && mv > 0.5) { x.strokeStyle = 'rgba(255,181,71,.8)'; x.lineWidth = 2; x.beginPath(); x.arc(X0 - r + Math.cos(th) * r, Y0 + r + Math.sin(th) * r, 6, 0, FULL); x.stroke(); }
    }
  }
  if (s === 4 || s === 10 || s === 11) {
    const wet = s === 4 ? sm(p / 0.4) : 1 - sm(p);
    for (const d of dropsM) { const rr = d.s * wet; if (rr > 0.5) { x.fillStyle = 'rgba(160,210,240,.7)'; x.beginPath(); x.arc(d.x, Y0 - rr * 0.6, rr, Math.PI, 0); x.fill(); } }
  }
  if (s === 5) {
    x.setLineDash([5, 5]); x.strokeStyle = '#8fd0ff'; x.lineWidth = 2;
    x.beginPath(); x.arc(X0 - r, Y0 + r, r, 0, FULL); x.stroke(); x.setLineDash([]);
    x.beginPath(); x.moveTo(X0 - r, Y0 + r); x.lineTo(X0 - r + r * 0.707, Y0 + r - r * 0.707); x.stroke();
    x.fillStyle = '#8fd0ff'; x.font = 'bold 22px system-ui'; x.fillText('R', X0 - r + r * 0.25, Y0 + r - r * 0.45);
  }
  x.fillStyle = '#e9eef3'; x.font = '17px system-ui';
  x.fillText('칩 본체 (단면)', 16, H - 16);
  if (r > 1) { x.fillStyle = '#ffb59c'; x.fillText('깎여 나간 모서리', X0 + 12, Y0 - 12); }
  if (withMedia) { x.fillStyle = '#9db0c2'; x.fillText(pre ? '미디어 + 액체' : '미디어 충돌·마찰', X0 + 40, Y0 + 150); }
  const msg = MICRO_MSG[s];
  const cap = document.getElementById('microCap'); if (cap) cap.textContent = `${msg} · 모식도, 축척 없음`;
}
function drawChart(s, p) {
  const cv = document.getElementById('rchart'); if (!cv) return;
  const x = cv.getContext('2d'), W = cv.width, H = cv.height;
  x.clearRect(0, 0, W, H);
  const L = 74, R = W - 20, T = 16, B = H - 42;
  const X = (h) => L + h / 14 * (R - L), Y = (mm) => B - mm / 0.16 * (B - T);
  // preferred band + threshold
  x.fillStyle = 'rgba(255,181,71,.12)'; x.fillRect(L, Y(0.15), R - L, Y(0.13) - Y(0.15));
  x.fillStyle = '#c99a52'; x.font = '15px system-ui'; x.textAlign = 'left'; x.fillText('선호 0.13–0.15', L + 6, Y(0.15) + 16);
  x.setLineDash([8, 6]); x.strokeStyle = '#ff8f6b'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(L, Y(0.10)); x.lineTo(R, Y(0.10)); x.stroke(); x.setLineDash([]);
  x.fillStyle = '#ff8f6b'; x.fillText('기준 R ≥ 0.10 mm', L + 6, Y(0.10) - 6);
  // axes
  x.strokeStyle = 'rgba(255,255,255,.3)'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(L, T); x.lineTo(L, B); x.lineTo(R, B); x.stroke();
  x.fillStyle = '#9db0c2'; x.font = '16px system-ui'; x.textAlign = 'center';
  for (const h of [0, 3, 6, 9, 12]) { x.fillRect(X(h), B, 1, 6); x.fillText(String(h), X(h), B + 22); }
  x.textAlign = 'right'; x.fillText('연마 시간 (h)', R, B + 38);
  x.textAlign = 'right';
  for (const v of [0, 0.05, 0.10, 0.15]) { x.fillRect(L - 6, Y(v), 6, 1); x.fillText(v.toFixed(2), L - 10, Y(v) + 5); }
  x.save(); x.translate(18, (T + B) / 2); x.rotate(-Math.PI / 2); x.textAlign = 'center'; x.fillText('R (mm)', 0, 0); x.restore();
  // time cursor during rotary stage
  const hrs = s === 1 ? p * 12 : null;
  if (hrs !== null) {
    x.strokeStyle = 'rgba(143,208,255,.6)'; x.lineWidth = 2; x.beginPath(); x.moveTo(X(hrs), T); x.lineTo(X(hrs), B); x.stroke();
    x.fillStyle = '#8fd0ff'; x.textAlign = 'left'; x.font = '13px system-ui'; x.fillText('애니메이션 경과', Math.min(X(hrs) + 4, R - 100), T + 12);
  }
  // the two data points
  const pts = [[6, 0.08, '6 h → 0.08', '#ff8f6b'], [12, 0.13, '12 h, 78 rpm → 0.13', '#ffb547']];
  x.textAlign = 'left'; x.font = 'bold 15px system-ui';
  for (const [h, v, t, col] of pts) {
    const lit = hrs === null || hrs >= h - 0.05;
    x.globalAlpha = lit ? 1 : 0.3;
    x.fillStyle = col; x.beginPath(); x.arc(X(h), Y(v), 8, 0, FULL); x.fill();
    x.fillText(t, h === 12 ? X(h) - 160 : X(h) + 12, h === 12 ? Y(v) - 14 : Y(v) + 6);
  }
  x.globalAlpha = 1;
  x.fillStyle = '#9db0c2'; x.font = '13px system-ui'; x.textAlign = 'right'; x.fillText('데이터 2점 · 곡선 미상', R, B - 8);
  x.textAlign = 'left';
}

/* ------------------------------ loop ------------------------------ */
const clock = new THREE.Clock();
const dmy = new THREE.Object3D();
function levelAt(o, s, p) {
  const { fill, drain, lo, hi } = o;
  if (s === fill) return lo + (hi - lo) * sm(Math.min(1, p / 0.6));
  if (s === drain) return hi - (hi - lo) * sm(Math.min(1, p / 0.7));
  const hold = fill < drain ? (s > fill && s < drain) : (s > fill || s < drain);
  return hold ? hi : lo;
}
let infoTick = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (playing) simT += dt * speed;
  const total = simT / STAGE_DUR;
  const k = Math.floor(total) % SEQ.length, p = total - Math.floor(total), t = simT;
  const s = SEQ[k].i;
  if (k !== lastK) {
    lastK = curK = k; lastStage = s;
    seqBtns.forEach((b, n) => b.classList.toggle('active', n === k));
    { // keep the active step visible in the list (horizontal on phones, scrolling panel on short screens)
      const btn = seqBtns[k], list = document.getElementById('stages'), panel = document.getElementById('left');
      if (btn) {
        const br = btn.getBoundingClientRect();
        if (list.scrollWidth > list.clientWidth + 2) { const lr = list.getBoundingClientRect(); list.scrollTo({ left: list.scrollLeft + br.left - lr.left - (list.clientWidth - br.width) / 2, behavior: 'smooth' }); }
        if (panel.scrollHeight > panel.clientHeight + 2) { const pr = panel.getBoundingClientRect(); if (br.top < pr.top || br.bottom > pr.bottom) panel.scrollTo({ top: panel.scrollTop + br.top - pr.top - (panel.clientHeight - br.height) / 2, behavior: 'smooth' }); }
      }
    }
    stageTags.forEach((el, i) => el.classList.toggle('active', i === s));
    SUBS.forEach((q) => q.el.classList.toggle('show', q.s === s));
    renderInfo(k);
    if (autoTour) flyTo(s);
  }
  seqBtns.forEach((b, n) => { b.querySelector('.bar').style.width = n === k ? `${p * 100}%` : '0'; });

  for (const r of rotors) {
    const target = r.run.includes(s) ? r.w : 0;
    r.cur += (target - r.cur) * Math.min(1, dt * 1.5);
    r.obj.rotation[r.axis] += r.cur * dt;
  }
  for (const o of levels) {
    const l = o.route && ROUTE.polish !== o.route ? o.hi : levelAt(o, s, p);
    o.T.L.scale.y = Math.max(0.001, l * o.T.h);
    o.T.L.visible = l > 0.01; o.T.headLiq.visible = l > 0.005;
  }
  for (const P of pipes) {
    const on = P.stages.includes(s) && (!P.when || P.when(p));
    P.inst.visible = on;
    if (!on) continue;
    const ns = P.samples.length - 1;
    for (let i = 0; i < P.n; i++) {
      let u = (i / P.n + (t * P.speed) / P.len) % 1;
      if (P.reverse) u = 1 - u;
      const f = u * ns, k = Math.floor(f), a = P.samples[k], b = P.samples[Math.min(ns, k + 1)];
      dmy.position.lerpVectors(a, b, f - k); dmy.updateMatrix(); P.inst.setMatrixAt(i, dmy.matrix);
    }
    P.inst.instanceMatrix.needsUpdate = true;
  }
  for (const u of updaters) u(dt, s, p, t);

  if (tween) {
    tween.k = Math.min(1, tween.k + dt / 2.2);
    const e = sm(tween.k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.k >= 1) tween = null;
  }
  infoTick += dt;
  if (infoTick > 1 / 30) { infoTick = 0; drawMicro(s, p, t); drawChart(s, p); }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
document.getElementById('loading').remove();
frame();
</script>
