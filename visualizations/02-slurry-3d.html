<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLCC 슬러리 공정 3D</title>
<style>
  :root {
    --panel: rgba(15, 20, 27, 0.80);
    --panel-line: rgba(255, 255, 255, 0.12);
    --text: #e9eef3;
    --muted: #9db0c2;
    --accent: #ffb547;
    --accent-ink: #1d1406;
    --g: #8fd0ff;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2229; color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .tag { pointer-events: auto; cursor: pointer; transform: translateY(-6px);
    background: rgba(14, 18, 24, 0.84); color: var(--text); border: 1px solid rgba(255,255,255,.2);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; white-space: nowrap; transition: background .25s, color .25s; }
  .tag b { color: var(--accent); margin-right: 4px; }
  .tag.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tag.active b { color: var(--accent-ink); }
  .sub { pointer-events: none; font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: rgba(255,255,255,.88); color: #1d242c; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .sub.show { opacity: 1; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #left { top: 16px; left: 16px; width: 268px; padding: 14px 14px 12px; }
  #left h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: -.01em; }
  #left .sub-h { font-size: 11.5px; color: var(--muted); margin: 0 0 10px; }
  #stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  #stages button { width: 100%; text-align: left; background: transparent; color: var(--text); border: 0;
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #stages button:hover { background: rgba(255,255,255,.07); }
  #stages button.active { background: rgba(255,181,71,.16); color: #fff; }
  #stages .n { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px;
    background: rgba(255,255,255,.1); flex: none; }
  #stages button.active .n { background: var(--accent); color: var(--accent-ink); }
  #stages .bar { height: 2px; background: var(--accent); width: 0; border-radius: 2px; margin-top: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .controls button, .controls select { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line);
    border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #info { right: 16px; bottom: 16px; width: 390px; max-height: calc(100vh - 32px); overflow: auto; padding: 16px; box-sizing: border-box; }
  #info .head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
  #info .fold { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line); border-radius: 8px; padding: 3px 8px; font: inherit; font-size: 11.5px; cursor: pointer; flex: none; }
  #info.collapsed .body { display: none; }
  #info.collapsed h2 { margin-bottom: 0; }
  #info .kicker { font-size: 11px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
  #info h2 { font-size: 18px; margin: 2px 0 6px; }
  #info p { font-size: 13px; line-height: 1.55; color: #d5dde5; margin: 0 0 10px; }
  #info h3 { font-size: 11.5px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; letter-spacing: .03em; }
  #info ul { margin: 0; padding-left: 16px; font-size: 12.5px; line-height: 1.55; }
  #info li { margin-bottom: 2px; }
  #info code { font-size: 11px; color: var(--g); }
  .g { color: #ffcf8a; font-size: 11px; }
  .canvas-wrap { margin-top: 8px; background: rgba(0,0,0,.25); border-radius: 8px; padding: 6px; }
  .canvas-wrap canvas { width: 100%; display: block; }
  .cap { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .foot { font-size: 10.5px; color: var(--muted); margin-top: 12px; line-height: 1.5; border-top: 1px solid var(--panel-line); padding-top: 8px; }
  /* process-flow branches */
  #left { max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; }
  #stages li.fork { display: grid; gap: 3px; margin: 3px 0; padding: 6px 6px 6px 7px;
    border: 1px dashed rgba(255,255,255,.2); border-radius: 10px; }
  #stages .fork-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; padding: 0 2px 2px; }
  #stages .fk { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  #stages .seg { display: inline-flex; background: rgba(255,255,255,.07); border-radius: 999px; padding: 2px; gap: 2px; }
  #stages .seg button { width: auto; display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; color: var(--muted); }
  #stages .seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  #stages .opt { display: grid; gap: 2px; padding-left: 7px; border-left: 2px solid rgba(255,255,255,.14); }
  #stages .opt.on { border-left-color: var(--accent); }
  #stages .opt-label { font-size: 10.5px; color: var(--muted); padding: 1px 0 0 2px; }
  #stages .opt.off > button { opacity: .45; }
  #stages .opt.off .n { background: transparent; border: 1px dashed rgba(255,255,255,.3); }
  #stages .skip { font-size: 11.5px; line-height: 1.45; color: var(--muted); padding: 3px 8px 4px; }
  #stages .mk { font-size: 10.5px; color: var(--muted); margin-left: 5px; white-space: nowrap; }
  .tag.off { opacity: .35; }
  @media (max-width: 820px) {
    #left { max-height: none; overflow: visible; }
    #stages li.fork { display: flex; align-items: center; gap: 4px; padding: 3px 5px; margin: 0; }
    #stages .fork-head { padding: 0; }
    #stages .fk { display: none; }
    #stages .opt { display: flex; gap: 4px; border-left: 0; padding-left: 0; }
    #stages .opt.off, #stages .opt-label { display: none; }
    #stages .skip { white-space: nowrap; padding: 0 4px; font-size: 11px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); }
  @media (max-width: 820px) {
    #left { left: 8px; right: 8px; top: 8px; width: auto; padding: 10px; }
    #left .sub-h { display: none; }
    #stages { display: flex; overflow-x: auto; gap: 4px; }
    #stages li { flex: none; }
    #stages button { white-space: nowrap; padding: 5px 8px; }
    #info { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 40vh; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="loading">3D 설비 모형을 불러오는 중…</div>

<div id="left" class="panel">
  <h1>MLCC 유전체 슬러리 공정</h1>
  <p class="sub-h">분말 계량부터 바인더 액 준비, 분산, 여과·탈포, QC, 테이프 캐스터 공급까지 설비 3D 모형. 갈림길에서 경로를 고르면 그 경로만 재생합니다.</p>
  <ol id="stages"></ol>
  <div class="controls">
    <button id="play">❚❚ 일시정지</button>
    <select id="speed" aria-label="재생 속도">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <button id="overview">전체 보기</button>
    <label><input type="checkbox" id="tour" checked> 카메라 따라가기</label>
    <label><input type="checkbox" id="cut" checked> 단면 보기</label>
  </div>
</div>

<div id="info" class="panel"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------
   Stage data — source keys point to the wiki raw notes
   resources/manufacturing/10-powder-and-slurry.md and
   resources/manufacturing/eq-02-slurry.md (equipment + step order).
   (g) = general industry practice, not backed by a corpus source.
   STAGES indices never change (the animation keys on them); the order
   of the line lives in FLOW.
------------------------------------------------------------------- */
const G = '<span class="g">(g)</span>';
const K = (...keys) => keys.map((k) => `<code>[${k}]</code>`).join(' ');
const STAGES = [
  { name: '원료 계량·투입', en: 'Weighing & charging', cam: { t: [-31.6, 1.8, 0], far: true },
    desc: 'BaTiO₃ 분말은 빅백 아래 계량 호퍼에서 무게를 잰 뒤 스크루 피더로 프리믹스 탱크에 넣습니다. 용제와 분산제도 펌프로 같은 탱크에 넣습니다. 문헌의 일반 공정은 분말·첨가제·용제·분산제를 계량해 섞은 뒤 1차 밀링으로 넘어갑니다.',
    equip: [`빅백 배출기 + 계량 호퍼(로드셀) ${G}`, `경사 스크루 피더 ${G}`, `용제 IBC + 공기 구동 다이어프램 펌프 ${G}`, `분산제 드럼 + 도징 펌프 ${G}`],
    params: [`계량 → 혼합 → 1차 밀링 순서 (종래 공정 설명) ${K('sem-us7229035')}`, `분말 : 용제 ≈ 1 : 2 (질량) ${K('yang-2026-pvb')}`,
      `분산제 2.0 wt% (분말 대비) ${K('yang-2026-pvb')} · 0.5–1.5 parts/100 powder ${K('tdk-us7632369')}`,
      `용제: 톨루엔/에탄올 1:1 ${K('sem-us7229035')}, 에탄올/에틸아세테이트 ${K('yang-2026-pvb')}`,
      `부성분(첨가물)을 따로 볼밀 20 h 예비 분쇄해 넣는 예 ${K('tdk-us7744711')}`] },
  { name: '프리믹스', en: 'Premix', cam: { t: [-25, 1.9, 0] },
    desc: '교반기로 분말을 용제에 적시고 분산제를 입자 표면에 붙입니다. 분산의 세 과정(젖음 → 해쇄 → 안정화) 중 첫 단계입니다. 비드밀 라인에서는 이 탱크가 비드밀 공급 탱크를 겸합니다.',
    equip: [`교반 탱크 + 감속기·모터 ${K('sem-us7229035')}`, `디졸버(톱니 원판) 임펠러 ${G}`,
      `대안: 인라인 콘밀(로터-스테이터)로 프리믹싱 — 모형에는 없음 ${K('shibuya-mko-ipros', 'ika-mko-ipros')}`],
    params: [`300 rpm × 1 h 교반 (분말 + EtOH) ${K('sem-us7229035')}`, `분산 3요소: 젖음 → 해쇄 → 분산 안정화 ${K('nakamura-2011-funsai')}`,
      `프리믹싱이 부족하면 비드밀 부하·처리 시간 증가 ${K('shibuya-mko-ipros')}`, `콘밀: 갭 무단 조정, 최대 50,000 mPa·s, 최대 16 bar ${K('ika-mko-ipros')}`] },
  { name: '바스켓밀 혼합', en: 'Basket-mill mixing', cam: { t: [-8.0, 1.6, 0] },
    desc: '밀 헤드가 승강 컬럼을 따라 내려와 용기에 잠깁니다. 타공 바스켓 안의 미디어가 돌며 분말·바인더·첨가물을 고르게 섞습니다. 오래 돌리면 1차 입자가 깨지므로 섞일 만큼만 돌리고, 끝나면 헤드가 올라갑니다.',
    equip: [`바스켓 밀 (타공 바스켓 + 미디어) ${K('sem-us7229035')}`, `승강 컬럼·이동식 용기 ${G}`],
    params: [`750 rpm × 3 h (실시예) ${K('sem-us7229035')}`, `3–5 h: 3 h 미만은 혼합 불균일, 5 h 초과는 입자 분쇄 ${K('sem-us7229035')}`,
      `종래 바스켓·비드밀 미디어 0.6–1 mm ZrO₂ ${K('sem-us7229035')}`,
      '이전 버전은 이 단계를 비드밀 앞(1차 분산)에 두었으나, 특허 예는 비드밀 해쇄 → 바인더 투입 → 바스켓밀 순서라 뒤로 옮김'] },
  { name: '비드밀 해쇄', en: 'Bead mill (pass mode)', cam: { t: [-18.4, 1.5, 0.4], far: true },
    desc: '프리믹스 탱크의 슬러리를 다이어프램 펌프로 비드밀에 보냅니다. 로터가 0.2–0.3 mm ZrO₂ 비드를 휘저어 응집체의 목(neck)을 끊습니다. 출구의 좁은 갭이 비드는 붙잡고 슬러리만 내보냅니다. 문헌 예는 패스 운전으로, 수액 탱크에 받았다가 다시 통과시켜 3회 반복합니다. 분쇄실은 냉각수 자켓으로 식힙니다.',
    equip: [`비드밀: 분쇄실 + 로터, 접액부 ZrO₂/YSZ ${K('sem-us7229035')}`, `갭 세퍼레이터 (비드 잔류) ${K('sem-us7229035')}`,
      `냉각수·에어 공급 후 운전 ${K('sem-us7229035')} · 냉각 자켓 형상 ${G}`, `다이어프램 펌프로 공급 ${K('sem-us7229035')}`, `수액 탱크 ${G}`,
      `운전 방식: 패스 vs 순환 (순환이 난분산 원료에 유리) ${K('vma-dispermat-sl')}`, `대안 분리 방식: 원심 세퍼레이터(≥ 0.03 mm 비드) ${K('ashizawa-smax-ipros')}`],
    params: [`비드 0.2–0.3 mm ZrO₂ (< 0.2 mm는 빠져나가고, > 0.3 mm는 1차 입자를 깸) ${K('sem-us7229035')}`,
      `최적: 고형분 30 wt%, 주속 10 m/s, 800 ml/min, 3 패스 ${K('sem-us7229035')}`, `D90 1.01 → 0.447 µm (D50 0.233 µm) ${K('sem-us7229035')}`,
      `0.15–0.4 µm 분말은 비드밀이 일반적, ≤ 50 µm 비드도 사용 ${K('johokiko-mlcc-2019')}`,
      `비드는 일정 시간 넘게 쓰면 오염이 급증 → 비드 관리 필요 ${K('johokiko-mlcc-2019')}`] },
  { name: '바인더 투입', en: 'Binder let-down', cam: { t: [-10.4, 1.5, -0.6], far: true },
    desc: '비드밀을 거친 슬러리를 바스켓밀 용기로 옮기고, 여과한 바인더 액·가소제·나머지 첨가물을 넣습니다. 바인더는 그린시트의 강도·유연성과 적층 때 접착을 맡습니다.',
    equip: [`이송 펌프 ${G}`, `바스켓밀 이동식 용기 (전 성분을 넣고 혼합) ${K('sem-us7229035')}`, `바인더 액 필터 ${K('murata-us6511564', 'tdk-us7632369')}`],
    params: [`바인더 8–14 % (분말 무게 대비, 일반) ${K('nakamura-2011-funsai')}`,
      `PVB 12 wt% ${K('yang-2026-pvb')} · 6 parts/100 powder ${K('tdk-us7632369')} · 11.5 wt% ${K('sem-us7229035')}`,
      `가소제 DOP 50 parts/100 binder ${K('tdk-us7632369')} · 3.165 wt% ${K('sem-us7229035')}`,
      `바인더는 약 400 °C 이하에서 완전히 분해돼야 함 ${K('nakamura-2011-funsai')}`] },
  { name: '고압 분산', en: 'High-pressure disperser', cam: { t: [-1.4, 1.5, -0.2] },
    desc: '증압 실린더가 슬러리를 고압으로 미세 유로(인터랙션 챔버)에 밀어 넣습니다. 좁아진 관에서 빨라진 슬러리가 꺾인 벽에 부딪히며 충격·전단·캐비테이션을 차례로 받고, 남은 응집이 풀립니다. 압력이 높을수록 슬러리가 뜨거워지므로 출구 열교환기로 식힙니다. 여러 번 통과시킵니다. 박층 라인의 선택 단계입니다.',
    equip: [`입구 리저버 ${K('mfx-m110eh-web')}`, `증압 실린더(인텐시파이어) + 유압 유닛 ${K('mfx-m110eh-web')}`,
      `인터랙션 챔버: 축소관 → 꺾임 → 벽 충돌 ${K('sem-us7229035')} · 벽 충돌 또는 테이퍼 유로 ${K('murata-us6579394')}`,
      `출구 열교환기 ${K('mfx-m110eh-web')}`, `대안: 원료끼리 비스듬히 충돌시키는 방식 ${K('sugino-sb-ipros')}`],
    params: [`10,000–25,000 psi (≈ 69–172 MPa), 3–7 패스 ${K('sem-us7229035')}`,
      `1300 kg/cm² (≈ 127 MPa 환산), 5 패스, 300 cc/min ${K('murata-us6511564')} · 20 패스 ${K('murata-us6579394')}`,
      `처리 후 슬러리 온도 42 °C (100 MPa), 63 °C (160 MPa) ${K('tdk-us7744711')}`,
      `바인더의 < 10 wt%만 넣고 고압 분산한 뒤 나머지를 넣는 순서도 있음 ${K('tdk-us7744711')}`,
      `충돌형 100–245 MPa ${K('sugino-sb-ipros')}`] },
  { name: '여과', en: 'Cartridge filtration', cam: { t: [3.8, 1.2, 0] },

function holeTexture(n, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, 128, 128); x.fillStyle = '#000';
  const s = 128 / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    x.beginPath(); x.arc(s * (i + 0.5) + (j % 2 ? s / 2 : 0), s * (j + 0.5), s * 0.3, 0, Math.PI * 2); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  return t;
}
const perfMat = (rx, ry) => std({ color: 0xcfd4d8, metalness: 0.9, roughness: 0.35, alphaMap: holeTexture(8, rx, ry), alphaTest: 0.5, side: THREE.DoubleSide });

function hmiCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;

  return { c, x: c.getContext('2d'), tex, f: -1, mat: std({ map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.9 }) };
}

function mk(geo, mat, cast = true) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; return m; }
function put(parent, m, x = 0, y = 0, z = 0) { m.position.set(x, y, z); parent.add(m); return m; }
const cyl = (r1, r2, h, seg = 32, open = false, ts = 0, tl = FULL) => new THREE.CylinderGeometry(r1, r2, h, seg, 1, open, ts, tl);

// Builds a cutaway variant (front quadrant removed, inner face shaded) and a full variant.
function pair(parent, geoFn, cutStart, matOut, matIn, pos) {
  const gc = geoFn(cutStart, CUT_TL);
  const a = mk(gc, matOut), b = mk(gc, matIn, false), f = mk(geoFn(0, FULL), matOut);
  for (const m of [a, b, f]) { m.position.copy(pos); parent.add(m); }
  cutParts.push(a, b); fullParts.push(f);
}
function rim(parent, R, tube, y, mat) {
  const gc = new THREE.TorusGeometry(R, tube, 8, 64, CUT_TL); gc.rotateX(Math.PI / 2); gc.rotateY(5 * Math.PI / 4);
  const gf = new THREE.TorusGeometry(R, tube, 8, 64); gf.rotateX(Math.PI / 2);
  const a = put(parent, mk(gc, mat), 0, y, 0), f = put(parent, mk(gf, mat), 0, y, 0);
  cutParts.push(a); fullParts.push(f);
}

function vMotor(scale = 1) {
  const g = new THREE.Group();
  put(g, mk(box(0.5, 0.32, 0.5), M.motorG), 0, 0.16, 0);                 // gearbox
  put(g, mk(cyl(0.2, 0.2, 0.55, 28), M.motor), 0, 0.6, 0);               // motor body
  for (let k = 0; k < 18; k++) {                                          // cooling fins
    const a = k / 18 * FULL, f = mk(box(0.02, 0.5, 0.05), M.motor);
    f.position.set(Math.cos(a) * 0.215, 0.6, Math.sin(a) * 0.215); f.rotation.y = -a; g.add(f);
  }
  put(g, mk(cyl(0.21, 0.21, 0.16, 28), M.motorG), 0, 0.96, 0);           // fan cowl
  put(g, mk(cyl(0.06, 0.06, 0.03, 16), M.dark), 0, 1.05, 0);
  put(g, mk(box(0.16, 0.14, 0.14), M.motor), 0.26, 0.64, 0);             // terminal box
  g.scale.setScalar(scale);
  return g;
}
function hMotor(len = 0.42, r = 0.15) {
  const g = new THREE.Group();
  put(g, mk(along(cyl(r, r, len, 24), 'x'), M.motor), 0, 0, 0);
  for (let k = 0; k < 14; k++) {
    const a = k / 14 * FULL, f = mk(box(len * 0.9, 0.02, 0.045), M.motor);
    f.position.set(0, Math.cos(a) * (r + 0.012), Math.sin(a) * (r + 0.012)); f.rotation.x = a; g.add(f);
  }
  put(g, mk(along(cyl(r + 0.01, r + 0.01, 0.12, 24), 'x'), M.motorG), len / 2 + 0.06, 0, 0);
  put(g, mk(box(0.12, 0.12, 0.12), M.motor), 0, r + 0.06, 0);
  put(g, mk(box(len * 0.7, 0.05, r * 1.6), M.dark), 0, -r - 0.02, 0);
  return g;
}

function impeller(type, d) {
  const g = new THREE.Group();
  if (type === 'cowles') {
    put(g, mk(cyl(d, d, 0.025, 48), M.steel), 0, 0, 0);
    for (let k = 0; k < 24; k++) {
      const a = k / 24 * FULL, t = mk(box(0.05, 0.045, 0.022), M.steel);
      t.position.set(Math.cos(a) * d, (k % 2 ? 0.025 : -0.025), Math.sin(a) * d);
      t.rotation.set(0, -a, k % 2 ? 0.5 : -0.5); g.add(t);
    }
  } else if (type === 'anchor') {
    const armH = d * 1.25;
    put(g, mk(box(0.05, armH, 0.12), M.steel), -d, armH / 2, 0);
    put(g, mk(box(0.05, armH, 0.12), M.steel), d, armH / 2, 0);
    put(g, mk(box(2 * d, 0.05, 0.12), M.steel), 0, 0.02, 0);
  } else {
    put(g, mk(cyl(0.07, 0.07, 0.14, 16), M.steel), 0, 0, 0);
    for (let k = 0; k < 4; k++) {

/* ------------------------------ tank ------------------------------ */
function makeTank(o) {
  const { x = 0, z = 0, r = 1, h = 1.8, legH = 1.0, top = true, agit = 'pitched', run = [], w = 5,
          liquidMat = M.slurry, motorScale = 1, lvl = null } = o;
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const hd = 0.32 * r, y0 = legH + hd, y1 = y0 + h;
  pair(g, (s, l) => cyl(r, r, h, 64, true, s, l), CUT_CYL, M.steel, M.steelIn, V(0, y0 + h / 2, 0));
  pair(g, (s, l) => { const q = new THREE.SphereGeometry(r, 64, 12, s, l, Math.PI / 2, Math.PI / 2); q.scale(1, 0.32, 1); return q; }, CUT_SPH, M.steel, M.steelIn, V(0, y0, 0));
  if (top) pair(g, (s, l) => { const q = new THREE.SphereGeometry(r, 64, 12, s, l, 0, Math.PI / 2); q.scale(1, 0.32, 1); return q; }, CUT_SPH, M.steel, M.steelIn, V(0, y1, 0));
  rim(g, r + 0.012, top ? 0.03 : 0.045, y1, M.steelB);
  rim(g, r + 0.01, 0.022, y0, M.steelB);
  for (const th of [CUT_CYL, -CUT_CYL]) {
    const e = put(g, mk(box(0.03, h, 0.03), M.steelB), r * Math.sin(th), y0 + h / 2, r * Math.cos(th)); cutParts.push(e);
  }
  // legs with lugs
  for (let k = 0; k < 4; k++) {
    const a = Math.PI / 4 + k * Math.PI / 2, lx = Math.cos(a) * r * 1.07, lz = Math.sin(a) * r * 1.07;
    put(g, mk(cyl(0.055, 0.055, y0 + 0.3, 12), M.steelB), lx, (y0 + 0.3) / 2, lz);
    put(g, mk(box(0.22, 0.03, 0.22), M.steelB), lx, 0.015, lz);
    const lug = put(g, mk(box(0.1, 0.32, 0.12), M.steelB), Math.cos(a) * (r + 0.03), y0 + 0.16, Math.sin(a) * (r + 0.03));
    lug.rotation.y = -a;
  }
  // nozzles (inlets on the top head, outlet at the bottom)
  const inA = [-Math.PI / 2, -3 * Math.PI / 4, Math.PI, 3 * Math.PI / 4, Math.PI / 2];
  const rn = 0.55 * r, hy = y1 + 0.32 * r * Math.sqrt(1 - 0.55 * 0.55);
  const inlets = inA.map((th) => {
    const nx = rn * Math.sin(th), nz = rn * Math.cos(th);
    if (top) {
      put(g, mk(cyl(0.065, 0.065, 0.28, 16), M.steel), nx, hy + 0.12, nz);
      put(g, mk(cyl(0.12, 0.12, 0.035, 20), M.steelB), nx, hy + 0.27, nz);
      return V(x + nx, hy + 0.29, z + nz);
    }
    return V(x + nx * 1.05, y1 - 0.05, z + nz * 1.05);
  });
  put(g, mk(cyl(0.065, 0.065, 0.2, 16), M.steel), 0, legH - 0.06, 0);
  put(g, mk(cyl(0.12, 0.12, 0.035, 20), M.steelB), 0, legH - 0.16, 0);
  const outlet = V(x, legH - 0.18, z);
  // manway + sight glass details on the top head
  if (top) {
    put(g, mk(cyl(0.22, 0.22, 0.12, 24), M.steelB), -0.3 * r, hy + 0.06, -0.35 * r);
    put(g, mk(cyl(0.09, 0.09, 0.05, 16), M.glass), 0.3 * r, hy + 0.03, -0.42 * r);
  }
  // agitator
  let rotor = null;
  if (agit) {
    const shaftTop = top ? y1 + hd + 0.04 : y1 + 0.5;
    put(g, mk(cyl(0.15, 0.2, 0.16, 20), M.steelB), 0, shaftTop + 0.08, 0);
    const mot = vMotor(motorScale); mot.position.y = shaftTop + 0.16; g.add(mot);
    rotor = new THREE.Group(); g.add(rotor);
    const yImp = agit === 'anchor' ? y0 - hd * 0.4 : y0 + 0.2 * h;
    put(rotor, mk(cyl(0.035, 0.035, shaftTop - yImp, 12), M.steel), 0, (shaftTop + yImp) / 2, 0);
    const imp = impeller(agit, agit === 'cowles' ? r * 0.36 : agit === 'anchor' ? r * 0.85 : r * 0.45);
    imp.position.y = yImp; rotor.add(imp);
    if (agit === 'pitched' && h > 1.6) { const i2 = impeller('pitched', r * 0.4); i2.position.y = y0 + 0.62 * h; rotor.add(i2); }
    rotors.push({ obj: rotor, axis: 'y', run, w, cur: 0 });
  }
  // liquid (unit-height group, scaled by level)
  const L = new THREE.Group(); L.position.y = y0; g.add(L); dyn.add(L);
  const lr = r * 0.965;
  put(L, mk(cyl(lr, lr, 1, 64, true, CUT_CYL, CUT_TL), liquidMat, false), 0, 0.5, 0);
  const cap = put(L, new THREE.Mesh(new THREE.CircleGeometry(lr, 64, -Math.PI / 4, CUT_TL), liquidMat), 0, 1, 0);
  cap.rotation.x = -Math.PI / 2;
  for (const th of [CUT_CYL, -CUT_CYL]) {
    const pl = put(L, new THREE.Mesh(new THREE.PlaneGeometry(lr, 1), liquidMat), lr / 2 * Math.sin(th), 0.5, lr / 2 * Math.cos(th));
    pl.rotation.y = th - Math.PI / 2;
  }
  const lh = new THREE.SphereGeometry(lr, 48, 10, CUT_SPH, CUT_TL, Math.PI / 2, Math.PI / 2); lh.scale(1, 0.32, 1);
  const headLiq = put(g, new THREE.Mesh(lh, liquidMat), 0, y0, 0); dyn.add(headLiq);
  const T = { g, x, z, r, h, y0, y1, hy, legH, inlets, outlet, L, headLiq, rotor };
  if (lvl) levels.push({ T, ...lvl });
  return T;
}

/* ------------------------------ pipes ------------------------------ */
function roundedPath(pts, rc = 0.3) {
  const path = new THREE.CurvePath();
  let prev = pts[0].clone();
  for (let i = 1; i < pts.length - 1; i++) {
    const a = pts[i - 1], p = pts[i], b = pts[i + 1];
    const din = p.clone().sub(a).normalize(), dout = b.clone().sub(p).normalize();
    const r = Math.min(rc, p.distanceTo(a) / 2, p.distanceTo(b) / 2);
    const pA = p.clone().addScaledVector(din, -r), pB = p.clone().addScaledVector(dout, r);
    if (prev.distanceTo(pA) > 1e-4) path.add(new THREE.LineCurve3(prev.clone(), pA));
    path.add(new THREE.QuadraticBezierCurve3(pA, p.clone(), pB));
    prev = pB;
  }
  path.add(new THREE.LineCurve3(prev, pts[pts.length - 1].clone()));
  return path;
}
function dedupe(pts) { return pts.filter((p, i) => i === 0 || p.distanceTo(pts[i - 1]) > 1e-3); }
function flange(pos, dir, r) {
  const f = mk(cyl(r * 1.9, r * 1.9, 0.045, 20), M.steelB);
  f.position.copy(pos); f.quaternion.setFromUnitVectors(V(0, 1, 0), dir.clone().normalize()); scene.add(f);
}
function valve(pos, r) {
  put(scene, mk(new THREE.SphereGeometry(r * 1.7, 16, 12), M.steelB), pos.x, pos.y, pos.z);
  put(scene, mk(cyl(0.02, 0.02, 0.25, 8), M.steelB), pos.x, pos.y + 0.14, pos.z);
  const hw = put(scene, mk(new THREE.TorusGeometry(0.11, 0.015, 8, 24), M.yellow), pos.x, pos.y + 0.27, pos.z);
  hw.rotation.x = Math.PI / 2;
}
const flowGeo = new Map();   // shared particle geometry per pipe radius
function makePipe(pts, { stages = [], r = 0.06, speed = 1.4, mat = M.flow, valveAt = 0.12, reverse = false, when = null } = {}) {
  pts = dedupe(pts);
  const path = roundedPath(pts);
  const len = path.getLength();
  const tube = mk(new THREE.TubeGeometry(path, Math.max(40, Math.round(len * 14)), r, 12, false), pipeMat, false);
  scene.add(tube);
  flange(pts[0], pts[1].clone().sub(pts[0]), r);
  flange(pts[pts.length - 1], pts[pts.length - 1].clone().sub(pts[pts.length - 2]), r);
  if (valveAt !== null) valve(path.getPointAt(valveAt), r);
  const samples = path.getSpacedPoints(Math.max(60, Math.round(len * 30)));
  const n = Math.max(6, Math.round(len * 3.2));
  if (!flowGeo.has(r)) flowGeo.set(r, new THREE.SphereGeometry(r * 0.75, 10, 8));
  const inst = new THREE.InstancedMesh(flowGeo.get(r), mat, n);
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage); inst.frustumCulled = false; inst.visible = false;
  scene.add(inst);
  const P = { samples, len, inst, n, stages, speed, reverse, when };
  pipes.push(P);
  return P;
}
// Generic route: drop from an outlet to floor level, run along x, rise beside the target, enter from above.
function route(a, b, riseX, { lane = null, over = null } = {}) {
  const ln = lane ?? a.z, topY = over ?? b.y + 0.55;
  return [a.clone(), V(a.x, FY, a.z), V(a.x, FY, ln), V(riseX, FY, ln), V(riseX, FY, b.z), V(riseX, topY, b.z), V(b.x, topY, b.z), b.clone()];
}

function makePump(x, z, rot = Math.PI / 2) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rot; scene.add(g);

  const done = (i, frac) => { const n = SEQ.findIndex((q) => q.i === i); return n >= 0 && (k > n || (k === n && p >= frac)); };
  x.strokeStyle = 'rgba(255,255,255,.25)'; x.lineWidth = 1; x.beginPath(); x.moveTo(L, H - 30); x.lineTo(R, H - 30); x.stroke();
  x.fillStyle = '#9db0c2'; x.font = '18px system-ui'; x.textAlign = 'center';
  for (const v of [0.05, 0.1, 0.2, 0.5, 1, 2]) { x.fillRect(X(v), H - 34, 1, 8); x.fillText(String(v), X(v), H - 8); }
  x.textAlign = 'left'; x.fillText('µm', R - 26, H - 40);
  if (ROUTE.mill === 'bead') {
    x.font = '18px system-ui'; x.fillStyle = '#e9eef3'; x.fillText('해쇄 전', 4, 46);
    x.fillStyle = '#ff8f6b'; x.beginPath(); x.arc(X(1.01), 40, 8, 0, 7); x.fill();
    x.fillStyle = '#ffb59c'; x.fillText('D90 1.01', X(1.01) - 110, 46);
    x.globalAlpha = done(3, 0.5) ? 1 : 0.25;
    x.fillStyle = '#e9eef3'; x.fillText('3패스 후', 4, 112);
    x.fillStyle = 'rgba(255,181,71,.35)'; x.fillRect(X(0.12), 96, X(0.447) - X(0.12), 24);
    x.fillStyle = '#ffb547';
    for (const v of [0.12, 0.233, 0.447]) x.fillRect(X(v) - 1.5, 90, 3, 36);
    x.font = '15px system-ui'; x.fillText('D10 0.12', X(0.12) - 30, 86); x.fillText('D50 0.233', X(0.233) - 34, 140); x.fillText('D90 0.447', X(0.447) - 10, 86);
  } else {
    x.font = '18px system-ui';
    x.globalAlpha = done(10, 0.5) ? 1 : 0.25;
    x.fillStyle = '#e9eef3'; x.fillText('볼밀 뒤', 4, 46);
    x.fillStyle = '#ffb547'; x.beginPath(); x.arc(X(0.45), 40, 8, 0, 7); x.fill(); x.fillText('D90 0.45', X(0.45) + 14, 46);
    const hpOn = ROUTE.hp === 'thin';
    x.globalAlpha = hpOn && done(5, 0.5) ? 1 : 0.25;
    x.fillStyle = '#e9eef3'; x.fillText(hpOn ? '+ 고압 분산' : '고압 생략', 4, 112);
    if (hpOn) { x.fillStyle = '#ffb547'; x.beginPath(); x.arc(X(0.41), 106, 8, 0, 7); x.fill(); x.fillText('D90 0.41', X(0.41) + 14, 112); }
  }
  x.globalAlpha = 1;
}

/* ------------------------------ static merge (draw calls) ------------------------------
   Meshes that never move are merged per material (and per cut/full variant), first inside
   each moving group (in that group's frame), then for the whole scene. */
function bakeInto(root) {
  root.updateMatrixWorld(true);
  const inv = root.matrixWorld.clone().invert();
  const cutSet = new Set(cutParts), fullSet = new Set(fullParts);
  const buckets = new Map(), victims = [], mtx = new THREE.Matrix4();
  const walk = (o) => {
    for (const c of o.children) {
      if (dyn.has(c)) continue;
      if (c.isMesh && !c.isInstancedMesh && c.geometry.index && c.geometry.attributes.uv && c.geometry.attributes.normal) {
        const vis = cutSet.has(c) ? 'c' : fullSet.has(c) ? 'f' : 'a';
        const key = `${c.material.uuid}|${c.castShadow ? 1 : 0}|${vis}`;
        let b = buckets.get(key);
        if (!b) buckets.set(key, (b = { mat: c.material, cast: c.castShadow, vis, geos: [] }));
        const g = c.geometry.clone();
        g.applyMatrix4(mtx.multiplyMatrices(inv, c.matrixWorld));
        for (const a of Object.keys(g.attributes)) if (a !== 'position' && a !== 'normal' && a !== 'uv') g.deleteAttribute(a);
        g.morphAttributes = {};
        b.geos.push(g); victims.push([c, key]);
      }
      walk(c);
    }
  };
  walk(root);
  for (const b of buckets.values()) {
    if (b.geos.length < 2) { b.geos.forEach((g) => g.dispose()); continue; }
    const merged = mergeGeometries(b.geos, false);
    b.geos.forEach((g) => g.dispose());
    if (!merged) continue;
    const m = new THREE.Mesh(merged, b.mat); m.castShadow = b.cast; m.receiveShadow = true;
    root.add(m);
    if (b.vis === 'c') cutParts.push(m); else if (b.vis === 'f') fullParts.push(m);
    b.done = true;
  }
  for (const [c, key] of victims) if (buckets.get(key).done) c.parent.remove(c);
}
function bakeStatic() {
  rotors.forEach((r) => dyn.add(r.obj));
  for (const o of [...dyn]) if (!o.isMesh) bakeInto(o);
  bakeInto(scene);
  const live = (m) => { for (let p = m; p; p = p.parent) if (p === scene) return true; return false; };
  for (const arr of [cutParts, fullParts]) { const kept = arr.filter(live); arr.length = 0; arr.push(...kept); }
}
bakeStatic();
setCut(true);

/* ------------------------------ loop ------------------------------ */
const clock = new THREE.Clock();
const dmy = new THREE.Object3D();
const sm = (t) => t * t * (3 - 2 * t);
// Levels work on positions in the active route (SEQ). `fill` / `drain` may list fallbacks
// (first one on the route wins). A tank whose fill step is off the route stays empty; one whose
// drain step is off the route stays full until the loop restarts.
function firstK(list, after = -1) {
  for (const f of [].concat(list)) { const k = SEQ.findIndex((q, n) => n > after && q.i === f); if (k >= 0) return k; }
  return -1;
}
function levelAt(o, k, p) {
  const { lo, hi } = o;
  const fK = firstK(o.fill);
  if (fK < 0) return lo;
  let dK = firstK(o.drain, fK); if (dK < 0) dK = SEQ.length;
  if (k === fK) return lo + (hi - lo) * sm(Math.min(1, p / 0.6));
  if (k === dK) return hi - (hi - lo) * sm(Math.min(1, p / 0.7));
  return k > fK && k < dK ? hi : lo;
}
let infoTick = 0;
function frame() {
  const rawDt = clock.getDelta(), dt = Math.min(rawDt, 0.05);   // sim steps are capped; the camera tween uses real time
  if (playing) simT += dt * speed;
  const total = simT / STAGE_DUR;
  const k = Math.floor(total) % SEQ.length, p = total - Math.floor(total), t = simT;
  const s = SEQ[k].i;
  if (k !== lastK) {
    lastK = curK = k; lastStage = s;
    seqBtns.forEach((b, n) => b.classList.toggle('active', n === k));
    { // keep the active step visible in the list (horizontal on phones, scrolling panel on short screens)
      const btn = seqBtns[k], list = document.getElementById('stages'), panel = document.getElementById('left');
      if (btn) {
        const br = btn.getBoundingClientRect();
        if (list.scrollWidth > list.clientWidth + 2) { const lr = list.getBoundingClientRect(); list.scrollTo({ left: list.scrollLeft + br.left - lr.left - (list.clientWidth - br.width) / 2, behavior: 'smooth' }); }
        if (panel.scrollHeight > panel.clientHeight + 2) { const pr = panel.getBoundingClientRect(); if (br.top < pr.top || br.bottom > pr.bottom) panel.scrollTo({ top: panel.scrollTop + br.top - pr.top - (panel.clientHeight - br.height) / 2, behavior: 'smooth' }); }
      }
    }
    stageTags.forEach((el, i) => el.classList.toggle('active', i === s));
    SUBS.forEach((q) => q.el.classList.toggle('show', q.s.includes(s)));
    renderInfo(k);
    if (autoTour) flyTo(s);
  }
  seqBtns.forEach((b, n) => { b.querySelector('.bar').style.width = n === k ? `${p * 100}%` : '0'; });

  for (const r of rotors) {
    const target = r.run.includes(s) ? r.w : r.w * 0.06;
    r.cur += (target - r.cur) * Math.min(1, dt * 1.5);
    r.obj.rotation[r.axis] += r.cur * dt;
  }
  for (const o of levels) {
    const l = levelAt(o, k, p);
    o.T.L.scale.y = Math.max(0.001, l * o.T.h);
    o.T.L.visible = l > 0.01; o.T.headLiq.visible = l > 0.005;
  }
  for (const P of pipes) {
    const on = P.stages.includes(s) && (!P.when || P.when());
    P.inst.visible = on;
    if (!on) continue;
    const ns = P.samples.length - 1;
    for (let i = 0; i < P.n; i++) {
      let u = (i / P.n + (t * P.speed) / P.len) % 1;
      if (P.reverse) u = 1 - u;
      const f = u * ns, j = Math.floor(f), a = P.samples[j], b = P.samples[Math.min(ns, j + 1)];
      dmy.position.lerpVectors(a, b, f - j); dmy.updateMatrix(); P.inst.setMatrixAt(i, dmy.matrix);
    }
    P.inst.instanceMatrix.needsUpdate = true;
  }
  for (const u of updaters) u(dt, s, p, t, k);

  if (tween) {
    tween.k = Math.min(1, tween.k + Math.min(rawDt, 1) / 2.2);
    const e = sm(tween.k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.k >= 1) tween = null;
  }
  infoTick += dt;
  if (infoTick > 1 / 30) { infoTick = 0; drawMicro(k, s, p, t); drawPSD(k, s, p); }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
document.getElementById('loading').remove();
frame();
</script>
</body>
