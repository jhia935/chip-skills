<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLCC 선별·테이핑 3D</title>
<style>
  :root {
    --panel: rgba(15, 20, 27, 0.80);
    --panel-line: rgba(255, 255, 255, 0.12);
    --text: #e9eef3;
    --muted: #9db0c2;
    --accent: #ffb547;
    --accent-ink: #1d1406;
    --g: #8fd0ff;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2229; color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .tag { pointer-events: auto; cursor: pointer; transform: translateY(-6px);
    background: rgba(14, 18, 24, 0.84); color: var(--text); border: 1px solid rgba(255,255,255,.2);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; white-space: nowrap; transition: background .25s, color .25s; }
  .tag b { color: var(--accent); margin-right: 4px; }
  .tag.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tag.active b { color: var(--accent-ink); }
  .sub { pointer-events: none; font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: rgba(255,255,255,.88); color: #1d242c; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .sub.show { opacity: 1; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #left { top: 16px; left: 16px; width: 268px; padding: 14px 14px 12px; }
  #left h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: -.01em; }
  #left .sub-h { font-size: 11.5px; color: var(--muted); margin: 0 0 10px; }
  #stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  #stages button { width: 100%; text-align: left; background: transparent; color: var(--text); border: 0;
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #stages button:hover { background: rgba(255,255,255,.07); }
  #stages button.active { background: rgba(255,181,71,.16); color: #fff; }
  #stages .n { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px;
    background: rgba(255,255,255,.1); flex: none; }
  #stages button.active .n { background: var(--accent); color: var(--accent-ink); }
  #stages .bar { height: 2px; background: var(--accent); width: 0; border-radius: 2px; margin-top: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .controls button, .controls select { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line);
    border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #info { right: 16px; bottom: 16px; width: 390px; max-height: calc(100vh - 32px); overflow: auto; padding: 16px; box-sizing: border-box; }
  #info .head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
  #info .fold { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line); border-radius: 8px; padding: 3px 8px; font: inherit; font-size: 11.5px; cursor: pointer; flex: none; }
  #info.collapsed .body { display: none; }
  #info.collapsed h2 { margin-bottom: 0; }
  #info .kicker { font-size: 11px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
  #info h2 { font-size: 18px; margin: 2px 0 6px; }
  #info p { font-size: 13px; line-height: 1.55; color: #d5dde5; margin: 0 0 10px; }
  #info h3 { font-size: 11.5px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; letter-spacing: .03em; }
  #info ul { margin: 0; padding-left: 16px; font-size: 12.5px; line-height: 1.55; }
  #info li { margin-bottom: 2px; }
  #info code { font-size: 11px; color: var(--g); }
  .g { color: #ffcf8a; font-size: 11px; }
  .canvas-wrap { margin-top: 8px; background: rgba(0,0,0,.25); border-radius: 8px; padding: 6px; }
  .canvas-wrap canvas { width: 100%; display: block; }
  .cap { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .foot { font-size: 10.5px; color: var(--muted); margin-top: 12px; line-height: 1.5; border-top: 1px solid var(--panel-line); padding-top: 8px; }
  /* process-flow branches */
  #left { max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; }
  #stages li.fork { display: grid; gap: 3px; margin: 3px 0; padding: 6px 6px 6px 7px;
    border: 1px dashed rgba(255,255,255,.2); border-radius: 10px; }
  #stages .fork-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; padding: 0 2px 2px; }
  #stages .fk { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  #stages .seg { display: inline-flex; background: rgba(255,255,255,.07); border-radius: 999px; padding: 2px; gap: 2px; }
  #stages .seg button { width: auto; display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; color: var(--muted); }
  #stages .seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  #stages .opt { display: grid; gap: 2px; padding-left: 7px; border-left: 2px solid rgba(255,255,255,.14); }
  #stages .opt.on { border-left-color: var(--accent); }
  #stages .opt-label { font-size: 10.5px; color: var(--muted); padding: 1px 0 0 2px; }
  #stages .opt.off > button { opacity: .45; }
  #stages .opt.off .n { background: transparent; border: 1px dashed rgba(255,255,255,.3); }
  #stages .skip { font-size: 11.5px; line-height: 1.45; color: var(--muted); padding: 3px 8px 4px; }
  #stages .mk { font-size: 10.5px; color: var(--muted); margin-left: 5px; white-space: nowrap; }
  .tag.off { opacity: .35; }
  @media (max-width: 820px) {
    #left { max-height: none; overflow: visible; }
    #stages li.fork { display: flex; align-items: center; gap: 4px; padding: 3px 5px; margin: 0; }
    #stages .fork-head { padding: 0; }
    #stages .fk { display: none; }
    #stages .opt { display: flex; gap: 4px; border-left: 0; padding-left: 0; }
    #stages .opt.off, #stages .opt-label { display: none; }
    #stages .skip { white-space: nowrap; padding: 0 4px; font-size: 11px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); }
  @media (max-width: 820px) {
    #left { left: 8px; right: 8px; top: 8px; width: auto; padding: 10px; }
    #left .sub-h { display: none; }
    #stages { display: flex; overflow-x: auto; gap: 4px; }
    #stages li { flex: none; }
    #stages button { white-space: nowrap; padding: 5px 8px; }
    #info { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 40vh; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="loading">3D 설비 모형을 불러오는 중…</div>

<div id="left" class="panel">
  <h1>MLCC 측정 · 선별 · 테이핑 공정</h1>
  <p class="sub-h">도금을 마친 칩의 전수 측정(C/DF·IR·플래시)과 빈 분류, 유리 원판 외관 검사, 테이핑기(재측정·포켓 삽입·실링·권취), 박리 강도 검사와 포장까지 설비 3D 모형. 디에이징(기준 측정)과 번인(고신뢰)은 선택 경로입니다.</p>
  <ol id="stages"></ol>
  <div class="controls">
    <button id="play">❚❚ 일시정지</button>
    <select id="speed" aria-label="재생 속도">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <button id="overview">전체 보기</button>
    <label><input type="checkbox" id="tour" checked> 카메라 따라가기</label>
    <label><input type="checkbox" id="cut" checked> 단면 보기</label>
  </div>
</div>

<div id="info" class="panel"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------
   Stage data — parameters come from the wiki:
   wiki/concepts/production-test-and-screening-mlcc.md,
   resources/manufacturing/80-test-sort-and-packaging.md,
   resources/manufacturing/eq-10-test-sort-pack.md (equipment structure & step order),
   wiki/queries/mlcc-process-substeps-and-equipment.md (§15–16). Source keys kept.
   (g) = general industry practice, not backed by a corpus source.
------------------------------------------------------------------- */
const G = '<span class="g">(g)</span>';
const K = (...ks) => ks.map((s) => `<code>[${s}]</code>`).join(' ');
const UNV = '(검색 요약만, 미확인)';
const STAGES = [
  { name: '디에이징 베이크', en: 'De-aging bake (Class II reference)',
    cam: [[-22.4, 4.3, 8.4], [-25.2, 1.4, 0]],
    desc: 'Class II(강유전체) 칩의 용량은 마지막으로 T<sub>C</sub>를 넘은 뒤 시간이 지날수록 줄어듭니다(에이징). 기준값을 잴 때는 오븐에서 열처리해 도메인 상태를 되돌리고, 24시간 둔 뒤 측정합니다. 표본·실험실 기준 측정용 경로이고, 인라인 선별기는 이 절차 없이 바로 잽니다.',
    equip: [`열처리 오븐 (150 °C) ${K('digikey-mlcc-meas')} · 순환 팬·배기 덕트 구조 ${G}`, `방치 랙 ${G}`, `LCR 미터 + 측정 지그 ${G}`],
    params: [`150 °C (+0/−10) × 1 h → 24 ±2 h 방치 후 측정 ${K('digikey-mlcc-meas')}`, `Class II만 해당, C0G(Class I)는 불필요 ${K('digikey-mlcc-meas')}`, `Class II ≤10 µF: 1 kHz ±10%, 1.0 ±0.2 Vrms · >10 µF: 120 Hz ±20%, 0.5 ±0.2 Vrms ${K('tdk-faq-0008')} (검색 요약만, 미확인)`, '미해결: 인라인 선별값과 디에이징 기준값을 공장에서 어떻게 맞추는지는 자료 없음'] },
  { name: '칩 공급', en: 'Feeder → turntable pockets',
    cam: [[-10.6, 3.9, 5.9], [-12.4, 1.3, -0.1]],
    desc: '도금을 마친 칩을 호퍼에서 진동 피더로 보내 한 방향·한 줄로 세웁니다. 리니어 트랙 끝은 턴테이블 가장자리에 바짝 붙어 있고, 포켓 안쪽 벽의 공기 구멍이 진공으로 칩을 하나씩 빨아들입니다. 턴테이블은 포켓 한 칸씩 끊어서 돌고(인덱스), 포켓마다 달린 전자 밸브가 진공(붙잡기)과 양압(불어내기)을 바꿉니다.',
    equip: [`호퍼 → 진동 피더 → 리니어 트랙, 출구를 테이블 바로 옆에 ${K('us6479777')}`, `보울 형상 ${G} · 다른 예: 호퍼 + 진동 트레이(체 메시로 작은 칩 제거) + 깔때기 + 로딩 프레임 ${K('us5842579')}`, `외주 포켓 턴테이블, 포켓마다 공기 구멍 + 전자 선택 밸브(진공/양압) ${K('us6479777', 'us6448525')}`, `진공 구동 회전 핸들링 ${K('esi-allegro-xp-2020')} · 다른 구조: 약 60° 기울인 링 플레이트에 시트 4열, 아래 진공판 ${K('us5842579')} (모형은 수평 턴테이블)`],
    params: [`0603–1210에서 최대 16,666 개/분 (1.0 M/h) ${K('esi-allegro-xp-2020')}`, `0201까지 최대 20,000 개/분 ${K('esi-allegro-web')} ${UNV}`, `Murata 사내 자동 측정 >10,000 개/분, 100% 선별 ${K('murata-meas-web')}`, `포켓 폭 1–수 mm, 위치 공차 약 1 mm ${K('us6479777')}`, `설비 요건: 진공 55 kPa, 압축공기 340 LPM ${K('esi-allegro-xp-2020')}`] },
  { name: 'C / DF 측정', en: 'Capacitance & dissipation factor',
    cam: [[-12.6, 3.5, 3.4], [-9.9, 1.3, -0.5]],
    desc: '턴테이블이 한 칸 돌 때마다 칩이 측정 스테이션 아래에 멈추고, 상부 접점이 내려와 양 끝 전극에 닿습니다. 아래쪽은 진공이 칩을 붙잡고 하부 접점이 받칩니다. 용량(C)과 손실계수(DF)를 재며, 양산에서도 전수 측정합니다.',
    equip: [`로터리 턴테이블 테스트 핸들러, 스테이션 최대 25개 ${K('esi-allegro-xp-2020')}`, `롤러 상부 접점(정압 설정) · BeCu/은/텅스텐 하부 접점, 펄스 구동 ${K('esi-allegro-xp-2020')}`, `특허 예: 약 30° 캔틸레버 판 상부 접점 + 스프링 포고 핀 하부 접점, 접점 모듈 5개 ${K('us5842579')}`, `승강 단자대가 내려와 단자 한 쌍이 양 끝 전극에 닿음 ${K('us6479777')}`, `C/DF 스테이션당 정전용량 미터 2대 ${K('esi-allegro-xp-2020')}`, `접점 공압 실린더·스테이션 마운트 형상 ${G}`],
    params: [`C/DF 주파수 120 Hz / 1 kHz / 1 MHz ${K('esi-allegro-xp-2020')}`, `C·임피던스·ESR 전수 측정, ms 단위 접촉 ${K('murata-meas-web')}`, `특허 예는 마지막 스테이션에서 C를 한 번 더 확인 ${K('us5842579')}`, `고용량 칩은 신호원을 끌어내려 ALC가 없으면 C가 낮게 읽힘 (예: 10.08 µF vs 7.24 µF) ${K('tdk-faq-0008')} (미확인)`, 'Class I (1 MHz) 측정 조건은 읽은 자료에서 확인 안 됨'] },
  { name: 'IR 충전 · 측정', en: 'Insulation resistance: charge, soak, measure',
    cam: [[-6.3, 3.7, 3.8], [-9.0, 1.3, -0.6]],
    desc: 'IR은 충전 전류와 흡수 전류가 가라앉은 뒤 남는 누설 전류로 판정합니다. 한 스테이션에서 기다리면 느리므로, 칩이 프리차지 → 프리소크 → IR 측정 스테이션을 차례로 지나는 동안 전압을 나눠 겁니다. 충전 초기 몇 ms의 전류로 긴 시간 뒤의 값을 예측하는 방법도 있습니다.',
    equip: [`IR 프리차지 · 프리소크 · IR/전류 스테이션 ${K('esi-allegro-xp-2020')}`, `소스-측정 유닛 ${K('esi-allegro-xp-2020')}`, `전류 측정: 측정 증폭기 + 로그 증폭기 + A/D, 문턱값에서 증폭기 전환 ${K('us6448525')}`],
    params: [`인가 2–600 V (옵션 1000 V), 충전 전류 2–250 mA, 측정 1 pA – 2 mA ${K('esi-allegro-xp-2020')}`, `특허 예: 저전압 IR (예: 50 V) → 정격 전압 소크 수백 ms → IR 재측정 ${K('us5842579')}`, `IR 예측: 충전 1–10 ms 전류로 약 60 s 값을 추정, 판정 시점 5–80 ms ${K('us6448525')}`, `고신뢰 스크린 IR: V<sub>R</sub>에서 2.0 ±0.1 min 후 판독, 3σ 이탈 기준 ${K('nepp-guidelines-2012')}`, '양산 소크 시간은 공개 자료 없음 (특허 예의 수백 ms만 확인)'] },
  { name: '분류 · 빈 배출', en: 'Bin ejection',
    cam: [[-9.4, 3.0, 6.4], [-9.4, 1.2, 1.3]],
    desc: '측정이 끝난 칩이 판정 결과에 맞는 배출 위치에 오면, 포켓 아래 밸브가 공기를 짧게 불어 진공을 이기고 칩을 위로 밀어냅니다. 칩은 매니폴드 구멍에서 튜브를 타고 떨어져 빈에 모입니다. 공차 빈, 불량 빈, 재검 빈으로 나뉘고, 측정 데이터와 불량 모드는 상류 공정으로 되돌려 보냅니다.',
    equip: [`공차 빈 ≤7 + 불량 빈 ≤7 + 재검 빈 1 ${K('esi-allegro-xp-2020')}`, `포켓 아래 공압 밸브 → 배출 매니폴드 → 튜브 → 분배판 → 빈 ${K('us5842579')}`, `배출 뒤 포켓에 남은 칩을 광센서로 감지(잼 감지) ${K('us5842579')}`, `튜브 배치·빈 트레이 형상 ${G}`, `측정 데이터 DB, 상류 공정 피드백 ${K('murata-meas-web')}`],
    params: [`특허 예: 배출 구멍 44개 (11열 × 4링), 불량 5열 · 양품 5열 · 미배출 1열 ${K('us5842579')}`, `구형 모델은 5 + 3 + 1 빈 ${K('esi-allegro-web')} ${UNV}`, `균열에는 C가 가장 둔감, DF도 ~15% 증가에 그침 ${K('nepp-crack-teverovsky')}`, `핸들러 접점 자국·칩 손상이 설계 관심사 (저충격 핸들링) ${K('esi-allegro-xp-2020')}`] },
  { name: '외관 검사', en: 'Appearance inspection (glass disk)',

/* ------------------------------ helpers ------------------------------ */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const CUT_CYL = Math.PI / 4, CUT_SPH = 3 * Math.PI / 4, CUT_TL = 1.5 * Math.PI, FULL = Math.PI * 2;
const DEG = Math.PI / 180;
const cutParts = [], fullParts = [];
const rotors = [], updaters = [];
const HIDE = 0.0001;
const sm = (t) => t * t * (3 - 2 * t);
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const mod = (a, n) => ((a % n) + n) % n;

function mk(geo, mat, cast = true) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; return m; }
function put(parent, m, x = 0, y = 0, z = 0) { m.position.set(x, y, z); parent.add(m); return m; }
const cyl = (r1, r2, h, seg = 32, open = false, ts = 0, tl = FULL) => new THREE.CylinderGeometry(r1, r2, h, seg, 1, open, ts, tl);
const box = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const along = (geo, axis) => { if (axis === 'x') geo.rotateZ(-Math.PI / 2); if (axis === 'z') geo.rotateX(Math.PI / 2); return geo; };

function pair(parent, geoFn, cutStart, matOut, matIn, pos) {
  const gc = geoFn(cutStart, CUT_TL);
  const a = mk(gc, matOut), b = mk(gc, matIn, false), f = mk(geoFn(0, FULL), matOut);
  for (const m of [a, b, f]) { m.position.copy(pos); parent.add(m); }
  cutParts.push(a, b); fullParts.push(f);
}
function rim(parent, R, tube, y, mat) {
  const gc = new THREE.TorusGeometry(R, tube, 8, 64, CUT_TL); gc.rotateX(Math.PI / 2); gc.rotateY(5 * Math.PI / 4);
  const gf = new THREE.TorusGeometry(R, tube, 8, 64); gf.rotateX(Math.PI / 2);
  const a = put(parent, mk(gc, mat), 0, y, 0), f = put(parent, mk(gf, mat), 0, y, 0);
  cutParts.push(a); fullParts.push(f);
}
function label(text, pos, cls = 'tag', stage = null) {

function beam(parent, a, b, t, mat) {
  const d = b.clone().sub(a), L = d.length();
  const m = mk(box(t, L, t), mat);
  m.position.copy(a).addScaledVector(d, 0.5);

}
function cable(a, b, lift, r = 0.014, mat = M.rubber) {

}

function makeScreen(parent, pw, ph, cw, ch, x, y, z, ry = 0, rx = 0) {

function cabinet(x, z, w, h, d, mat = M.paint) {

  const nd = Math.max(1, Math.round(w / 1.1));

    for (let v = 0; v < 5; v++) put(g, mk(box(w / nd * 0.4, 0.012, 0.006), M.dark), dx - 0.05, 0.22 + v * 0.035, d / 2 + 0.014);
  }

const chipGeo = box(0.11, 0.055, 0.055);
function chipInst(n, parent) {
  const inst = new THREE.InstancedMesh(chipGeo, M.chip, n);
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage); inst.frustumCulled = false; inst.castShadow = true;
  parent.add(inst); return inst;
}
const dm = new THREE.Object3D();
function setI(inst, i, pos, ry = 0, s = 1, rx = 0, rz = 0) {
  dm.position.copy(pos); dm.rotation.set(rx, ry, rz); dm.scale.setScalar(s); dm.updateMatrix(); inst.setMatrixAt(i, dm.matrix);
}
const heatMat = () => std({ color: 0x8a6a4c, emissive: 0xff5a14, emissiveIntensity: 0, metalness: 0.5, roughness: 0.45 });
// Draw-call batching: once the scene is built, every mesh that never moves is merged per material.
// Anything that moves (or whose subtree moves) is tagged with dyn() and left alone.
function dyn(o) { o.userData.dyn = true; return o; }
function freezeStatic(root) {
  root.updateMatrixWorld(true);
  const skip = new Set([...cutParts, ...fullParts]);
  const buckets = new Map(), victims = [];
  (function walk(o) {
    for (const c of o.children) {
      if (c.userData.dyn) continue;
      if (c.isMesh && !c.isInstancedMesh && !skip.has(c) && !c.children.length) {
        const g = c.geometry, sig = Object.keys(g.attributes).sort().join() + (g.index ? 'i' : 'n');
        const key = `${c.material.uuid}|${c.castShadow}|${sig}`;
        let b = buckets.get(key); if (!b) buckets.set(key, b = { mat: c.material, cast: c.castShadow, geos: [] });
        b.geos.push(g.clone().applyMatrix4(c.matrixWorld)); victims.push(c);
      } else walk(c);
    }
  })(root);
  for (const b of buckets.values()) {
    const m = new THREE.Mesh(b.geos.length > 1 ? mergeGeometries(b.geos) : b.geos[0], b.mat);
    m.castShadow = b.cast; m.receiveShadow = true; m.matrixAutoUpdate = false; root.add(m);
  }
  for (const v of victims) v.parent.remove(v);
}

/* ------------------------------ flying chips (shared pool) ------------------------------ */
const flights = (() => {
  const n = 48, inst = chipInst(n, scene);
  const F = Array.from({ length: n }, () => ({ on: false }));
  let next = 0;
  const pos = V(0, 0, 0);
  updaters.push((dt, s, p, t) => {
    for (let i = 0; i < n; i++) {
      const f = F[i];
      if (f.on) {
        const k = (t - f.t0) / f.dur;
        if (k >= 1 || k < 0) { f.on = false; if (k >= 1 && f.done) f.done(); }
        else { pos.lerpVectors(f.a, f.b, k); pos.y += f.h * 4 * k * (1 - k); setI(inst, i, pos, f.ry + k * 7, 1, k * 9); continue; }
      }
      setI(inst, i, pos.set(0, -5, 0), 0, HIDE);
    }
    inst.instanceMatrix.needsUpdate = true;
  });
  return { spawn(a, b, t, dur, h, done) { const f = F[next]; next = (next + 1) % n; Object.assign(f, { on: true, a: a.clone(), b: b.clone(), t0: t, dur, h, done, ry: Math.random() * 6 }); } };
})();

/* ------------------------------ vibratory bowl + linear track ------------------------------ */
function makeBowl({ x, z, y0, r = 0.6, exitAng = 0, stages, n = 40, pile = 50, hopper = true }) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  put(g, mk(cyl(r * 0.82, r * 0.82, 0.04, 32), M.dark), 0, y0 + 0.02, 0);
  put(g, mk(cyl(r * 0.68, r * 0.78, 0.24, 32), M.motorG), 0, y0 + 0.14, 0);       // electromagnetic drive
  for (let k = 0; k < 3; k++) {                                                     // leaf springs
    const a = k / 3 * FULL + 0.5;
    const sp = put(g, mk(box(0.05, 0.24, 0.11), M.steelB), Math.cos(a) * r * 0.78, y0 + 0.15, Math.sin(a) * r * 0.78);
    sp.rotation.set(0, -a, 0.35);
  }
  put(g, mk(box(0.14, 0.1, 0.1), M.dark), r * 0.85, y0 + 0.08, 0);                // terminal box
  const bv = dyn(new THREE.Group()); bv.position.y = y0 + 0.28; g.add(bv);
  const bh = r * 0.55;
  put(bv, mk(cyl(r, r, 0.03, 48), M.steelB), 0, 0.015, 0);
  put(bv, mk(cyl(0.04, r * 0.55, bh * 0.55, 32), M.steel), 0, bh * 0.275 + 0.03, 0);
  pair(bv, (s0, l) => cyl(r, r, bh, 48, true, s0, l), CUT_CYL, M.steel, M.steelIn, V(0, bh / 2, 0));
  rim(bv, r + 0.01, 0.018, bh, M.steelB);
  const rs = r * 0.9, turns = 2;
  const ang = (u) => exitAng - turns * FULL * (1 - u);
  const hp = (u, tgt) => { const a = ang(u); return tgt.set(rs * Math.cos(a), 0.05 + (bh - 0.07) * u, rs * Math.sin(a)); };
  class Sp extends THREE.Curve { getPoint(u, tgt = new THREE.Vector3()) { return hp(u, tgt); } }
  put(bv, mk(new THREE.TubeGeometry(new Sp(), 180, 0.018, 6, false), M.steelB), 0, 0, 0);
  const ci = chipInst(n + pile, bv);
  const tmp = V(0, 0, 0);
  for (let i = 0; i < pile; i++) {
    const a = Math.random() * FULL, rr = r * 0.42 + Math.random() * r * 0.38;
    setI(ci, n + i, tmp.set(rr * Math.cos(a), 0.06 + Math.random() * 0.05, rr * Math.sin(a)), Math.random() * 6, 1, Math.random(), Math.random());
  }
  const us = Array.from({ length: n }, (_, i) => i / n);
  updaters.push((dt, s, p, t) => {
    const on = stages.includes(s) ? 1 : 0;
    bv.position.y = y0 + 0.28 + Math.sin(t * 53) * 0.004 * on;
    bv.rotation.y = Math.sin(t * 53) * 0.008 * on;
    for (let i = 0; i < n; i++) {
      if (on) us[i] = (us[i] + dt * 0.09) % 1;
      hp(us[i], tmp); tmp.y += 0.045;
      setI(ci, i, tmp, -(ang(us[i]) + Math.PI / 2));
    }
    ci.instanceMatrix.needsUpdate = true;
  });
  if (hopper) {
    const hx = -r * 0.2, hz = -r * 0.5, hy = y0 + 1.3;
    put(g, mk(cyl(r * 0.55, r * 0.12, r * 0.75, 28), M.steel), hx, hy, hz);
    put(g, mk(new THREE.TorusGeometry(r * 0.55, 0.018, 8, 28), M.steelB), hx, hy + r * 0.375, hz).rotation.x = Math.PI / 2;
    put(g, mk(cyl(r * 0.12, r * 0.12, 0.25, 16), pipeMat, false), hx, hy - r * 0.5, hz);
    put(g, mk(box(0.08, hy + 0.2, 0.08), M.steelB), hx, (hy + 0.2) / 2, hz - r * 0.65);
    put(g, mk(box(0.08, 0.08, r * 0.65), M.steelB), hx, hy + 0.15, hz - r * 0.33);
  }
  return { exit: V(x + (r + 0.03) * Math.cos(exitAng), y0 + 0.28 + bh - 0.01, z + (r + 0.03) * Math.sin(exitAng)) };
}
function makeTrack(a, b, { n = 20, stages, speed = 0.22, drive = true }) {
  const dir = b.clone().sub(a), L = dir.length();
  const g = new THREE.Group(); g.position.copy(a); scene.add(g);
  g.quaternion.setFromUnitVectors(V(1, 0, 0), dir.clone().normalize());
  put(g, mk(box(L, 0.03, 0.1), M.steelB), L / 2, -0.045, 0);
  for (const sz of [-0.05, 0.05]) put(g, mk(box(L, 0.045, 0.012), M.steel), L / 2, -0.02, sz);
  if (drive) { put(g, mk(box(L * 0.6, 0.14, 0.16), M.motorG), L * 0.5, -0.14, 0); put(g, mk(box(L * 0.62, 0.02, 0.18), M.dark), L * 0.5, -0.22, 0); }
  const ci = chipInst(n, g);
  let off = 0; const tmp = V(0, 0, 0);
  updaters.push((dt, s) => {
    if (stages.includes(s)) off = (off + dt * speed / L) % 1;
    for (let i = 0; i < n; i++) setI(ci, i, tmp.set(((i / n + off) % 1) * L, 0, 0));
    ci.instanceMatrix.needsUpdate = true;
  });
  return g;
}

/* ------------------------------ process flow (branches) ------------------------------
   FLOW lists the steps in process order. A number is a STAGES index. An object
   { i, label, mark } overrides the list label, or marks the step 'repeat' / 'parallel'.
   A fork { fork, title, opts: [{ key, label, steps, note, onSelect }], def } is a point where the
   line splits into alternative routes. Only the chosen option's steps play; an option
   with no steps skips straight to the step after the fork.
   STAGES indices never change: the animation code keys on them. */
const ROUTE = {};
FLOW.forEach((e) => { if (e.fork) ROUTE[e.fork] = e.def || e.opts[0].key; });
const asStep = (x) => (typeof x === 'number' ? { i: x } : x);
let SEQ = [];
const forkStart = {};
function buildSeq() {
  SEQ = [];
  for (const e of FLOW) {
    if (!e.fork) { SEQ.push(asStep(e)); continue; }
    forkStart[e.fork] = SEQ.length;
    const o = e.opts.find((q) => q.key === ROUTE[e.fork]);
    o.steps.forEach((x) => SEQ.push({ ...asStep(x), fork: e, opt: o }));
  }
}

let curK = 0, lastK = -1;

    x.fillStyle = '#4fd18b'; x.fillText('양품: 충전 전류만', x1 + 20, B - 30); x.fillStyle = '#ff6b6b'; x.fillText('약한 칩: 누설·방전', x0 + 80, B - 80);
    x.strokeStyle = '#fff'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(L + p * (R - L), T0); x.lineTo(L + p * (R - L), B); x.stroke();

  } else if (s === 9) {

    for (const [d, n2, c] of st) {

    x.fillStyle = 'rgba(79,209,139,.18)'; x.fillRect(L + 4, T0, 46, B - T0); x.fillStyle = '#4fd18b'; x.fillText('1–10 ms', L + 4, B - 6);
    x.setLineDash([5, 4]); x.strokeStyle = '#ffb547'; x.beginPath(); x.moveTo(L + 50, B - 60); x.lineTo(R - 10, B - 12); x.stroke(); x.setLineDash([]);
    x.fillStyle = '#ffb547'; x.fillText('→ 약 60 s 값 예측', R - 140, B - 24);
    msg = '턴테이블 위 재측정: 초기 충전 전류로 IR을 예측해 시간 단축 (특허 예, 곡선은 정성적)';
  } else if (s === 7) {

  } else if (s === 10) {

    for (let i = 0; i < 3; i++) {

    x.fillStyle = '#ffb547'; x.fillText('열 활성형: 전면 접착층 · 감압형: 가장자리 두 줄', 20, 238);
    msg = '테이프가 멈춘 동안 가열한 실링 슈가 양쪽 가장자리를 눌러 커버 테이프를 붙임 (모식도)';
  } else if (s === 13) {
    const y0 = 150, xf = 300 - ((t * 20) % 120);
    x.fillStyle = '#e6dcc6'; x.fillRect(40, y0, 520, 22);

    x.strokeStyle = 'rgba(200,226,242,.95)'; x.lineWidth = 5; x.beginPath(); x.moveTo(xf, y0 - 3); x.quadraticCurveTo(xf - 22, y0 - 12, xf, y0 - 24); x.lineTo(560, y0 - 30); x.stroke(); x.lineWidth = 1;
    arrow(x, 520, y0 - 52, 0, 60, '#ffb547'); x.fillStyle = '#ffb547'; x.fillText('당김 165–180°, 300 mm/min', 330, y0 - 64);

    x.fillStyle = '#e6dcc6'; x.beginPath(); x.arc(cx, cy, 30, 0, 7); x.fill();

    x.fillStyle = '#111'; for (let i = 0; i < 18; i++) x.fillRect(cx + 30 + i * 3, cy - 66, i % 3 ? 1.5 : 2.5, 18);
    x.fillStyle = '#e9eef3'; x.fillText('바코드 라벨', cx + 100, cy - 50);

    x.fillStyle = '#b98b56'; x.fillRect(360, 90, 200, 120); x.fillStyle = '#c9a46b'; x.fillRect(360, 140, 200, 12);

      chip2d(x, 300, cy + 4, 50, 28); x.fillStyle = '#c9e2f2'; x.fillRect(120, cy - 26, 360, 4);

/* ------------------------------ literature chart ------------------------------ */
function hbar(x, rows, max, ticks, unit) {
  const L = 190, R = 580, top = 18, rh = (200 - 44) / rows.length;
  const X = (v) => L + v / max * (R - L);
  x.font = '14px system-ui';
  rows.forEach((r, i) => {
    const y = top + i * rh, bh = rh * 0.56;
    x.fillStyle = '#d5dde5'; x.textAlign = 'right'; x.fillText(r.l, L - 8, y + bh * 0.8); x.textAlign = 'left';
    if (r.dash) { x.setLineDash([5, 4]); x.strokeStyle = '#ffb547'; x.lineWidth = 1.5; x.strokeRect(X(0), y, X(r.v) - X(0), bh); x.setLineDash([]); }
    else if (r.lo !== undefined) {
      x.fillStyle = 'rgba(255,181,71,.35)'; x.fillRect(X(0), y, X(r.v) - X(0), bh);
      x.fillStyle = '#ffb547'; x.fillRect(X(r.lo), y, X(r.v) - X(r.lo), bh);
      if (r.mark) { x.fillStyle = '#fff'; x.fillRect(X(r.lo) - 1.5, y - 3, 3, bh + 6); }
    } else { x.fillStyle = '#ffb547'; x.fillRect(X(0), y, X(r.v) - X(0), bh); }
    x.fillStyle = '#e9eef3'; x.fillText(r.t, Math.min(X(r.v) + 6, R - 60), y + bh * 0.8);
  });
  x.strokeStyle = 'rgba(255,255,255,.25)'; x.beginPath(); x.moveTo(L, 176); x.lineTo(R, 176); x.stroke();
  x.fillStyle = '#9db0c2'; x.font = '13px system-ui'; x.textAlign = 'center';
  for (const v of ticks) { x.fillRect(X(v), 174, 1, 5); x.fillText(v.toLocaleString('en-US'), X(v), 194); }
  x.textAlign = 'right'; x.fillText(unit, L - 8, 194); x.textAlign = 'left';
}
function drawLit(s) {
  const cv = document.getElementById('lit'); if (!cv) return;
  const x = cv.getContext('2d');
  x.clearRect(0, 0, cv.width, cv.height);
  const k = litOf(s);
  if (k === 0) hbar(x, [
    { l: '핸들러 사양 0603–1210', v: 16666, t: '16,666' },
    { l: 'Murata 사내 측정', v: 10000, t: '> 10,000' },
    { l: '핸들러 ~0201 (미확인)', v: 20000, t: '20,000', dash: true },
  ], 20000, [0, 5000, 10000, 15000, 20000], '개/분');
  else if (k === 1) hbar(x, [
    { l: 'NEPP Level 1', v: 168, t: '168 h' }, { l: 'NEPP Level 2', v: 96, t: '96 h' }, { l: 'NEPP Level 3', v: 48, t: '48 h' },
    { l: 'M55681 (@T_max)', v: 100, t: '100 h' }, { l: 'M123 · M32535', v: 264, lo: 168, t: '168–264 h' },
  ], 300, [0, 50, 100, 150, 200, 250, 300], 'h');
  else if (k === 3) hbar(x, [
    { l: '6면 외관 검사기', v: 12000, t: '12,000' },
    { l: '측정·테이핑기', v: 5000, t: '5,000' },
    { l: '휠 외관 검사 (특허)', v: 1167, t: '≥ 1,167' },
    { l: '검사 테이핑기 (SMD)', v: 500, t: '500' },
    { l: '테이핑기 @1005 (미확인)', v: 1300, t: '1,300', dash: true },
  ], 12000, [0, 3000, 6000, 9000, 12000], '개/분');
  else if (k === 4) hbar(x, [
    { l: '8 mm 테이프', v: 1.0, lo: 0.1, t: '0.1–1.0 N' },
    { l: '12 mm 테이프', v: 1.3, lo: 0.1, t: '0.1–1.3 N' },
    { l: '24 mm (미확인)', v: 1.6, t: '0.1–1.6 N', dash: true },
    { l: '부품사 예 (미확인)', v: 0.6, t: '0.1–0.6 N', dash: true },
  ], 1.8, [0, 0.5, 1, 1.5], 'N');
  else hbar(x, [
    { l: '01005', v: 30000, lo: 20000, t: '20,000 / 30,000', mark: true },
    { l: '0201', v: 15000, t: '15,000' }, { l: '0402', v: 10000, t: '10,000' },
    { l: '0603', v: 10000, lo: 4000, t: '4,000 / 10,000', mark: true },
    { l: '0805', v: 10000, lo: 4000, t: '4,000 / 10,000', mark: true },
  ], 30000, [0, 10000, 20000, 30000], '개/릴');
}

/* ------------------------------ loop ------------------------------ */
const clock = new THREE.Clock();
let infoTick = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const sdt = playing ? dt * speed : 0;
  simT += sdt;
  const total = simT / STAGE_DUR;
  const k = Math.floor(total) % SEQ.length, p = total - Math.floor(total), t = simT;
  const s = SEQ[k].i;
  if (k !== lastK) {
    lastK = curK = k; lastStage = s;
    seqBtns.forEach((b, n) => b.classList.toggle('active', n === k));
    { // keep the active step visible in the list (horizontal on phones, scrolling panel on short screens)
      const btn = seqBtns[k], list = document.getElementById('stages'), panel = document.getElementById('left');
      if (btn) {
        const br = btn.getBoundingClientRect();
        if (list.scrollWidth > list.clientWidth + 2) { const lr = list.getBoundingClientRect(); list.scrollTo({ left: list.scrollLeft + br.left - lr.left - (list.clientWidth - br.width) / 2, behavior: 'smooth' }); }
        if (panel.scrollHeight > panel.clientHeight + 2) { const pr = panel.getBoundingClientRect(); if (br.top < pr.top || br.bottom > pr.bottom) panel.scrollTo({ top: panel.scrollTop + br.top - pr.top - (panel.clientHeight - br.height) / 2, behavior: 'smooth' }); }
      }
    }
    stageTags.forEach((el, i) => el.classList.toggle('active', i === s));
    SUBS.forEach((q) => q.el.classList.toggle('show', q.s === s));
    renderInfo(k);
    drawLit(s);
    if (autoTour) flyTo(s);
  }
  seqBtns.forEach((b, n) => { b.querySelector('.bar').style.width = n === k ? `${p * 100}%` : '0'; });

  for (const r of rotors) {
    const target = r.run.includes(s) ? r.w : r.w * 0.06;
    r.cur += (target - r.cur) * Math.min(1, dt * 1.5);
    r.obj.rotation[r.axis] += r.cur * sdt;
  }
  for (const u of updaters) u(sdt, s, p, t);

  if (tween) {
    tween.k = Math.min(1, tween.k + dt / 2.2);
    const e = sm(tween.k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.k >= 1) tween = null;
  }
  infoTick += dt;
  if (infoTick > 1 / 30) { infoTick = 0; drawMicro(s, p, t); }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
document.getElementById('loading').remove();
frame();
</script>
