<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLCC 절단·사이드 마진 3D</title>
<style>
  :root {
    --panel: rgba(15, 20, 27, 0.80);
    --panel-line: rgba(255, 255, 255, 0.12);
    --text: #e9eef3;
    --muted: #9db0c2;
    --accent: #ffb547;
    --accent-ink: #1d1406;
    --g: #8fd0ff;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2229; color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .tag { pointer-events: auto; cursor: pointer; transform: translateY(-6px);
    background: rgba(14, 18, 24, 0.84); color: var(--text); border: 1px solid rgba(255,255,255,.2);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; white-space: nowrap; transition: background .25s, color .25s; }
  .tag b { color: var(--accent); margin-right: 4px; }
  .tag.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tag.active b { color: var(--accent-ink); }
  .sub { pointer-events: none; font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: rgba(255,255,255,.88); color: #1d242c; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .sub.show { opacity: 1; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #left { top: 16px; left: 16px; width: 268px; padding: 14px 14px 12px; }
  #left h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: -.01em; }
  #left .sub-h { font-size: 11.5px; color: var(--muted); margin: 0 0 10px; }
  #stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  #stages button { width: 100%; text-align: left; background: transparent; color: var(--text); border: 0;
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #stages button:hover { background: rgba(255,255,255,.07); }
  #stages button.active { background: rgba(255,181,71,.16); color: #fff; }
  #stages .n { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px;
    background: rgba(255,255,255,.1); flex: none; }
  #stages button.active .n { background: var(--accent); color: var(--accent-ink); }
  #stages .bar { height: 2px; background: var(--accent); width: 0; border-radius: 2px; margin-top: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .controls button, .controls select { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line);
    border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #info { right: 16px; bottom: 16px; width: 390px; max-height: calc(100vh - 32px); overflow: auto; padding: 16px; box-sizing: border-box; }
  #info .head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
  #info .fold { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--panel-line); border-radius: 8px; padding: 3px 8px; font: inherit; font-size: 11.5px; cursor: pointer; flex: none; }
  #info.collapsed .body { display: none; }
  #info.collapsed h2 { margin-bottom: 0; }
  #info .kicker { font-size: 11px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
  #info h2 { font-size: 18px; margin: 2px 0 6px; }
  #info p { font-size: 13px; line-height: 1.55; color: #d5dde5; margin: 0 0 10px; }
  #info h3 { font-size: 11.5px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; letter-spacing: .03em; }
  #info ul { margin: 0; padding-left: 16px; font-size: 12.5px; line-height: 1.55; }
  #info li { margin-bottom: 2px; }
  #info code { font-size: 11px; color: var(--g); }
  .g { color: #ffcf8a; font-size: 11px; }
  .canvas-wrap { margin-top: 8px; background: rgba(0,0,0,.25); border-radius: 8px; padding: 6px; }
  .canvas-wrap canvas { width: 100%; display: block; }
  .cap { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .foot { font-size: 10.5px; color: var(--muted); margin-top: 12px; line-height: 1.5; border-top: 1px solid var(--panel-line); padding-top: 8px; }
  /* process-flow branches */
  #left { max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; }
  #stages li.fork { display: grid; gap: 3px; margin: 3px 0; padding: 6px 6px 6px 7px;
    border: 1px dashed rgba(255,255,255,.2); border-radius: 10px; }
  #stages .fork-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; padding: 0 2px 2px; }
  #stages .fk { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  #stages .seg { display: inline-flex; background: rgba(255,255,255,.07); border-radius: 999px; padding: 2px; gap: 2px; }
  #stages .seg button { width: auto; display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; color: var(--muted); }
  #stages .seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  #stages .opt { display: grid; gap: 2px; padding-left: 7px; border-left: 2px solid rgba(255,255,255,.14); }
  #stages .opt.on { border-left-color: var(--accent); }
  #stages .opt-label { font-size: 10.5px; color: var(--muted); padding: 1px 0 0 2px; }
  #stages .opt.off > button { opacity: .45; }
  #stages .opt.off .n { background: transparent; border: 1px dashed rgba(255,255,255,.3); }
  #stages .skip { font-size: 11.5px; line-height: 1.45; color: var(--muted); padding: 3px 8px 4px; }
  #stages .mk { font-size: 10.5px; color: var(--muted); margin-left: 5px; white-space: nowrap; }
  .tag.off { opacity: .35; }
  @media (max-width: 820px) {
    #left { max-height: none; overflow: visible; }
    #stages li.fork { display: flex; align-items: center; gap: 4px; padding: 3px 5px; margin: 0; }
    #stages .fork-head { padding: 0; }
    #stages .fk { display: none; }
    #stages .opt { display: flex; gap: 4px; border-left: 0; padding-left: 0; }
    #stages .opt.off, #stages .opt-label { display: none; }
    #stages .skip { white-space: nowrap; padding: 0 4px; font-size: 11px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); }
  @media (max-width: 820px) {
    #left { left: 8px; right: 8px; top: 8px; width: auto; padding: 10px; }
    #left .sub-h { display: none; }
    #stages { display: flex; overflow-x: auto; gap: 4px; }
    #stages li { flex: none; }
    #stages button { white-space: nowrap; padding: 5px 8px; }
    #info { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 40vh; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="loading">3D 설비 모형을 불러오는 중…</div>

<div id="left" class="panel">
  <h1>MLCC 칩 절단 · 사이드 마진 공정</h1>
  <p class="sub-h">압착 블록 마운팅, 압절(또는 다이싱) 절단, 익스팬드, 사이드 마진 부착(고용량 경로), 칩 박리 · 회수까지 설비 3D 모형</p>
  <ol id="stages"></ol>
  <div class="controls">
    <button id="play">❚❚ 일시정지</button>
    <select id="speed" aria-label="재생 속도">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
    <button id="overview">전체 보기</button>
    <label><input type="checkbox" id="tour" checked> 카메라 따라가기</label>
    <label><input type="checkbox" id="cut" checked> 단면 보기</label>
  </div>
</div>

<div id="info" class="panel"></div>

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------
   Stage data — parameters come only from
   resources/manufacturing/eq-06-cutting.md (equipment & step order, 2026-11-11),
   resources/manufacturing/40-lamination-and-dicing.md,
   wiki/concepts/green-chip-cutting-and-side-margin.md,
   wiki/concepts/mlcc-margin-cover-design-rules.md and

// Station x positions along the line (left → right).
const MX = -24, PCX = -15.5, DX = -7, IX = 2, EX = 9, TX = 13.6, AX = 19, PX = 27.5;
const cite = (...k) => k.map((x) => `<code>[${x}]</code>`).join(' ');
const G = '<span class="g">(g)</span>';
const STAGES = [
  { name: '블록 마운팅', en: 'Block mounting',
    cam: [MX + 2.6, 4.2, 7.2, MX + 0.4, 1.2, 0],
    desc: '압착을 마친 적층 블록을 점착 시트 위에 고정합니다. 시트가 절단 중 블록과 잘린 칩을 잡아 두고, 뒤 공정에서 시트를 늘리거나(익스팬드) 데워서 칩을 떼어 냅니다. 롤러로 시트를 붙이고 블록을 옮겨 놓는 마운터 구조는 문헌에 없어 일반 관행으로 그렸습니다.',
    equip: [`금속 베이스 + 필름 + 점착층으로 블록 고정 ${cite('jp3331884b2')}`,
      `확장형 점착 시트 (PVC 기재 + 아크릴 점착제) ${cite('us8795454')}`,
      `열박리 시트: 상온에서 붙고 데우면 떨어짐 ${cite('nitto-revalpha-web')} · 발포제 점착층 ${cite('jp3331884b2')}`,
      `테이프 라미네이트 롤러 · 링 프레임 · 진공 픽업 헤드 · 블록 대기대 ${G}`],
    params: [`필름 25–100 µm, 표면 Ra ≤ 10 µm, 필름–그린시트 접착 30–150 gf/50 mm ${cite('jp3331884b2')}`,
      `앞 공정의 최종 압착: 40–100 °C, 10–200 MPa ${cite('us7641727')} · WIP 약 85 °C, 1000 kgf/cm² ${cite('us8953300')}`,
      `내부 층수 100–1000 (예 560층) ${cite('us10573466')} · 부착형 실시예 0603, ≥ 400층 ${cite('us11348730', 'us11600441')}`] },
  { name: 'C1 다이싱', en: 'Dicing C1',
    cam: [DX + 2.6, 3.3, 5.0, DX, 1.35, 0],
    desc: '회전 블레이드 다이싱기로 블록을 자르는 경로입니다. 정렬 카메라로 절단선을 맞춘 뒤, 척 테이블이 X축으로 왕복하는 동안 블레이드가 한 줄씩 내려와 테이프 직전까지 자르고, 스핀들은 다음 절단선으로 옮겨 갑니다. 무른 그린 블록은 다이싱으로 빨리 자르기 어려워, 블록을 데워 굳힌 뒤 자르는 방법도 있습니다. 사이드 마진 부착 경로에서는 C1·C2 절단선이 전극 겹침부 중앙을 지나 전극이 양 측면까지 닿습니다.',
    equip: [`다이싱기 (회전 블레이드) ${cite('us10573466', 'adt-mlcc-dicing-web')}`,
      `니켈 본드 블레이드 (생 세라믹 시트 절단용) ${cite('accretech-mn-web')}`,
      `2-스핀들 슬라이싱기: 피치가 다른 멀티 블레이드 ${cite('yac-dls-web')}`,
      `절삭수 노즐: 건식 · 습식 모두 가능 ${cite('adt-mlcc-dicing-web')}`,
      `스핀들 · 블레이드 커버 · 척 테이블 · X축 스테이지 · 정렬 카메라 ${G}`],
    params: [`블레이드 Ø 2–4", 두께 0.15–0.35 mm, 다이아몬드 30–70 µm, 이송 50–250 mm/s, 12–30 krpm ${cite('adt-mlcc-dicing-web')} (그린 · 소성 구분 없음)`,
      `미경화 블록은 2 mm/s, 150 °C · 5 h 경화 블록은 50 mm/s에서 같은 면 거칠기 (절단 시간 1/25) ${cite('us6526958')}`,
      `과제: 건식 분진, 블레이드 막힘, 층 번짐 · 단락 ${cite('adt-mlcc-dicing-web')}`,
      `절단선 C1 · C2는 직교하고 전극 겹침부 중앙을 지남 ${cite('us11348730', 'us11600441')}`] },
  { name: '90° 회전 · C2 다이싱', en: 'Rotate & dice C2',
    cam: [DX - 2.9, 3.5, 4.8, DX, 1.35, 0],
    desc: '척 테이블을 90° 돌려 직교 방향으로 다시 자르면 블록이 개별 칩으로 나뉩니다. 잘린 끝면에는 내부전극이 극성을 번갈아 드러내고, 이 끝면이 나중에 외부전극과 연결됩니다. 사이드 마진 부착 경로에서는 전극이 양 측면까지 닿도록 자르고, 인쇄 마진 경로에서는 측면에 인쇄 마진이 남도록 자릅니다.',
    equip: [`다이싱기 (같은 장비) ${cite('us10573466')}`, `척 θ 90° 회전 ${G}`],
    params: [`끝면에서 전극이 번갈아 노출 → 단자 연결 ${cite('us11348730', 'us11600441')}`,
      `부착형 공정: 바(bar) 적층체를 C2로 먼저 잘라 양 측면에 전극 노출 ${cite('us11348730', 'us11600441')}`,
      `전극을 측면까지 내면 사이드 마진 단차(step)도 사라짐 ${cite('us11348730', 'us11600441')}`] },
  { name: '절단 위치 검사', en: 'Cut-position check',
    cam: [IX + 2.5, 3.6, 5.4, IX, 1.35, 0],
    desc: '절단선이 설계 위치에서 벗어나면 전극이 설계 위치를 벗어나 절연과 내환경성이 나빠집니다. 전극 패턴의 절단선 위치에 일부 공백(blank)을 두면 카메라·현미경으로 어긋남을 쉽게 볼 수 있습니다. 잘린 그린 칩의 외관 · 치수 검사 설비는 문헌에서 찾지 못했습니다.',
    equip: [`현미경 · 카메라 검사 ${cite('us6091598')} (검색 발췌만 읽음)`, `XY 갠트리 · 링 조명 · 검사 모니터 ${G}`],
    params: [`전극 패턴 절단선의 부분 공백 → 위치 어긋남 가시화 ${cite('us6091598')}`,
      `어긋남 → 절연 · 내환경성 저하. 박층일수록 현미경 판정이 어려움 ${cite('us6091598')}`,
      '허용 공차 수치: 문헌에 없음'] },
  { name: '사이드 마진 펀칭 (1면)', en: 'Side-margin punch',
    cam: [AX + 2.2, 3.0, 5.3, AX + 0.1, 1.5, 0],
    desc: '전극이 드러난 측면을 아래로 향하게 잡은 칩들을 세라믹 사이드 마진 시트에 눌러 넣습니다. 시트 아래 탄성체(고무 · PDMS · 실리콘 패드)가 눌려 변형되면서 시트가 칩 측면 크기만큼 잘려 측면에 붙고 모서리까지 감쌉니다. 구멍 난 나머지 시트는 권취 롤로 감아 걷어 냅니다.',
    equip: [`펀칭 패드: 고무 / PDMS / 실리콘 ${cite('us11348730', 'us11600441')} · 탄성체 탄성률 ≤ 50 MPa, 두께 ≤ 5 mm ${cite('us8795454')}`,
      `시트 공급 · 권취 롤 → 남은 시트를 롤로 분리 ${cite('us8795454')}`,
      `점착 시트 칩 재고정 · 칩 지그 ${cite('us11348730', 'us10460876')}`,
      `서보 프레스 (모터 · 볼스크루 · 4기둥) ${G}`],
    params: [`시트 두께 10–50 µm, 파단 강도 1–50 MPa, 파단 변형 ≤ 50% ${cite('us8795454')}`,
      `눌러 넣는 깊이 ≤ 이웃 칩 간격의 1/2 ${cite('us8795454')}`,
      `다른 방식: 시트를 50–100 °C로 데워 칩에 댄 뒤 ≤ 30 °C로 식혀 펀칭 ${cite('us10453615')}`,
      `부착 마진 평균 2–10 µm (인쇄형 ≥ 20 µm) ${cite('us11348730')} · 폭 A = 11 µm, 균일비 A1/A 0.9–1.0 ${cite('us11600441')}`] },
  { name: '회전 · 반대면 부착', en: 'Rotate & other side',
    cam: [AX + 3.9, 3.1, 5.2, AX + 1.1, 1.5, 0.1],
    desc: '칩을 다시 돌려(지그 180° 회전, 또는 전도판으로 90° 두 번) 반대 측면이 시트를 향하게 하고, 펀칭 → 남은 시트 제거 → 열압착을 되풀이합니다. 변형 공정에서는 시트를 덮은 탄성체에 칩을 눌러 넣어 전단력으로 잘린 조각을 측면에 남깁니다. 이후 탈바인더 · 소성으로 갑니다.',
    equip: [`칩 지그 회전 (90° / 180°) ${cite('us11348730', 'us11600441')}`, `전도를 두 번 해 반대면 노출 ${cite('us8795454')}`, `변형: 탄성체 전단 부착 ${cite('us10460876')}`],
    params: [`한계: < 2 µm는 강도 약화 · 흡습 · 단락, > 10–15 µm는 용량 손실 ${cite('us11348730', 'us11600441')}`,
      `측면–마진 틈(진입부) ≤ 엔드 마진의 30% → 내습 시험 불량 ≤ 10% ${cite('us10460876')}`,
      `내습 불량 기준 IR < 10 MΩ (45 °C / 95% RH / 10 V) ${cite('us10460876')}`,
      `계면 보이드 → 전계 집중 · BDV 저하, 마진 소결 밀도 낮으면 내습성 저하 ${cite('us11348730')}`] },

// Layered side-face texture: electrode lines in the green ceramic.
function stripeTex(n = 14, rot = false) {
  const c = document.createElement('canvas'); c.width = 64; c.height = 256;
  const x = c.getContext('2d'); x.fillStyle = '#ddd6c4'; x.fillRect(0, 0, 64, 256);
  x.fillStyle = '#7f858b';
  for (let i = 0; i < n; i++) { const y = 34 + 188 * (i + 0.5) / n; x.fillRect(0, y - 2, 64, 4); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (rot) { t.center.set(0.5, 0.5); t.rotation = Math.PI / 2; }

// Merge every static single-material mesh under `root` into one mesh per material.
// Objects in `keep` (animated parts) and the cut/full toggled shells stay as they are.
function bake(root, keep = []) {
  const skip = new Set([...keep, ...fullParts, ...cutParts]);
  root.updateMatrixWorld(true);
  const inv = root.matrixWorld.clone().invert();
  const buckets = new Map(), moved = [];
  const walk = (o) => {
    for (const c of o.children) {
      if (skip.has(c)) continue;
      const geo = c.geometry;
      if (c.isMesh && !c.isInstancedMesh && !Array.isArray(c.material) && c.visible && !c.children.length &&
          geo.attributes.position && geo.attributes.normal && geo.attributes.uv) {
        const key = c.material.uuid + (c.castShadow ? 's' : 'n');
        let b = buckets.get(key);
        if (!b) buckets.set(key, (b = { mat: c.material, cast: c.castShadow, geos: [] }));
        const g2 = geo.index ? geo.toNonIndexed() : geo.clone();
        g2.clearGroups();
        for (const n of Object.keys(g2.attributes)) if (n !== 'position' && n !== 'normal' && n !== 'uv') g2.deleteAttribute(n);
        g2.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, c.matrixWorld));
        b.geos.push(g2); moved.push(c);
      } else if (c.children.length) walk(c);
    }
  };
  walk(root);
  for (const b of buckets.values()) {
    const merged = b.geos.length === 1 ? b.geos[0] : mergeGeometries(b.geos);
    if (!merged) continue;
    const m = new THREE.Mesh(merged, b.mat); m.castShadow = b.cast; m.receiveShadow = true; root.add(m);
  }
  for (const c of moved) c.parent.remove(c);
}

const ZC = 0.64;
function makePressBlock(parent, y) {
  const g = new THREE.Group(); g.position.y = y; parent.add(g);
  put(g, mk(box3(BL, BT, 2 * ZC), blockMats), 0, BT / 2, 0);
  const strips = [-1, 1].map((sg) => {

  });

    const m = new THREE.InstancedMesh(geo, mat, pts.length); m.frustumCulled = false;
    pts.forEach(([x, yy, z], i) => setInst(m, i, x, yy, z)); m.count = 0; g.add(m); return m;
  };

  const marks = inst(box(0.035, 0.07, 0.008), M.mark, [...LINES.map((x) => [x, BT / 2, ZC + 0.003]), ...LINES.map((x) => [x, BT / 2, -ZC - 0.003])]);

function pressRun(p, zs, st, en) {
  const N = zs.length, f = clamp01((p - st) / (en - st)) * N;

}

/* ------------------------------ process flow (branches) ------------------------------

  rows.forEach((r, i) => {
    const y = 26 + i * 38, hl = i < 2 ? attached : !attached && i >= 2;
    x.globalAlpha = hl || pre ? 1 : 0.45;
    x.fillStyle = '#e9eef3'; x.font = '15px system-ui'; x.fillText(r[0], 6, y + 5);
    x.fillStyle = '#8fd0ff'; x.font = '10px system-ui'; x.fillText(`[${r[4]}]`, 6, y + 19);
    const col = i < 2 ? '#ffb547' : i === 2 ? '#c9c2b0' : i === 3 ? '#8fd0ff' : '#9fb8b4';
    x.fillStyle = col; x.strokeStyle = col; x.lineWidth = 2;
    if (r[3] === 'range') {
      x.fillRect(X(r[1]), y - 7, X(r[2]) - X(r[1]), 14);
      x.font = '13px system-ui'; x.fillText(`${r[1]}–${r[2]}`, X(r[2]) + 6, y + 5);
    } else if (r[3] === 'pts') {
      x.beginPath(); x.arc(X(r[1]), y, 7, 0, 7); x.fill();
      x.beginPath(); x.arc(X(r[2]), y, 6, 0, 7); x.stroke();
      x.font = '13px system-ui'; x.fillText('11', X(r[1]) - 8, y - 11); x.fillText('20 (비교 칩)', X(r[2]) + 10, y + 5);
    } else {
      x.fillRect(X(r[1]) - 1, y - 9, 3, 18);
      x.beginPath(); x.moveTo(X(r[1]), y); x.lineTo(X(r[1]) + 60, y); x.stroke();
      x.beginPath(); x.moveTo(X(r[1]) + 60, y - 6); x.lineTo(X(r[1]) + 70, y); x.lineTo(X(r[1]) + 60, y + 6); x.fill();
      x.font = '13px system-ui'; x.fillText('≥ 20', X(r[1]) + 76, y + 5);
    }
  });
  x.globalAlpha = 1;
  x.fillStyle = '#ff8f6b'; x.font = '12px system-ui'; x.fillText('< 2 µm 취약', X(1) + 2, AX - 6);
}

/* ------------------------------ loop ------------------------------ */
const clock = new THREE.Clock();
let infoTick = 0, hmiTick = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (playing) simT += dt * speed;
  const total = simT / STAGE_DUR;
  const k = Math.floor(total) % SEQ.length, p = total - Math.floor(total), t = simT;
  const s = SEQ[k].i;
  if (k !== lastK) {
    lastK = curK = k; lastStage = s;
    seqBtns.forEach((b, n) => b.classList.toggle('active', n === k));
    { // keep the active step visible in the list (horizontal on phones, scrolling panel on short screens)
      const btn = seqBtns[k], list = document.getElementById('stages'), panel = document.getElementById('left');
      if (btn) {
        const br = btn.getBoundingClientRect();
        if (list.scrollWidth > list.clientWidth + 2) { const lr = list.getBoundingClientRect(); list.scrollTo({ left: list.scrollLeft + br.left - lr.left - (list.clientWidth - br.width) / 2, behavior: 'smooth' }); }
        if (panel.scrollHeight > panel.clientHeight + 2) { const pr = panel.getBoundingClientRect(); if (br.top < pr.top || br.bottom > pr.bottom) panel.scrollTo({ top: panel.scrollTop + br.top - pr.top - (panel.clientHeight - br.height) / 2, behavior: 'smooth' }); }
      }
    }
    stageTags.forEach((el, i) => el.classList.toggle('active', i === s));
    SUBS.forEach((q) => q.el.classList.toggle('show', q.s === s));
    renderInfo(k);
    if (autoTour) flyTo(s);
  }
  seqBtns.forEach((b, n) => { b.querySelector('.bar').style.width = n === k ? `${p * 100}%` : '0'; });

  for (const r of rotors) {
    const target = r.run.includes(s) ? r.w : r.w * 0.04;
    r.cur += (target - r.cur) * Math.min(1, dt * 1.5);
    r.obj.rotation[r.axis] += r.cur * dt;
  }
  for (const u of updaters) u(dt, s, p, t);
  for (const tw of towers) {
    const on = tw.stagesOn.includes(s);
    const blink = on ? 1 : 0.5 + 0.5 * Math.sin(t * 3);
    tw.mats[0].emissiveIntensity = 0.05;
    tw.mats[1].emissiveIntensity = on ? 0.05 : 0.2 + 0.9 * blink * 0.4;
    tw.mats[2].emissiveIntensity = on ? 1.6 : 0.05;
  }
  hmiTick += dt;
  if (hmiTick > 0.15) {
    hmiTick = 0;
    for (const h of hmis) { h.draw(h.c.getContext('2d'), s, p, t); h.tex.needsUpdate = true; }
  }

  if (tween) {
    tween.k = Math.min(1, tween.k + dt / 2.2);
    const e = sm(tween.k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.k >= 1) tween = null;
  }
  infoTick += dt;
  if (infoTick > 1 / 30) { infoTick = 0; drawMicro(s, p, t); drawChart(s); }

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
document.getElementById('loading').remove();
frame();
</script>
</body>
